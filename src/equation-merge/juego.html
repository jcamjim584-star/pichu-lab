<html lang="es">
<head>
<meta charset="utf-8">

<title>Equation Merge · Ecuaciones · MathQuest</title>

<link rel="icon" href="../../compartido/img/icono-192.png">
<style>
@font-face{font-family:"Lato";font-weight:400;font-display:swap;src:url("../../compartido/fuentes/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-display:swap;src:url("../../compartido/fuentes/lato-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-display:swap;src:url("../../compartido/fuentes/lato-latin-900-normal.woff2") format("woff2")}
:root{--fondo1:#1b1140;--fondo2:#3b1d6e;--panel:#2a1a5e;--panel2:#3a2780;--linea:#5b46b0;--texto:#f5f3ff;--suave:#cfc6f5;
  --oro:#fde047;--verde:#4ade80;--rojo:#fb7185;--cian:#67e8f9}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);
  background:radial-gradient(120% 80% at 50% 0%,var(--fondo2),var(--fondo1) 70%) fixed;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
sup{font-size:.6em;vertical-align:super;line-height:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.pantalla{position:fixed;inset:0;display:none;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.pantalla.activa{display:flex}
body.jugando #pichu-volver{display:none}

/* ---------- Botones ---------- */
.btn{min-height:48px;padding:.55em 1.2em;border-radius:16px;border:0;font-weight:900;letter-spacing:.02em;
  background:linear-gradient(#a78bfa,#7c3aed);color:#fff;box-shadow:0 5px 0 #4c1d95,0 8px 18px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4c1d95}
.btn.oro{background:linear-gradient(#fde047,#f59e0b);color:#3b1d00;box-shadow:0 5px 0 #b45309,0 8px 18px rgba(0,0,0,.35);text-shadow:none}
.btn.oro:active{box-shadow:0 2px 0 #b45309}
.btn.gris{background:linear-gradient(#4b3a94,#35276f);box-shadow:0 5px 0 #1f1547,0 8px 18px rgba(0,0,0,.3)}
.btn.gris:active{box-shadow:0 2px 0 #1f1547}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.grande{font-size:1.5rem;min-height:68px;padding:.5em 2em;border-radius:22px}
.redondo{width:48px;height:48px;border-radius:50%;border:2px solid var(--linea);background:var(--panel);font-size:1.3rem;font-weight:900;display:grid;place-items:center;flex:none}

/* ---------- Menú ---------- */
#pMenu{flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:auto;text-align:center}
.logo{font-weight:900;font-size:clamp(2.6rem,13vw,5rem);line-height:.9;letter-spacing:.01em;margin:0;
  background:linear-gradient(180deg,#fff 10%,#fde047 45%,#fb7185 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #4c1d95) drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.logo small{display:block;font-size:.26em;letter-spacing:.2em;color:var(--cian);-webkit-text-fill-color:var(--cian);margin-top:.6em}
.kubo{width:min(34vw,150px);animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-10px) rotate(-3deg)}}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cartera{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.35em .9em;border-radius:999px;background:rgba(0,0,0,.3);border:2px solid var(--linea)}
.pie{font-size:.85rem;color:var(--suave);margin:0}
.pie a{color:var(--cian);font-weight:700}

/* ---------- Mapa de niveles ---------- */
#pMapa{flex-direction:column;gap:8px}
.barra{display:flex;align-items:center;gap:10px}
.barra h2{margin:0;font-size:1.3rem;font-weight:900;flex:1}
#listaNiveles{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 80px;display:grid;gap:10px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.esc{grid-column:1/-1;margin:.6em 0 0;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cian);font-weight:900}
.nivel{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:18px;border:2px solid var(--linea);
  background:linear-gradient(160deg,var(--panel2),var(--panel));min-height:76px}
.nivel .n{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;font-weight:900;
  background:linear-gradient(#a78bfa,#7c3aed);box-shadow:0 4px 0 #4c1d95}
.nivel.jefe .n{background:linear-gradient(#fb7185,#be123c);box-shadow:0 4px 0 #881337}
.nivel.inf .n{background:linear-gradient(#67e8f9,#0891b2);box-shadow:0 4px 0 #155e75;color:#082f49}
.nivel b{display:block;font-size:1.05rem}
.nivel span{font-size:.85rem;color:var(--suave)}
.nivel .est{margin-left:auto;font-size:1.1rem;letter-spacing:.05em;white-space:nowrap;color:var(--oro)}
.nivel[disabled]{opacity:.5;filter:grayscale(.6)}
.misiones{grid-column:1/-1;border-radius:18px;background:rgba(0,0,0,.25);border:2px dashed var(--linea);padding:10px 12px}
.misiones h3{margin:0 0 6px;font-size:1rem}
.mision{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.9rem;margin:6px 0}
.prog{grid-column:1/-1;height:8px;border-radius:9px;background:#1f1547;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cian),var(--verde));border-radius:9px}

/* ---------- Partida ---------- */
#pJuego{display:none;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:6px;touch-action:none}
#pJuego.activa{display:grid}
#hud{display:flex;align-items:center;gap:8px}
#hud .tit{flex:1;min-width:0}
#hud .tit b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
#hud .tit span{font-size:.8rem;color:var(--suave)}
.dato{flex:none;min-width:58px;text-align:center;padding:3px 8px;border-radius:12px;background:rgba(0,0,0,.3);border:2px solid var(--linea)}
.dato b{display:block;font-size:1.25rem;line-height:1.1}
.dato span{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.dato.poco b{color:var(--rojo)}
#pedidos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pedido{position:relative;min-height:66px;padding:4px 4px 6px;border-radius:14px;border:2px solid #fde68a;background:linear-gradient(#fffbeb,#fde68a);
  color:#3b1d00;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #b45309}
.pedido .etq{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7c4a03;font-weight:700}
.pedido .txt{font-size:clamp(1.05rem,5.2vw,1.6rem);line-height:1.15;white-space:nowrap}
.pedido.largo .txt{font-size:clamp(.82rem,3.7vw,1.2rem);white-space:normal;text-wrap:balance}
.pedido.frase .txt{font-size:clamp(.72rem,3.2vw,.95rem);white-space:normal;line-height:1.2;text-wrap:balance}
.pedido .paso{font-size:.66rem;color:#7c4a03;font-weight:700;margin-top:2px}
.pedido.vacio{background:rgba(0,0,0,.2);border-color:var(--linea);box-shadow:none;color:var(--suave);font-size:1.4rem}
.pedido.entra{animation:entra .35s cubic-bezier(.2,1.5,.5,1)}
.pedido .bombilla{position:absolute;right:4px;top:2px;font-size:.75rem}
@keyframes entra{from{transform:scale(.3);opacity:0}}
#medio{display:flex;align-items:center;gap:8px;min-height:44px}
#progreso{flex:none;display:flex;gap:3px;flex-wrap:wrap;max-width:36%}
#progreso i{width:11px;height:11px;border-radius:50%;background:#1f1547;border:2px solid var(--linea)}
#progreso i.ok{background:var(--verde);border-color:#bbf7d0}
#cinta{flex:1;text-align:center;font-weight:900;font-size:clamp(.9rem,4vw,1.15rem);line-height:1.2;color:var(--oro);min-height:1.2em}
#cinta.info{color:var(--cian);font-weight:700;font-size:clamp(.8rem,3.5vw,1rem)}
#jefe{display:none;align-items:center;gap:8px;flex:none}
#jefe svg{width:46px;height:46px}
#jefe.golpe svg{animation:golpe .4s}
@keyframes golpe{25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}
#jefe .vida{width:70px;height:10px;border-radius:9px;background:#1f1547;overflow:hidden;border:1px solid var(--linea)}
#jefe .vida i{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#be123c);transition:width .3s}
#jefe small{display:block;font-size:.68rem;color:var(--suave);font-weight:700}
#zona{position:relative;display:grid;place-items:center;min-height:0;min-width:0}
#tablero{position:relative;border-radius:5%;background:#160d36;box-shadow:inset 0 0 0 3px var(--linea),0 10px 30px rgba(0,0,0,.45)}
#tablero.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#tablero.temblor{animation:temblor .45s}
@keyframes temblor{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.hueco{position:absolute;border-radius:18%;background:#22154f}
.ficha{position:absolute;left:0;top:0;border:0;padding:0;border-radius:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;line-height:1;transition:transform .12s ease-out;will-change:transform;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 -.14em 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35)}
.ficha .v{display:block}
.ficha small{display:block;font-size:.36em;margin-top:.25em;opacity:.95;font-weight:700;text-shadow:none}
.ficha .in{display:flex;flex-direction:column;align-items:center}
.g1{--c1:#3b82f6;--c2:#1d4ed8;--cl:#bfdbfe}.g2{--c1:#c026d3;--c2:#86198f;--cl:#f5d0fe}.g3{--c1:#ea580c;--c2:#b93a0a;--cl:#fed7aa}.g4{--c1:#16a34a;--c2:#166534;--cl:#bbf7d0}
.x{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.ficha.v10 .in{outline:2px solid rgba(255,255,255,.55);outline-offset:.28em;border-radius:14%}
.ficha.v16{box-shadow:0 0 0 3px var(--oro),0 0 16px var(--oro),inset 0 -.14em 0 rgba(0,0,0,.22)}
.ficha.num{background:linear-gradient(160deg,#f8fafc,#cbd5e1);color:#1e1b4b;text-shadow:none}
.ficha.num.conayuda{box-shadow:inset 0 -.22em 0 var(--c1),inset 0 3px 0 rgba(255,255,255,.6)}
.ficha.roca{background:linear-gradient(160deg,#a8a29e,#57534e);border-radius:28% 22% 30% 20%;box-shadow:inset 0 -.18em 0 rgba(0,0,0,.35),inset 4px 5px 0 rgba(255,255,255,.25);font-size:0}
.ficha.roca.dura{background:linear-gradient(160deg,#78716c,#292524)}
.ficha.roca::after{content:"";position:absolute;inset:22%;border-radius:40%;border:3px dashed rgba(0,0,0,.25)}
.ficha.hielo::after{content:"❄";position:absolute;inset:0;border-radius:inherit;background:rgba(186,230,253,.55);border:3px solid #e0f2fe;
  display:flex;align-items:flex-start;justify-content:flex-end;font-size:.42em;padding:.15em;color:#0c4a6e;text-shadow:none}
.ficha.nace .in,.ficha.nace.roca{animation:nace .22s ease-out}
@keyframes nace{from{transform:scale(0)}}
.ficha.pop .in{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.28)}}
.ficha.mal .in{animation:no .3s}
.ficha.diana{box-shadow:0 0 0 3px var(--oro),0 0 14px var(--oro)}
.vuela{position:fixed;z-index:55;transition:transform .38s cubic-bezier(.5,-.3,.6,1),opacity .38s;pointer-events:none}
/* Aspectos (skins) */
.skin-neon .ficha:not(.roca){background:#0b1026;color:#fff;box-shadow:inset 0 0 0 3px var(--c1),0 0 12px var(--c1);text-shadow:0 0 8px var(--c1)}
.skin-caramelo .ficha:not(.roca){background:linear-gradient(160deg,#fff,var(--cl) 35%,var(--c1) 130%);color:#1e1b4b;text-shadow:none;border-radius:38%}
.skin-runico .ficha:not(.roca){background:linear-gradient(160deg,#78716c,#3f3a36);box-shadow:inset 0 -.3em 0 var(--c1),inset 0 3px 0 rgba(255,255,255,.25);border-radius:12%}

#poderes{display:flex;gap:8px;justify-content:center;align-items:stretch;min-height:62px}
.poder{position:relative;flex:1;max-width:96px;min-height:58px;border-radius:16px;border:2px solid var(--linea);background:linear-gradient(var(--panel2),var(--panel));
  font-weight:900;font-size:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.poder small{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--suave);margin-top:3px}
.poder .c{position:absolute;right:-5px;top:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--oro);color:#3b1d00;font-size:.85rem;display:grid;place-items:center;padding:0 5px}
.poder[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 3px var(--oro),0 0 18px var(--oro);background:linear-gradient(#7c3aed,#4c1d95)}
.poder[disabled]{opacity:.45}
.poder.candado{font-size:1.1rem}
#ultimo{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;display:none;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:999px;
  background:#be123c;font-weight:900;font-size:.9rem;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:98%}
#ultimo.ver{display:flex}
#ultimo button{min-height:40px;border-radius:999px;border:0;background:#fff;color:#881337;font-weight:900;padding:0 14px}
#guia{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;min-height:62px;padding:8px 14px;border-radius:16px;background:#fff;color:#1e1b4b;
  font-weight:700;font-size:1rem;line-height:1.25;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;pointer-events:none}
#guia.ver{display:flex}

@media (orientation:landscape) and (max-height:560px), (min-aspect-ratio:13/10){
  #pJuego.activa{grid-template-columns:minmax(260px,40%) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:12px}
  #hud{grid-column:1;grid-row:1}#pedidos{grid-column:1;grid-row:2}#medio{grid-column:1;grid-row:3;flex-direction:column;justify-content:center}
  #poderes{grid-column:1;grid-row:4}#zona{grid-column:2;grid-row:1/5}#guia{right:auto;width:calc(40% - 12px);min-width:250px}
  #progreso{max-width:none;justify-content:center}
}

/* ---------- Ventanas ---------- */
#capa{position:fixed;inset:0;z-index:70;background:rgba(10,5,30,.72);display:none;align-items:center;justify-content:center;padding:14px}
#capa.ver{display:flex}
.ventana{width:min(480px,100%);max-height:100%;overflow:auto;border-radius:24px;padding:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:3px solid var(--linea);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;animation:entra .3s cubic-bezier(.2,1.4,.5,1)}
.ventana h2{margin:.1em 0 .3em;font-size:1.7rem;font-weight:900}
.ventana p{margin:.4em 0;line-height:1.4}
.ventana .izq{text-align:left}
.ventana .kubo2{width:96px;margin:0 auto}
.estrellas{font-size:2.6rem;letter-spacing:.1em;color:#4b3a94}
.estrellas b{color:var(--oro);display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards;text-shadow:0 3px 0 #b45309}
.premios{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-weight:900}
.nota{font-size:.9rem;color:var(--suave)}
.caja{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left;line-height:1.45}
.caja.mate{background:#fffbeb;color:#3b1d00;font-weight:700;font-size:1.05rem}
.lista{display:grid;gap:8px;text-align:left;margin:10px 0}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.25);border:2px solid transparent}
.item .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:#1f1547;font-weight:900}
.item div{flex:1;min-width:0}.item b{display:block}.item span{font-size:.85rem;color:var(--suave)}
.item.apagado{opacity:.5}
.item .btn{min-height:44px;padding:.3em .8em;font-size:.9rem;flex:none}
.interruptor{min-width:64px;min-height:44px;border-radius:999px;border:2px solid var(--linea);background:#1f1547;font-weight:900;flex:none}
.interruptor[aria-pressed="true"]{background:var(--verde);color:#052e16;border-color:#bbf7d0}
#aviso{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:80;padding:10px 16px;border-radius:16px;background:#fff;color:#1e1b4b;
  font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.5,1);max-width:92%;text-align:center}
#aviso.ver{transform:translate(-50%,0)}
.sinmov *,.sinmov *::before,.sinmov *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ============ MENÚ ============ -->
<main id="pMenu" class="pantalla activa">
  <h1 class="logo">EQUATION<br>MERGE<small>ECUACIONES DE PRIMER GRADO</small></h1>
  <div class="kubo" id="kuboMenu"></div>
  <div class="cartera" id="cartera"></div>
  <button class="btn oro grande" id="bJugar">▶ JUGAR</button>
  <div class="fila">
    <button class="btn" id="bNiveles">Niveles</button>
    <button class="btn" id="bTienda">Tienda</button>
    <button class="btn" id="bLogros">Logros</button>
  </div>
  <div class="fila">
    <button class="btn gris" id="bComo">Cómo se juega</button>
    <button class="btn gris" id="bAjustes">Ajustes</button>
  </div>
  <p class="pie"><a href="../../index.html">← Volver al mapa de πCHU</a><br>IES Alarifes Ruiz Florindo · Departamento de Matemáticas · 1.º ESO</p>
</main>

<!-- ============ NIVELES ============ -->
<section id="pMapa" class="pantalla" aria-label="Niveles">
  <div class="barra">
    <button class="redondo" id="bMapaAtras" aria-label="Volver al menú">←</button>
    <h2>Niveles</h2>
    <span class="chip" id="chipEst"></span>
  </div>
  <div id="listaNiveles"></div>
</section>

<!-- ============ PARTIDA ============ -->
<section id="pJuego" class="pantalla" aria-label="Partida">
  <div id="hud">
    <button class="redondo" id="bPausa" aria-label="Pausa">II</button>
    <div class="tit"><b id="hNombre"></b><span id="hEsc"></span></div>
    <div class="dato" id="dRacha" title="Multiplicador por racha de entregas"><b id="hRacha">×1</b><span>racha</span></div>
    <div class="dato"><b id="hPuntos">0</b><span>puntos</span></div>
    <div class="dato" id="dMovs"><b id="hMovs">0</b><span id="hMovsEtq">movs</span></div>
  </div>
  <div id="pedidos" aria-label="Ecuaciones"></div>
  <div id="medio">
    <div id="progreso" aria-hidden="true"></div>
    <div id="jefe"><div id="jefeCara"></div><div><div class="vida"><i id="jefeVida"></i></div><small id="jefeTxt"></small></div></div>
    <div id="cinta" role="status" aria-live="polite"></div>
  </div>

<script>
(function () {
"use strict";
const M = window.EquationMotor, { NIVELES, INFINITO, ESCALONES } = window.EquationNiveles, MQ = window.MathQuest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// La incógnita x se pinta en cursiva (como en el cuaderno). "exacto" no cambia: solo la x suelta.
const mate = s => esc(s).replace(/(^|[^\p{L}])x(?![\p{L}])/gu, '$1<i class="x">x</i>');
// Para el lector de pantalla: "3x" → "3 equis", "x/3" → "x entre 3"
const leer = s => s.replace(/(\d)x/g, "$1 x").replace(/\//g, " entre ").replace(/·/g, " por ").replace(/−/g, " menos ");
const sinMov = () => MQ.sinMovimiento();

/* =================== GUARDADO (pichu.equation-merge.v1) =================== */
const CLAVE = "pichu.equation-merge.v1";
function cargar() {
  const b = { v: 1, estrellas: {}, mejor: {}, record: 0, skin: "clasico", skins: ["clasico"], mejoras: {}, derrotas: {}, dominio: 50, tutorial: false,
    stats: { fusiones: 0, entregas: 0, pasos2: 0, combos: 0, dobles: 0, estrellas: 0, limpios: 0 }, misiones: [] };
  try { const d = JSON.parse(localStorage.getItem(CLAVE)); if (d && d.v === 1) return Object.assign(b, d, { stats: Object.assign(b.stats, d.stats) }); } catch (e) { /* nada */ }
  return b;
}
let S = cargar();
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) { /* modo privado: se juega igual, sin guardar */ }
  const ids = NIVELES.map(n => n.id);
  MQ.resumen("equation-merge", { superados: ids.filter(i => S.estrellas[i] > 0).length, total: ids.length,
    estrellas: ids.reduce((s, i) => s + (S.estrellas[i] || 0), 0), maxEstrellas: ids.length * 3, record: S.record });
}

/* =================== CATÁLOGOS =================== */
const PODERES = [
  { id: "martillo", icono: "🔨", nombre: "Martillo", tras: 2, base: 1, desc: "Rompe una roca, el hielo o una ficha que te estorbe." },
  { id: "mitad", icono: "÷2", nombre: "Mitad", tras: 4, base: 2, desc: "Parte en dos una ficha par: 14 pasa a ser 7." },
  { id: "menos", icono: "−1", nombre: "Menos uno", tras: 7, base: 2, desc: "Resta 1 a una ficha: 8 pasa a ser 7." },
  { id: "mezcla", icono: "🌀", nombre: "Mezcla", tras: 9, base: 1, desc: "Recoloca todas las fichas del tablero." }
];
const SKINS = [
  { id: "clasico", nombre: "Clásico", precio: 0 }, { id: "neon", nombre: "Neón", precio: 80 },
  { id: "caramelo", nombre: "Caramelo", precio: 120 }, { id: "runico", nombre: "Piedra rúnica", precio: 200 }
];
const MISIONES = [
  { id: "fus", txt: "Haz 30 fusiones", stat: "fusiones", n: 30, premio: 20 },
  { id: "ent", txt: "Resuelve 10 ecuaciones", stat: "entregas", n: 10, premio: 25 },
  { id: "pas", txt: "Resuelve 4 ecuaciones de dos pasos", stat: "pasos2", n: 4, premio: 25 },
  { id: "com", txt: "Consigue 3 combos (2 fusiones o más en un movimiento)", stat: "combos", n: 3, premio: 20 },
  { id: "dob", txt: "Forma 8 dobles (fusiona dos fichas iguales: 4 + 4)", stat: "dobles", n: 8, premio: 20 },
  { id: "est", txt: "Gana 5 estrellas", stat: "estrellas", n: 5, premio: 30 },
  { id: "lim", txt: "Supera 2 niveles sin errores", stat: "limpios", n: 2, premio: 30 }
];
const ETQ = { suma: "un paso", resta: "un paso", mult: "un paso", div: "un paso", dos: "dos pasos", dosr: "dos pasos", ambos: "x a los dos lados", par: "paréntesis", pal: "en palabras" };
// Primera pista (sin dar la solución). Es una balanza: lo que hagas en un lado, hazlo en el otro.
const PISTA = {
  suma: "Para dejar la x sola, quita en los dos lados el número que se le suma.",
  resta: "Para dejar la x sola, suma en los dos lados el número que se le resta.",
  mult: "El número pegado a la x la está multiplicando: divide los dos lados entre él.",
  div: "La x está dividida: multiplica los dos lados por ese número.",
  dos: "Primero quita el número que se suma; después divide entre el número de la x.",
  dosr: "Primero suma el número que se resta; después divide entre el número de la x.",
  ambos: "Pasa todas las x a un lado (resta la x pequeña en los dos lados) y luego resuelve.",
  par: "Divide los dos lados entre el número de fuera del paréntesis, o quita el paréntesis multiplicando.",
  pal: "«Un número» es la x. Escribe la frase como ecuación y resuélvela."
};
const desbloqueado = id => id === 1 || S.estrellas[id - 1] > 0 || S.estrellas[id - 2] === 3;   // 3 estrellas = salto por dominio
const poderLibre = p => S.estrellas[p.tras] > 0;
function repartirMisiones() {
  S.misiones = S.misiones.filter(m => MISIONES.some(x => x.id === m.id));
  while (S.misiones.length < 3) {
    const libres = MISIONES.filter(x => !S.misiones.some(m => m.id === x.id));
    const x = libres[Math.floor(Math.random() * libres.length)];
    S.misiones.push({ id: x.id, desde: S.stats[x.stat] });
  }
}
function revisarMisiones() {
  let ganado = 0;
  S.misiones = S.misiones.filter(m => {
    const x = MISIONES.find(y => y.id === m.id);
    if (S.stats[x.stat] - m.desde >= x.n) { ganado += x.premio; avisar(`🎯 Misión cumplida: ${x.txt} · +${x.premio} 🪙`); return false; }
    return true;
  });
  if (ganado) MQ.sumar(0, ganado);
  repartirMisiones();
}

/* =================== SONIDO Y MÚSICA (generados, sin archivos) =================== */
let AJ = MQ.leer().ajustes;
const Son = (() => {
  let ctx = null, reloj = null, paso = 0, sig = 0;
  const ini = () => { if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } };
  function nota(f, dur, tipo, vol, cuando) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = (cuando || ctx.currentTime);
    o.type = tipo || "sine"; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  const fx = (lista) => { if (!ctx || !AJ.sonido) return; const t = ctx.currentTime; lista.forEach(n => nota(n[0], n[1], n[2], n[3], t + (n[4] || 0))); };
  // Música: bucle de 4 acordes con bajo y arpegio suave.
  const ACORDES = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  function programar() {
    if (!ctx || !AJ.musica || document.hidden) return;
    if (sig < ctx.currentTime) sig = ctx.currentTime + 0.05;
    while (sig < ctx.currentTime + 0.6) {
      const ac = ACORDES[Math.floor(paso / 16) % 4], p = paso % 16;
      if (p === 0 || p === 10) nota(ac[0] / 2, 0.5, "triangle", 0.07, sig);
      if (p % 2 === 0) nota(ac[[0, 1, 2, 1, 2, 0, 1, 2][p / 2]] * 2, 0.22, "sine", 0.028, sig);
      if (p === 4 || p === 12) nota(ac[2] * 4, 0.08, "sine", 0.012, sig);
      sig += 0.17; paso++;
    }
  }
  return {
    ini() { ini(); if (!reloj) reloj = setInterval(programar, 200); },
    pausa(si) { if (ctx) si ? ctx.suspend() : ctx.resume(); },
    mueve: () => fx([[190, 0.07, "triangle", 0.06]]),
    tope: () => fx([[110, 0.1, "square", 0.04]]),
    fusion: v => fx([[262 * Math.pow(2, v / 14), 0.18, "triangle", 0.13], [524 * Math.pow(2, v / 14), 0.22, "sine", 0.08, 0.06]]),
    entrega: () => fx([[523, 0.12, "triangle", 0.12], [659, 0.12, "triangle", 0.12, 0.08], [784, 0.12, "triangle", 0.12, 0.16], [1047, 0.3, "sine", 0.12, 0.24]]),
    error: () => fx([[196, 0.16, "sawtooth", 0.07], [147, 0.3, "sawtooth", 0.07, 0.13]]),
    poder: () => fx([[392, 0.1, "square", 0.05], [587, 0.2, "square", 0.05, 0.08]]),
    rompe: () => fx([[90, 0.2, "square", 0.08], [60, 0.25, "sawtooth", 0.06, 0.05]]),
    ataque: () => fx([[110, 0.3, "sawtooth", 0.09], [82, 0.45, "sawtooth", 0.09, 0.2]]),
    victoria: () => fx([[523, 0.15, "triangle", 0.13], [659, 0.15, "triangle", 0.13, 0.14], [784, 0.15, "triangle", 0.13, 0.28], [1047, 0.5, "triangle", 0.14, 0.42], [1319, 0.6, "sine", 0.1, 0.56]]),
    derrota: () => fx([[392, 0.25, "triangle", 0.1], [330, 0.25, "triangle", 0.1, 0.22], [262, 0.5, "triangle", 0.1, 0.44]]),
    clic: () => fx([[660, 0.05, "sine", 0.06]])
  };
})();
document.addEventListener("pointerdown", () => Son.ini(), { passive: true });
document.addEventListener("keydown", () => Son.ini());
document.addEventListener("visibilitychange", () => Son.pausa(document.hidden));

/* =================== PARTÍCULAS =================== */
const Fx = (() => {
  const cv = $("#fx"), c = cv.getContext("2d"); let ps = [], vivo = false, dpr = 1;
  function medida() { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  medida(); addEventListener("resize", medida);
  function paso() {
    c.clearRect(0, 0, cv.width, cv.height);
    ps = ps.filter(p => p.v > 0);
    for (const p of ps) {
      p.x += p.dx; p.y += p.dy; p.dy += p.g; p.v -= p.dv; p.r += p.giro;
      c.globalAlpha = Math.max(0, p.v); c.fillStyle = p.color;
      c.save(); c.translate(p.x * dpr, p.y * dpr); c.rotate(p.r);
      const t = p.t * dpr; if (p.forma === "o") { c.beginPath(); c.arc(0, 0, t / 2, 0, 7); c.fill(); } else c.fillRect(-t / 2, -t / 2, t, t * 0.6);
      c.restore();
    }
    c.globalAlpha = 1;
    if (ps.length) requestAnimationFrame(paso); else vivo = false;
  }
  function lanzar(lista) { if (sinMov()) return; ps.push(...lista); if (ps.length > 400) ps = ps.slice(-400); if (!vivo) { vivo = true; requestAnimationFrame(paso); } }
  return {
    estalla(x, y, color, n) {
      lanzar(Array.from({ length: n || 14 }, () => { const a = Math.random() * 6.28, v = 2 + Math.random() * 5;
        return { x, y, dx: Math.cos(a) * v, dy: Math.sin(a) * v, g: 0.12, v: 1, dv: 0.03, t: 5 + Math.random() * 7, color, forma: "o", r: 0, giro: 0 }; }));
    },
    confeti() {
      const col = ["#fde047", "#fb7185", "#67e8f9", "#4ade80", "#c4b5fd", "#fff"];
      lanzar(Array.from({ length: 140 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * 200, dx: (Math.random() - 0.5) * 3, dy: 2 + Math.random() * 4,
        g: 0.03, v: 1.6, dv: 0.008, t: 8 + Math.random() * 8, color: col[Math.floor(Math.random() * col.length)], forma: "r", r: Math.random() * 6, giro: (Math.random() - 0.5) * 0.3 })));
    }
  };
})();

/* =================== UTILIDADES DE PANTALLA =================== */
function pantalla(id) {
  document.querySelectorAll(".pantalla").forEach(p => p.classList.toggle("activa", p.id === id));
  document.body.classList.toggle("jugando", id === "pJuego");
  document.body.classList.toggle("sinmov", sinMov());
}
let tAviso = 0;
function avisar(txt) { const a = $("#aviso"); a.textContent = txt; a.classList.add("ver"); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove("ver"), 3200); }
let alCerrar = null;
function ventana(html, cerrar) {
  $("#ventana").innerHTML = html; $("#capa").classList.add("ver"); alCerrar = cerrar || null;
  const b = $("#ventana").querySelector("[data-foco]") || $("#ventana").querySelector("button"); if (b) b.focus();
}
function cerrarVentana() { $("#capa").classList.remove("ver"); const f = alCerrar; alCerrar = null; if (f) f(); }
const abierta = () => $("#capa").classList.contains("ver");
$("#ventana").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  Son.clic(); ACCIONES[b.dataset.a](b);
});
function logro(id) { const l = MQ.logro(id); if (l) setTimeout(() => avisar(`${l.icono} Logro: ${l.titulo}`), 600); }
function pintarCartera() {
  const d = MQ.leer(), n = MQ.nivel(d.xp);
  $("#cartera").innerHTML = `<span class="chip">⭐ Nivel ${n.nivel} · ${n.tiene}/${n.hace_falta} XP</span><span class="chip">🪙 ${d.monedas}</span>`;
  $("#kuboMenu").innerHTML = MQ.avatarSVG(d.avatar, "feliz");
}

/* =================== NIVELES (mapa) =================== */
function pintarMapa() {
  repartirMisiones();
  const total = NIVELES.reduce((s, n) => s + (S.estrellas[n.id] || 0), 0);
  $("#chipEst").textContent = `★ ${total}/${NIVELES.length * 3}`;
  let h = "", escAnt = 0;
  for (const n of NIVELES) {
    if (n.esc !== escAnt) { h += `<h3 class="esc">Nivel ${n.esc} · ${ESCALONES[n.esc]}</h3>`; escAnt = n.esc; }
    const e = S.estrellas[n.id] || 0, ab = desbloqueado(n.id);
    h += `<button class="nivel ${n.jefe ? "jefe" : ""}" data-niv="${n.id}" ${ab ? "" : "disabled"} aria-label="Nivel ${n.id}: ${esc(n.nombre)}${ab ? "" : " (bloqueado)"}">
      <span class="n">${ab ? (n.jefe ? "👑" : n.id) : "🔒"}</span><div><b>${esc(n.nombre)}</b><span>${mate(n.lema)}</span></div>
      <span class="est" aria-label="${e} estrellas">${"★".repeat(e)}<span style="opacity:.3;color:#fff">${"★".repeat(3 - e)}</span></span></button>`;
  }
  const inf = S.estrellas[3] > 0;
  h += `<h3 class="esc">Desafío especial</h3><button class="nivel inf" data-niv="inf" ${inf ? "" : "disabled"}>
    <span class="n">${inf ? "∞" : "🔒"}</span><div><b>Balanza infinita</b><span>${inf ? "Sin límite de movimientos. Récord: " + S.record + " puntos" : "Supera el nivel 3 para abrirla"}</span></div></button>`;
  h += `<div class="misiones"><h3>🎯 Misiones</h3>` + S.misiones.map(m => { const x = MISIONES.find(y => y.id === m.id), v = Math.min(x.n, S.stats[x.stat] - m.desde);
    return `<div class="mision"><span>${esc(x.txt)}</span><b>${v}/${x.n} · ${x.premio} 🪙</b><div class="prog"><i style="width:${100 * v / x.n}%"></i></div></div>`; }).join("") + `</div>`;
  $("#listaNiveles").innerHTML = h;
}
$("#listaNiveles").addEventListener("click", e => { const b = e.target.closest("[data-niv]"); if (b && !b.disabled) { Son.clic(); empezar(b.dataset.niv === "inf" ? "inf" : +b.dataset.niv); } });

/* =================== PARTIDA =================== */
let J = null;
const els = new Map();     // id de ficha → elemento
let geo = { lado: 0, celda: 0, hueco: 0 };

function empezar(id) {
  const inf = id === "inf";
  const niv = inf ? Object.assign({ id: "inf", esc: 0, nombre: "Balanza infinita", n: 5, total: Infinity, movs: Infinity }, INFINITO[0]) : NIVELES.find(n => n.id === id);
  AJ = MQ.leer().ajustes;
  let movs = niv.movs, extra = 0;
  if (!inf) {
    extra = Math.round(niv.movs * 0.15 * Math.min(3, S.derrotas[id] || 0));          // ayuda tras derrotas
    movs = Math.round((niv.movs + extra) * (AJ.tranquilo ? 1.5 : 1));
  }
  J = { niv, inf, t: M.crear(niv.n), abiertos: [null, null, null], pendientes: niv.total, hechos: 0, total: niv.total, movs, movsIni: movs, extra,
    puntos: 0, racha: 0, errores: 0, vidas: 3, nMov: 0, poder: null, bloq: false, fin: false, dobles: 0, fusiones: 0,
    ayuda: !!niv.ayuda || S.dominio < 30, cargas: {}, jefe: niv.jefe ? { cuenta: niv.jefe.cada + (AJ.tranquilo ? 3 : 0) } : null,
    guia: (!inf && id === 1 && !S.tutorial) ? 0 : -1 };
  PODERES.forEach(p => { J.cargas[p.id] = poderLibre(p) ? p.base + (S.mejoras[p.id] || 0) : 0; });
  for (let i = 0; i < (niv.rocas || 0); i++) M.ponerRoca(J.t, M.elige(J.t.rng, M.vacias(J.t)), niv.vidaRoca || 1);
  for (let i = 0; i < 3; i++) M.generar(J.t, cfgFichas());
  reponer();
  els.forEach(el => el.remove()); els.clear();
  pantalla("pJuego");
  $("#tablero").className = "skin-" + S.skin;
  $("#hNombre").textContent = inf ? niv.nombre : `${niv.id}. ${niv.nombre}`;
  $("#hEsc").textContent = inf ? "Desafío especial" : `Nivel ${niv.esc} · ${ESCALONES[niv.esc]}`;
  $("#jefe").style.display = J.jefe ? "flex" : "none";
  if (J.jefe) $("#jefeCara").innerHTML = INCOGNITO;
  $("#progreso").style.display = J.jefe || inf ? "none" : "flex";
  $("#ultimo").classList.remove("ver");
  cinta(mate(niv.lema), true);
  medir(); pintarTodo(); guia();
  if (J.extra) avisar(`💪 Esta vez tienes ${J.extra} movimientos extra`);
}
// Configuración actual (en el modo infinito sube con las entregas y baja con los errores).
function cfg() {
  if (!J.inf) return J.niv;
  const avance = Math.max(0, J.hechos - 3 * J.errores);
  return INFINITO.find(x => avance < x.hasta);
}
function cfgFichas() {
  const c = cfg();
  return { fichas: c.fichas, hielo: J.nMov < 3 ? 0 : c.hielo };
}
function reponer() {
  const c = Object.assign({}, cfg());
  if (S.dominio < 30 && !J.inf) c.formas = Object.assign({}, c.formas, { [Object.keys(c.formas)[0]]: (Object.values(c.formas)[0]) + 2 });    // dominio bajo: más ecuaciones del tipo principal
  for (let k = 0; k < 3; k++) if (!J.abiertos[k] && J.pendientes > 0) {
    const p = M.nuevoPedido(c, J.t.rng, J.abiertos.filter(Boolean));
    if (!p) break;
    p.pista = 0; p.nuevo = true; J.abiertos[k] = p; J.pendientes--;
  }
}

/* ----- Medidas y dibujo ----- */
function medir() {
  const z = $("#zona"), lado = Math.max(120, Math.floor(Math.min(z.clientWidth, z.clientHeight)) - 4), n = J ? J.niv.n : 4;
  const hueco = Math.round(lado * 0.022), celda = (lado - hueco * (n + 1)) / n;
  geo = { lado, celda, hueco };
  const tb = $("#tablero"); tb.style.width = tb.style.height = lado + "px"; tb.style.fontSize = (celda * 0.44) + "px";
  tb.querySelectorAll(".hueco").forEach(h => h.remove());
  if (!J) return;
  for (let i = 0; i < n * n; i++) { const h = document.createElement("div"); h.className = "hueco"; const [x, y] = xy(i);
    h.style.cssText = `left:${x}px;top:${y}px;width:${celda}px;height:${celda}px`; tb.prepend(h); }
}
const xy = i => { const n = J.niv.n; return [geo.hueco + (i % n) * (geo.celda + geo.hueco), geo.hueco + Math.floor(i / n) * (geo.celda + geo.hueco)]; };
const colocar = (el, i) => { const [x, y] = xy(i); el.style.transform = `translate(${x}px,${y}px)`; el.dataset.i = i; };
const centro = i => { const r = $("#tablero").getBoundingClientRect(), [x, y] = xy(i); return [r.left + x + geo.celda / 2, r.top + y + geo.celda / 2]; };
const COLOR = { 1: "#60a5fa", 2: "#e879f9", 3: "#fb923c", 4: "#4ade80" };
const grupo = v => v <= 5 ? 1 : v <= 10 ? 2 : v <= 15 ? 3 : 4;      // color de la ficha según su valor (1-5, 6-10, 11-15, 16-20)

function contenido(c) {
  return `<span class="in"><span class="v" style="font-size:${c.v >= 10 ? 1.05 : 1.2}em">${c.v}</span></span>`;
}
function pintarTablero(nuevas) {
  const tb = $("#tablero"), vivos = new Set();
  J.t.g.forEach((c, i) => {
    if (!c) return;
    vivos.add(c.id);
    let el = els.get(c.id);
    if (!el) {
      el = document.createElement("button"); el.type = "button"; els.set(c.id, el); tb.appendChild(el);
      el.className = "ficha " + (nuevas && nuevas.has(c.id) ? "pop" : "nace");
      el.style.width = el.style.height = geo.celda + "px";
    }

const DIFICULTAD = { suma: 1, resta: 1, mult: 1.5, div: 1.5, pal: 1.5, dos: 2.5, dosr: 2.5, ambos: 3.5, par: 3.5 };

/* =================== VENTANAS: pausa, tienda, logros, ajustes, ayuda =================== */
function irMapa() { J = null; pintarMapa(); pantalla("pMapa"); }
function irMenu() { J = null; pintarCartera(); pantalla("pMenu"); }
const interruptor = (clave, titulo, sub) => `<div class="item"><div><b>${titulo}</b><span>${sub}</span></div>
  <button class="interruptor" data-a="ajuste" data-clave="${clave}" aria-pressed="${!!AJ[clave]}" aria-label="${titulo}">${AJ[clave] ? "Sí" : "No"}</button></div>`;
const ajustesHTML = () => `<div class="lista">${interruptor("sonido", "Sonidos", "Efectos al fusionar y entregar")}${interruptor("musica", "Música", "Melodía de fondo")}
  ${interruptor("animaciones", "Animaciones", "Desactívalas si te marean o el dispositivo va lento")}
  ${interruptor("tranquilo", "Modo tranquilo", "50 % más de movimientos y el jefe ataca más despacio")}</div>`;
function vPausa() {
  ventana(`<h2>Pausa</h2><p class="nota">${J.inf ? "Balanza infinita" : `Nivel ${J.niv.id} · ${esc(J.niv.nombre)}`} · no hay límite de tiempo</p>${ajustesHTML()}
    <div class="fila"><button class="btn oro" data-a="cerrar" data-foco>Seguir</button><button class="btn gris" data-a="jugar" data-niv="${J.niv.id}">Reiniciar</button>
    <button class="btn gris" data-a="como">Ayuda</button><button class="btn gris" data-a="mapa">Salir</button></div>`);
}
function vAjustes() { ventana(`<h2>Ajustes</h2>${ajustesHTML()}<button class="btn oro" data-a="cerrar" data-foco>Listo</button>`); }
function vComo() {
  ventana(`<h2>Cómo se juega</h2><div class="izq">
    <div class="caja"><b>1 · Desliza.</b> Todas las fichas se mueven a la vez. Con teclado: flechas.</div>
    <div class="caja"><b>2 · Fusiona.</b> Dos fichas que chocan se suman: 3 + 4 = 7. Una ficha puede llegar hasta 20.</div>
    <div class="caja"><b>3 · Resuelve y entrega.</b> Arriba hay ecuaciones. Toca la ficha que sea la <b>solución</b>. ${mate("Si piden x + 5 = 12, entrega el 7 (porque 7 + 5 = 12).")} Toca una ecuación para ver una pista.</div>
    <div class="caja"><b>La balanza:</b> lo que hagas en un lado de la ecuación, hazlo en el otro. ${mate("2x + 3 = 11 → quito 3: 2x = 8 → divido entre 2: x = 4.")}</div>
    <div class="caja"><b>Rocas y hielo:</b> se rompen haciendo una fusión justo al lado.</div>
    <div class="caja"><b>Poderes:</b> ${PODERES.map(p => `${p.icono} ${esc(p.desc)}`).join(" ")}</div>
    <div class="caja"><b>Estrellas:</b> pocos errores y que te sobren movimientos. Las rachas de entregas multiplican los puntos.</div></div>
    <button class="btn oro" data-a="cerrar" data-foco>¡Vamos!</button>`, J && !J.fin ? null : undefined);
}
function vTienda() {
  const d = MQ.leer();
  const skins = SKINS.map(s => { const tengo = S.skins.includes(s.id), puesto = S.skin === s.id;
    return `<div class="item"><span class="ico"><span class="skin-${s.id}" style="display:block;width:34px;height:34px;position:relative"><span class="ficha g2" style="position:static;width:34px;height:34px;font-size:15px"><span class="in">7</span></span></span></span>
      <div><b>${s.nombre}</b><span>Aspecto de las fichas</span></div>
      ${puesto ? '<b style="color:var(--verde)">En uso</b>' : tengo ? `<button class="btn" data-a="poner" data-id="${s.id}">Usar</button>`
        : `<button class="btn oro" data-a="comprar" data-id="${s.id}" ${d.monedas >= s.precio ? "" : "disabled"}>${s.precio} 🪙</button>`}</div>`; }).join("");
  const mej = PODERES.map(p => { const n = S.mejoras[p.id] || 0, precio = 100 * (n + 1), libre = poderLibre(p);
    return `<div class="item ${libre ? "" : "apagado"}"><span class="ico">${p.icono}</span><div><b>${p.nombre} +1</b><span>${libre ? `Empiezas cada nivel con ${p.base + n}${n < 2 ? " → " + (p.base + n + 1) : ""} usos` : "Se desbloquea en el nivel " + p.tras}</span></div>
      ${!libre ? "🔒" : n >= 2 ? '<b style="color:var(--verde)">Máx.</b>' : `<button class="btn oro" data-a="mejora" data-id="${p.id}" ${d.monedas >= precio ? "" : "disabled"}>${precio} 🪙</button>`}</div>`; }).join("");
  ventana(`<h2>Tienda</h2><p><span class="chip">🪙 ${d.monedas} monedas</span></p><p class="nota">Las monedas se ganan jugando. No se compran con dinero.</p>
    <div class="lista">${skins}${mej}</div><button class="btn oro" data-a="cerrar" data-foco>Cerrar</button>`);
}
function vLogros() {
  const d = MQ.leer(), mios = MQ.LOGROS.filter(l => l.juego === "equation-merge");
  ventana(`<h2>Logros y medallas</h2><p class="nota">${mios.filter(l => d.logros[l.id]).length} de ${mios.length} conseguidos</p><div class="lista">` +
    mios.map(l => `<div class="item ${d.logros[l.id] ? "" : "apagado"}"><span class="ico">${d.logros[l.id] ? l.icono : "?"}</span><div><b>${esc(l.titulo)}</b><span>${esc(l.desc)}</span></div>${d.logros[l.id] ? "✅" : ""}</div>`).join("") +
    `</div><button class="btn oro" data-a="cerrar" data-foco>Cerrar</button>`);
}
const ACCIONES = {
  cerrar: cerrarVentana,
  jugar: b => { alCerrar = null; cerrarVentana(); empezar(b.dataset.niv === "inf" ? "inf" : +b.dataset.niv); },
  mapa: () => { alCerrar = null; cerrarVentana(); irMapa(); },
  como: vComo,
  ajuste: b => { const k = b.dataset.clave; AJ[k] = !AJ[k]; MQ.ajuste(k, AJ[k]); b.setAttribute("aria-pressed", AJ[k]); b.textContent = AJ[k] ? "Sí" : "No";
    document.body.classList.toggle("sinmov", sinMov()); },
  poner: b => { S.skin = b.dataset.id; guardar(); if (J) $("#tablero").className = "skin-" + S.skin; vTienda(); },
  comprar: b => { const s = SKINS.find(x => x.id === b.dataset.id); if (MQ.gastar(s.precio)) { S.skins.push(s.id); S.skin = s.id; guardar(); avisar(`🎨 Nuevo aspecto: ${s.nombre}`); } vTienda(); pintarCartera(); },
  mejora: b => { const n = S.mejoras[b.dataset.id] || 0; if (n < 2 && MQ.gastar(100 * (n + 1))) { S.mejoras[b.dataset.id] = n + 1; guardar(); } vTienda(); pintarCartera(); }
};

/* =================== ENTRADAS: táctil, ratón y teclado =================== */
const zona = $("#zona"); let gesto = null, huboGesto = false;
zona.addEventListener("pointerdown", e => { gesto = { x: e.clientX, y: e.clientY, id: e.pointerId }; huboGesto = false; });
zona.addEventListener("pointermove", e => {
  if (!gesto || e.pointerId !== gesto.id) return;
  const dx = e.clientX - gesto.x, dy = e.clientY - gesto.y, u = Math.max(22, geo.celda * 0.3);
  if (Math.max(Math.abs(dx), Math.abs(dy)) < u) return;
  gesto = null; huboGesto = true;
  deslizar(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "der" : "izq") : (dy > 0 ? "aba" : "arr"));
});
// Sin esto, tras un deslizamiento rápido el navegador se "traga" el siguiente toque (cree que es para frenar un desplazamiento).
$("#pJuego").addEventListener("touchmove", e => e.preventDefault(), { passive: false });
const finGesto = () => { gesto = null; };
zona.addEventListener("pointerup", finGesto); zona.addEventListener("pointercancel", finGesto);
$("#tablero").addEventListener("click", e => {
  if (huboGesto) { huboGesto = false; return; }
  const f = e.target.closest(".ficha"); if (f) tocar(+f.dataset.i);
});
document.addEventListener("keydown", e => {
  if (abierta()) { if (e.key === "Escape") cerrarVentana(); return; }
  if (!J || J.fin) return;
  const d = { ArrowLeft: "izq", ArrowRight: "der", ArrowUp: "arr", ArrowDown: "aba", a: "izq", d: "der", w: "arr", s: "aba" }[e.key];
  if (d) { e.preventDefault(); deslizar(d); } else if (e.key === "Escape") vPausa();
});
$("#pedidos").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b || !J || J.fin) return;
  const p = J.abiertos[+b.dataset.k]; if (!p) return;
  Son.clic(); p.pista = Math.min(2, p.pista + 1);
  if (p.pista === 1) cinta("💡 " + esc(PISTA[p.forma]) + " (Toca otra vez para ver la solución)", true);
  else ventana(`<h2>💡 Pista</h2><div class="caja mate">${mate(p.explica)}</div><p class="nota">Con la solución a la vista, esta ecuación da la mitad de puntos.</p><button class="btn oro" data-a="cerrar" data-foco>Entendido</button>`);
  pintarPedidos();
});
$("#poderes").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) elegirPoder(b); });
$("#bPausa").onclick = () => { Son.clic(); vPausa(); };
$("#bTerminar").onclick = () => { if (J && !J.fin) terminar(false, J.inf || J.movs > 0 ? "atasco" : "movs"); };
$("#bJugar").onclick = () => { Son.clic(); const sig = NIVELES.find(n => !S.estrellas[n.id] && desbloqueado(n.id)); if (sig) empezar(sig.id); else irMapa(); };
$("#bNiveles").onclick = () => { Son.clic(); irMapa(); };
$("#bMapaAtras").onclick = () => { Son.clic(); irMenu(); };
$("#bTienda").onclick = () => { Son.clic(); vTienda(); };
$("#bLogros").onclick = () => { Son.clic(); vLogros(); };
$("#bAjustes").onclick = () => { Son.clic(); vAjustes(); };
$("#bComo").onclick = () => { Son.clic(); vComo(); };
let tMedir = 0;
function remedir() { if (!J) return; medir(); els.forEach(el => { el.style.width = el.style.height = geo.celda + "px"; }); const sm = document.body.classList.contains("sinmov");
  document.body.classList.add("sinmov"); pintarTablero(); void $("#tablero").offsetWidth; document.body.classList.toggle("sinmov", sm); }
addEventListener("resize", () => { clearTimeout(tMedir); tMedir = setTimeout(remedir, 60); });
if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(tMedir); tMedir = setTimeout(remedir, 60); }).observe(zona);
document.addEventListener("contextmenu", e => { if (J) e.preventDefault(); });

repartirMisiones(); guardar(); pintarCartera(); pantalla("pMenu");
window.__EM = { get J() { return J; }, get S() { return S; }, empezar, deslizar, tocar, terminar };   // para las pruebas automáticas
})();
</script>
</body>
</html>
