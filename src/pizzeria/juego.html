<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizzería πCHU · Fracciones</title>
<meta name="theme-color" content="#332B2A">
<!-- πCHU: botón para volver a la portada -->
<script src="../../compartido/volver.js" defer></script>
<style>
@font-face{font-family:"Lato";font-weight:400;font-display:swap;src:url("../../compartido/fuentes/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-display:swap;src:url("../../compartido/fuentes/lato-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-display:swap;src:url("../../compartido/fuentes/lato-latin-900-normal.woff2") format("woff2")}
:root{
  --espresso:#332B2A; --salvia:#5A8A78; --coral:#E46D4D; --crema:#F4EDD7;
  --coral-oscuro:#A8402A; --salvia-oscuro:#3F6E5C; --papel:#FFFCF3; --linea:#D9CFB4; --oro:#E8B04B; --oro-oscuro:#8A6214;
  --madera:#B07A4F; --madera-oscura:#7A4E2E;
  --fuente:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fuente);color:var(--espresso);line-height:1.4;min-height:100vh;background:var(--crema);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--espresso);outline-offset:3px;box-shadow:0 0 0 6px var(--oro)}
.oculto{display:none!important}
.solo-lector{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .08em;font-weight:900}
.fr>span:first-child{border-bottom:.1em solid currentColor;padding:0 .12em .05em}
.fr>span:last-child{padding:.05em .12em 0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:.45em 1.2em;border-radius:14px;border:3px solid var(--espresso);
  background:var(--coral-oscuro);color:#fff;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--espresso);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--espresso)}
.btn.verde{background:var(--salvia-oscuro)}
.btn.claro{background:var(--papel);color:var(--espresso)}
.btn.oro{background:var(--oro);color:var(--espresso)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.grande{font-size:1.25rem;padding:.5em 1.6em;min-height:56px}

/* Toldo de pizzería */
.toldo{height:34px;background:repeating-linear-gradient(90deg,var(--coral) 0 44px,var(--papel) 44px 88px);position:relative}
.toldo::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:radial-gradient(circle at 22px 0,var(--coral) 21px,transparent 22px) 0 0/88px 14px repeat-x,
             radial-gradient(circle at 66px 0,var(--papel) 21px,transparent 22px) 0 0/88px 14px repeat-x}
.pared{background:var(--crema) radial-gradient(rgba(90,138,120,.13) 2px,transparent 2.5px) 0 0/26px 26px}

/* ================= INICIO ================= */
#inicio{min-height:100vh;padding-bottom:5rem}
.ini{max-width:1000px;margin:0 auto;padding:1.6rem 1rem 0}
.cabecera{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.4rem}
.cabecera img{width:118px;height:auto;filter:drop-shadow(0 6px 0 rgba(51,43,42,.15))}
.logo h1{margin:0;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;font-weight:900;letter-spacing:-.02em;color:var(--coral-oscuro)}
.logo h1 span{color:var(--espresso)}
.logo p{margin:.3rem 0 0;font-size:1.15rem;font-weight:700}
.bocadillo-ini{background:var(--papel);border:3px solid var(--espresso);border-radius:18px;padding:.7rem 1rem;max-width:360px;font-weight:700;position:relative;box-shadow:0 4px 0 rgba(51,43,42,.2)}
.menus{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
.menu-card{background:var(--papel);border:3px solid var(--espresso);border-radius:20px;padding:1rem;display:grid;grid-template-columns:72px 1fr;gap:.2rem 1rem;align-items:center;box-shadow:0 5px 0 rgba(51,43,42,.25)}
.menu-card .num{grid-row:span 2;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:900;color:#fff;background:var(--salvia-oscuro);border:3px solid var(--espresso)}
.menu-card h2{margin:0;font-size:1.25rem;line-height:1.15}
.menu-card p{margin:0;font-size:.95rem}
.menu-card .est{font-size:1.4rem;letter-spacing:.1em;color:var(--oro-oscuro);grid-column:1/-1;margin-top:.3rem}
.menu-card .est small{font-size:.85rem;letter-spacing:0;color:var(--espresso);margin-left:.4rem}
.menu-card .acc{grid-column:1/-1;display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.menu-card.bloq{opacity:.7}
.menu-card.bloq .num{background:#8C817E}
.menu-card .candado{grid-column:1/-1;font-weight:700;font-size:.95rem;margin-top:.4rem}
.album{margin-top:1.6rem;background:var(--papel);border:3px solid var(--espresso);border-radius:20px;padding:1rem}
.album h2{margin:0 0 .2rem;font-size:1.2rem}
.album p{margin:0 0 .8rem;font-size:.95rem}
.album ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.6rem}
.album li{text-align:center;font-size:.82rem;font-weight:700;line-height:1.15}
.album img{width:100%;max-width:96px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto .2rem}
.album li.no img{filter:grayscale(1) brightness(.2);opacity:.2}
.album li.no span{opacity:.75}
.ajustes-ini{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}

/* ================= JUEGO ================= */
#juego{min-height:100vh;display:flex;flex-direction:column}
.barra{background:var(--espresso);color:var(--crema);display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem;flex-wrap:wrap}
.barra .btn{min-height:44px;padding:.2em .8em;font-size:.95rem;box-shadow:none;border-color:var(--crema)}
.barra .titulo{font-weight:900;font-size:1.02rem;flex:1;min-width:150px;line-height:1.15}
.barra .titulo small{display:block;font-weight:700;font-size:.78rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.puntos{display:flex;gap:.3rem;align-items:center}
.puntos span{width:20px;height:20px;border-radius:50%;border:2px solid var(--crema);display:grid;place-items:center;font-size:.75rem;font-weight:900}
.puntos span.bien{background:var(--salvia);color:#fff}
.puntos span.casi{background:var(--oro);color:var(--espresso)}
.puntos span.ahora{box-shadow:0 0 0 3px var(--oro)}
.contador{display:none;font-weight:900;font-size:1.05rem;background:rgba(244,237,215,.15);border-radius:999px;padding:.15em .7em}
@media (max-width:620px){.puntos{display:none}.contador{display:block}.barra .titulo{min-width:0}}
.reloj{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.1rem}
.reloj .tubo{width:120px;height:12px;border-radius:999px;background:rgba(244,237,215,.25);overflow:hidden}
.reloj .tubo span{display:block;height:100%;background:var(--oro);width:100%}
.lado-izq,.lado-der{display:contents}
.zona{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:.7rem 1rem 5.5rem;display:grid;gap:.55rem;justify-items:center;align-content:start;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"cliente" "pista" "mesa" "enpizza" "resp" "controles"}
.cliente{grid-area:cliente} .pista{grid-area:pista} .mesa{grid-area:mesa} .en-pizza{grid-area:enpizza} .respuesta{grid-area:resp} #controles{grid-area:controles}
@media (min-width:900px){
  .zona{grid-template-columns:minmax(300px,1fr) minmax(0,1.25fr);column-gap:2rem;padding-top:1.4rem;grid-template-areas:none;align-items:start}
  .lado-izq,.lado-der{display:flex;flex-direction:column;align-items:center;gap:.8rem;width:100%}
  .cliente{flex-direction:column;align-items:center}
  .cliente .bocadillo{margin-bottom:0;width:100%}
  .cliente .bocadillo::before{left:50%;bottom:-24px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--espresso)}
  .cliente .bocadillo::after{left:50%;bottom:-17px;transform:translateX(-50%);border:9px solid transparent;border-top:11px solid var(--papel)}
  .cliente img{order:2;width:150px}
  .pizzas.una{--tam:min(340px,46vh)} .pizzas.dos{--tam:min(260px,22vw,40vh)}
}
#juego .toldo{height:18px}
#juego .toldo::after{height:9px;bottom:-9px;background-size:88px 9px}

.cliente{display:flex;align-items:flex-end;gap:.6rem;width:100%;max-width:720px}
.cliente img{width:clamp(88px,22vw,150px);height:auto;flex:0 0 auto;transform-origin:50% 100%}
.bocadillo{flex:1;background:var(--papel);border:3px solid var(--espresso);border-radius:20px;padding:.8rem 1rem;position:relative;box-shadow:0 4px 0 rgba(51,43,42,.2);margin-bottom:1.2rem}
.bocadillo::before{content:"";position:absolute;left:-16px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--espresso)}
.bocadillo::after{content:"";position:absolute;left:-10px;bottom:21px;border:7px solid transparent;border-right:10px solid var(--papel)}
.bocadillo .quien{font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--coral-oscuro)}
.bocadillo .pedido{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:700;line-height:1.35}
.bocadillo .pedido .fr{font-size:1.25em}

.mesa{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.guia-etq{font-size:.88rem;font-weight:900;padding:.15em .7em;border-radius:999px;background:var(--papel);border:2px solid var(--espresso)}
.pizzas{display:flex;gap:1rem;justify-content:center;align-items:flex-start}
.pizza{display:flex;flex-direction:column;align-items:center}
.pizza svg{width:var(--tam);height:var(--tam);display:block;overflow:visible}
.pizzas.una{--tam:min(290px,72vw,28vh)}
.pizzas.dos{--tam:min(250px,43vw,27vh)}
.pizza small{font-weight:900;font-size:.85rem}
.nueva{transform-origin:100px 100px;animation:pon .22s ease-out}
@keyframes pon{from{transform:scale(.7);opacity:0}}

.en-pizza{min-height:2.6em;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:center;font-weight:700}
.en-pizza .mas{font-weight:900}
.en-pizza .chip{display:inline-flex;align-items:center;background:var(--papel);border:2px solid var(--espresso);border-radius:10px;padding:.1em .35em;font-size:1.05rem}

.porciones{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.porcion{width:74px;min-height:92px;border-radius:16px;border:3px solid var(--espresso);background:var(--papel);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;box-shadow:0 4px 0 var(--espresso);padding:.3rem;position:relative}
.porcion:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--espresso)}
.porcion svg{width:42px;height:42px}
.porcion .fr{font-size:1.15rem}
.porcion kbd{position:absolute;top:3px;right:6px;font:700 .7rem var(--fuente);opacity:.6}
.porcion[disabled]{opacity:.4;cursor:not-allowed}
@media (max-width:420px){.porcion{width:62px;min-height:84px}.porcion svg{width:36px;height:36px}.porcion kbd{display:none}}
#controles{display:flex;flex-direction:column;align-items:center}
.acciones{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.pista{font-size:.95rem;font-weight:700;background:#FFF3D0;border:2px dashed var(--oro-oscuro);border-radius:12px;padding:.4rem .8rem;max-width:620px;text-align:center}

.respuesta{width:100%;max-width:720px;border-radius:18px;border:3px solid var(--espresso);padding:.8rem 1rem;background:var(--papel);box-shadow:0 4px 0 rgba(51,43,42,.2)}
.respuesta.bien{background:#E3EFE8;border-color:var(--salvia-oscuro)}
.respuesta.mal{background:#FBE6DE;border-color:var(--coral-oscuro)}
.respuesta h3{margin:0 0 .25rem;font-size:1.15rem}
.respuesta.bien h3{color:var(--salvia-oscuro)}
.respuesta.mal h3{color:var(--coral-oscuro)}
.respuesta p{margin:.2rem 0;font-size:1.05rem}
.respuesta .cuenta{font-size:1.2rem;font-weight:700}
.respuesta .botones{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}

/* Animaciones del cliente */
.feliz{animation:salta .6s ease}
@keyframes salta{30%{transform:translateY(-18px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.duda{animation:duda .5s ease}
@keyframes duda{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.entra{animation:entraC .45s ease-out}
@keyframes entraC{from{transform:translateX(-60px);opacity:0}}
.tiembla{animation:tiembla .3s}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sin-mov *,.sin-mov *::before,.sin-mov *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Capa (diálogos) */
.capa{position:fixed;inset:0;background:rgba(51,43,42,.6);display:grid;place-items:center;padding:1rem;z-index:50}
.caja-capa{background:var(--papel);border:3px solid var(--espresso);border-radius:22px;padding:1.3rem;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.caja-capa h2{margin:.2rem 0 .5rem;font-size:1.6rem}
.caja-capa p{margin:.4rem 0}
.caja-capa ol{text-align:left;margin:.6rem 0;padding-left:1.4rem}
.caja-capa li{margin:.35rem 0}
.caja-capa .estrellas{font-size:3rem;letter-spacing:.15em;color:var(--oro-oscuro);line-height:1.1}
.caja-capa .nuevos{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.caja-capa .nuevos img{width:84px;height:84px;object-fit:contain}
.caja-capa .botones{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
</style>
</head>

<!-- Dibujo compartido: rayas de la guía -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="rayas" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="rgba(90,138,120,.18)"/><rect width="4" height="10" fill="rgba(63,110,92,.45)"/>

<main id="inicio" class="pared">
  <div class="toldo" aria-hidden="true"></div>
  <div class="ini">
    <div class="cabecera">
      <img id="imgPichu" alt="" width="118" height="140">
      <div class="logo"><h1>Pizzería <span>πCHU</span></h1><p>Sirve la fracción justa</p></div>
      <p class="bocadillo-ini" id="saludo"></p>
    </div>
    <div class="menus" id="menus"></div>
    <section class="album" aria-labelledby="tAlbum">
      <h2 id="tAlbum">⭐ Clientes contentos</h2>

    </div>

    <div class="respuesta oculto" id="respuesta" tabindex="-1"></div>
   </div>
   <div class="lado-der">
    <div class="mesa">
      <span class="guia-etq" id="guiaEtq"></span>
      <div class="pizzas una" id="pizzas"></div>
    </div>
    <div class="en-pizza" id="enPizza"></div>
    <div id="controles">
      <div class="porciones" id="porciones" role="group" aria-label="Porciones"></div>
      <div class="acciones" style="margin-top:.7rem">
        <button class="btn claro" type="button" id="btnDeshacer" aria-label="Quitar la última porción">↶ Quitar</button>
        <button class="btn claro" type="button" id="btnVaciar">Vaciar</button>
        <button class="btn verde grande" type="button" id="btnServir">🍕 ¡Servir!</button>
      </div>
    </div>
   </div>
  </div>
</main>

<p class="solo-lector" id="anuncio" aria-live="polite"></p>
<div class="capa oculto" id="capa" role="dialog" aria-modal="true" aria-labelledby="capaTitulo"><div class="caja-capa" id="capaCaja"></div></div>

<script>
(function () {
"use strict";
const M = window.Motor, U = M.U;
const $ = s => document.querySelector(s);
const IMG = { pichu: "{{IMG:pichu}}", reina: "{{IMG:reina}}", pirata: "{{IMG:pirata}}", compas: "{{IMG:compas}}", malabares: "{{IMG:malabares}}",
  pizarra: "{{IMG:pizarra}}", escudo: "{{IMG:escudo}}", salsita: "{{IMG:salsita}}", critico: "{{IMG:critico}}" };

// ---------------- Guardado (pichu.pizzeria.v3) ----------------
const CLAVE = "pichu.pizzeria.v3";
const leerJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const D = Object.assign({ estrellas: {}, album: [], records: {}, ajustes: { sonido: true, movimiento: true }, ayudaVista: false }, leerJSON(CLAVE) || {});
D.ajustes = Object.assign({ sonido: true, movimiento: true }, D.ajustes);
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(D)); } catch (e) { /* modo privado: se juega sin guardar */ } };
const perfil = leerJSON("pichu.perfil.v1");
const alias = perfil && typeof perfil.alias === "string" ? perfil.alias : "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const movimiento = () => D.ajustes.movimiento && !matchMedia("(prefers-reduced-motion: reduce)").matches;

// Fracciones {3/4} → apiladas
const frac = s => s.replace(/\{(\d+)\/(\d+)\}/g, '<span class="fr" aria-hidden="true"><span>$1</span><span>$2</span></span><span class="solo-lector">$1/$2</span>');
const fr = (n, d) => frac(M.F(n, d));

// ---------------- Sonido (Web Audio, sin archivos) ----------------
let ac = null;
function tono(f, dur = .12, tipo = "sine", vol = .12, t0 = 0) {
  if (!D.ajustes.sonido) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) { /* sin sonido */ }
}
const sonidoPoner = d => tono(300 + d * 70, .09, "triangle");
const sonidoBien = () => [523, 659, 784, 1047].forEach((f, i) => tono(f, .16, "triangle", .12, i * .09));
const sonidoMal = () => { tono(220, .18, "sawtooth", .07); tono(180, .25, "sawtooth", .07, .12); };

// ---------------- Dibujo de pizzas (SVG) ----------------
const C = 100, R = 86;
const punto = (f, r, c = C) => { const a = f * 2 * Math.PI - Math.PI / 2; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
function sector(f0, f1, r = R, c = C) {
  if (f1 - f0 >= 0.9999) return `M${c - r},${c}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0Z`;
  const [x0, y0] = punto(f0, r, c), [x1, y1] = punto(f1, r, c);
  return `M${c},${c}L${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${f1 - f0 > .5 ? 1 : 0},1 ${x1.toFixed(2)},${y1.toFixed(2)}Z`;
}
// Ingredientes según el tamaño de la porción (solo decoración: el número va siempre escrito)
function ingredientes(f0, f1, d) {
  const span = f1 - f0, cuantos = Math.max(1, Math.round(span * 14)); let s = "";
  for (let i = 0; i < cuantos; i++) {
    const f = f0 + span * (i + .5) / cuantos, r = R * (i % 2 ? .78 : .5);
    const [x, y] = punto(f, r);
    if (d === 2) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="#B5442E"/><circle cx="${(x - 2).toFixed(1)}" cy="${(y - 2).toFixed(1)}" r="2" fill="#D7664F"/>`;
    else if (d === 3) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#EFE3CC" stroke="#9C7B55" stroke-width="2"/>`;
    else if (d === 4) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="none" stroke="#3A302B" stroke-width="3"/>`;
    else if (d === 6) s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="6" ry="3.5" fill="#4E7F5E" transform="rotate(${Math.round(f * 360)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    else s += `<rect x="${(x - 5).toFixed(1)}" y="${(y - 2).toFixed(1)}" width="10" height="4" rx="2" fill="#C8492F" transform="rotate(${Math.round(f * 360)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return s;
}
// Una pizza: trozos [{f0,f1,d,etiqueta,nueva}], guía (fracción 0..1 de esta pizza o null)
function pizzaSVG(trozos, guia, marca, etiquetaAria) {
  let s = `<svg viewBox="-6 -6 212 212" role="img" aria-label="${esc(etiquetaAria)}">`;
  s += `<circle cx="100" cy="100" r="99" fill="var(--madera)" stroke="var(--madera-oscura)" stroke-width="4"/>`;
  s += `<circle cx="100" cy="100" r="${R}" fill="#F7EBD3" stroke="#C9A877" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  if (guia) s += `<path d="${sector(0, guia)}" fill="url(#rayas)" stroke="var(--salvia-oscuro)" stroke-width="2" stroke-dasharray="5 4"/>`;
  let etiquetas = "";
  for (const t of trozos) {
    s += `<g class="${t.nueva ? "nueva" : ""}"><path d="${sector(t.f0, t.f1)}" fill="#F6D58E" stroke="#C98D45" stroke-width="3" stroke-linejoin="round"/>`;
    s += ingredientes(t.f0, t.f1, t.d);
    s += `<path d="${sector(t.f0, t.f1)}" fill="none" stroke="#8B5A2B" stroke-width="2" stroke-linejoin="round"/>`;
    if (t.etiqueta) {
      const [x, y] = punto((t.f0 + t.f1) / 2, R * (t.f1 - t.f0 > .3 ? .45 : .62));
      etiquetas += `<text class="${t.nueva ? "nueva" : ""}" x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-family="Lato,sans-serif" font-weight="900" font-size="${t.d >= 8 ? 15 : 18}" fill="#332B2A" stroke="#FFF6DF" stroke-width="5" paint-order="stroke">1/${t.d}</text>`;
    }
    s += `</g>`;
  }
  if (guia && trozos.length) s += `<path d="${sector(0, guia)}" fill="none" stroke="var(--salvia-oscuro)" stroke-width="3" stroke-dasharray="6 5"/>`;
  if (marca !== null && marca !== undefined) {
    const [x0, y0] = punto(marca, 10), [x1, y1] = punto(marca, R + 12);
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#332B2A" stroke-width="7" stroke-linecap="round"/>`;
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#A8402A" stroke-width="3.5" stroke-linecap="round"/>`;
    s += `<circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="7" fill="#A8402A" stroke="#332B2A" stroke-width="2.5"/>`;
  }
  return s + etiquetas + `</svg>`;
}
// Icono del botón de porción
function iconoPorcion(d) {
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#F7EBD3" stroke="#332B2A" stroke-width="4" stroke-dasharray="7 5"/>` +
    `<path d="${sector(0, 1 / d, 44, 50)}" fill="#F6D58E" stroke="#332B2A" stroke-width="4" stroke-linejoin="round"/></svg>`;
}

// ---------------- Estado de la partida ----------------
let J = null;          // juego en curso
let ultimoCliente = null, salirArmado = 0, temporizador = null;

function empezar(menuId, contrarreloj = false) {
  const menu = M.MENUS[menuId - 1];
  J = { menu, contrarreloj, n: 0, resultados: [], nuevos: [], pedido: null, porciones: [], fallos: 0, resuelto: false, servidos: 0,
    fin: contrarreloj ? performance.now() + M.CONTRARRELOJ * 1000 : 0, nuevaPorcion: false };
  $("#inicio").classList.add("oculto"); $("#juego").classList.remove("oculto");
  $("#titulo").innerHTML = `<small>${contrarreloj ? "Contrarreloj · " : ""}Menú ${menu.id}</small>${esc(menu.titulo)}`;
  $("#puntos").classList.toggle("oculto", contrarreloj); $("#contador").classList.toggle("oculto", contrarreloj); $("#reloj").classList.toggle("oculto", !contrarreloj);
  $("#pizzas").className = "pizzas " + (menu.pizzas > 1 ? "dos" : "una");
  $("#porciones").innerHTML = menu.botones.map((d, i) =>
    `<button class="porcion" type="button" data-d="${d}" aria-label="Poner ${M.NOMBRE[d]} de pizza"><kbd>${i + 1}</kbd>${iconoPorcion(d)}${fr(1, d)}</button>`).join("");
  window.scrollTo(0, 0);
  nuevoCliente();
  if (contrarreloj) { clearInterval(temporizador); temporizador = setInterval(tic, 200); tic(); }
}

function nuevoCliente() {
  J.pedido = M.generarPedido(J.menu, J.pedido);
  J.porciones = []; J.fallos = 0; J.resuelto = false; J.verGuia = false;
  const libres = M.CLIENTES.filter(c => c.id !== ultimoCliente);
  J.cliente = libres[Math.floor(Math.random() * libres.length)]; ultimoCliente = J.cliente.id;
  const img = $("#imgCliente"); img.src = IMG[J.cliente.id];
  animar(img, "entra");
  $("#quien").textContent = J.cliente.nombre;
  $("#pedido").innerHTML = frac(J.pedido.texto);
  $("#respuesta").classList.add("oculto");
  $("#controles").classList.remove("oculto");
  const pista = $("#pista");
  if (!J.contrarreloj && J.menu.id === 1 && J.n === 0) { pista.innerHTML = "👇 Pon porciones hasta la <b>raya roja</b> y pulsa <b>¡Servir!</b>"; pista.classList.remove("oculto"); }
  else if (!J.contrarreloj && J.n === J.menu.guia && J.menu.guia > 0) { pista.innerHTML = "🧠 A partir de ahora, <b>sin guía</b>: tendrás que calcular cuánto es."; pista.classList.remove("oculto"); }
  else pista.classList.add("oculto");
  anunciar(`${J.cliente.nombre}: ${J.pedido.leer}`);
  pintar();
}

const conGuia = () => J.verGuia || (!J.contrarreloj && J.n < J.menu.guia);
const total = () => J.porciones.reduce((s, d) => s + U / d, 0);

function pintar() {
  const m = J.menu, cap = m.pizzas * U, obj = J.pedido.objetivo, guia = conGuia();
  // Trozos repartidos por las pizzas (una porción puede pasar de una pizza a la siguiente)
  const porPizza = Array.from({ length: m.pizzas }, () => []);
  let a = 0;
  J.porciones.forEach((d, i) => {
    const u = U / d, b = a + u, nueva = J.nuevaPorcion && i === J.porciones.length - 1;
    for (let p = 0; p < m.pizzas; p++) {
      const x0 = Math.max(a, p * U), x1 = Math.min(b, (p + 1) * U);
      if (x1 > x0) porPizza[p].push({ f0: (x0 - p * U) / U, f1: (x1 - p * U) / U, d, nueva, etiqueta: (x1 - x0) * 2 >= u });
    }
    a = b;
  });
  J.nuevaPorcion = false;
  $("#pizzas").innerHTML = porPizza.map((tr, p) => {
    const dentro = Math.min(Math.max(obj - p * U, 0), U) / U;            // parte del pedido en esta pizza
    const guiaP = guia && dentro > 0 ? dentro : null;
    const marca = guia && obj > p * U && obj <= (p + 1) * U ? (obj - p * U) / U % 1 : null;
    const aria = tr.length ? `Pizza ${p + 1}: ${tr.map(t => "1/" + t.d).join(" + ")}` : `Pizza ${p + 1} vacía`;
    return `<div class="pizza">${pizzaSVG(tr, guiaP, marca, aria)}${m.pizzas > 1 ? `<small>Pizza ${p + 1}</small>` : ""}</div>`;
  }).join("");
  $("#guiaEtq").innerHTML = guia ? "👀 Con guía: llena hasta la raya roja" : "🧠 Sin guía: ¡calcula!";
  $("#guiaEtq").classList.toggle("oculto", !$("#pista").classList.contains("oculto") && J.n === 0 && J.menu.id === 1 && !J.contrarreloj);
  // Porciones puestas
  const g = J.porciones.map(d => `<span class="chip">${fr(1, d)}</span>`);
  $("#enPizza").innerHTML = g.length ? `<span>En la pizza:</span> ${g.join('<span class="mas" aria-hidden="true">+</span>')}` : `<span>La pizza está vacía.</span>`;
  // Botones
  const t = total();
  document.querySelectorAll(".porcion").forEach(b => { b.disabled = J.resuelto || t + U / +b.dataset.d > cap; });
  $("#btnDeshacer").disabled = $("#btnVaciar").disabled = !J.porciones.length || J.resuelto;
  $("#btnServir").disabled = !J.porciones.length || J.resuelto;
  // Puntos de progreso
  if (!J.contrarreloj) {
    $("#puntos").innerHTML = Array.from({ length: m.clientes }, (_, i) => {
      const r = J.resultados[i];
      const cls = r === undefined ? (i === J.n ? "ahora" : "") : r ? "bien" : "casi";
      return `<span class="${cls}" aria-hidden="true">${r === undefined ? "" : r ? "✓" : "•"}</span>`;
    }).join("");
    $("#puntos").setAttribute("aria-label", `Cliente ${Math.min(J.n + 1, m.clientes)} de ${m.clientes}`);
    $("#contador").textContent = `🍕 ${Math.min(J.n + 1, m.clientes)}/${m.clientes}`;
  }
}

function poner(d) {
  if (!J || J.resuelto) return;
  const cap = J.menu.pizzas * U;
  if (total() + U / d > cap) { animar($("#pizzas"), "tiembla"); anunciar("No cabe en la pizza."); return; }
  J.porciones.push(d); J.nuevaPorcion = movimiento(); sonidoPoner(d);
  $("#pista").classList.toggle("oculto", !(J.menu.id === 1 && J.n === 0 && !J.contrarreloj));
  anunciar(`Pones ${M.NOMBRE[d]}.`);
  pintar();
}
function deshacer() { if (!J || J.resuelto || !J.porciones.length) return; J.porciones.pop(); tono(260, .08); pintar(); }
function vaciar() { if (!J || J.resuelto || !J.porciones.length) return; J.porciones = []; tono(200, .1); pintar(); }

function servir() {
  if (!J || J.resuelto || !J.porciones.length) return;
  const r = M.comprobar(J.pedido.objetivo, J.porciones), img = $("#imgCliente"), caja = $("#respuesta");
  $("#pista").classList.add("oculto");
  caja.classList.remove("oculto", "bien", "mal");
  if (r.exacto) {
    J.resuelto = true; J.servidos++;
    const primera = J.fallos === 0;
    if (!J.contrarreloj) J.resultados[J.n] = primera;
    sonidoBien(); animar(img, "feliz");
    const frases = ["¡Mmm, perfecto!", "¡Justo lo que pedí!", "¡Qué buena pinta!", "¡Exacto! Gracias."];
    $("#pedido").innerHTML = frases[Math.floor(Math.random() * frases.length)] + " 😋";
    const op = J.pedido.operacion ? `<p class="cuenta">Pedido: ${frac(J.pedido.operacion)} = ${frac(M.FU(J.pedido.objetivo))}</p>` : "";
    caja.classList.add("bien");
    caja.innerHTML = `<h3>✔ ${primera ? "¡A la primera!" : "¡Servido!"}</h3>
      <p class="cuenta">Has servido: ${frac(M.cuentaSuma(J.porciones))}</p>${op}
      ${J.contrarreloj ? "" : `<div class="botones"><button class="btn verde" type="button" id="btnSig">${J.n + 1 >= J.menu.clientes ? "Ver resultado ▶" : "Siguiente cliente ▶"}</button></div>`}`;
    $("#controles").classList.add("oculto"); $("#pista").classList.add("oculto");
    anunciar(`¡Bien! Has servido ${M.plano(M.cuentaSuma(J.porciones))}.`);
    pintar();
    if (J.contrarreloj) setTimeout(() => { if (J && J.contrarreloj && J.resuelto) nuevoCliente(); }, 1100);
    else { $("#btnSig").onclick = siguiente; $("#btnSig").focus({ preventScroll: true }); caja.scrollIntoView({ block: "nearest", behavior: movimiento() ? "smooth" : "auto" }); }
  } else {
    J.fallos++; J.verGuia = true;
    sonidoMal(); animar(img, "duda");
    $("#pedido").innerHTML = `<b>${r.falta ? "Mmm… me parece poco." : "¡Uy, eso es demasiado!"}</b> ${frac(J.pedido.texto)}`;
    const dif = r.falta || r.sobra;
    const comun = r.comun > 1 ? `<p>Pedido: ${fr(r.pedido.n, r.pedido.d)}${r.pedido.d !== r.comun ? " = " + fr(r.pedidoComun, r.comun) : ""} · Has puesto: ${r.hecho.d === 1 ? r.hecho.n : fr(r.hecho.n, r.hecho.d)}${r.hecho.d !== r.comun && r.hecho.d !== 1 ? " = " + fr(r.hechoComun, r.comun) : ""}</p>` : "";
    caja.classList.add("mal");
    caja.innerHTML = `<h3>✘ ${r.falta ? "Te falta" : "Te sobra"} ${fr(dif.n, dif.d)}</h3>${comun}
      <p>Ahora ves la guía en la pizza: ${r.falta ? "añade lo que falta" : "quita lo que sobra"} y vuelve a servir.</p>
      ${J.fallos >= 2 ? `<div class="botones"><button class="btn oro" type="button" id="btnPista">💡 Ver una forma de servirlo</button></div>` : ""}`;
    if (J.fallos >= 2) $("#btnPista").onclick = () => {
      $("#btnPista").parentElement.outerHTML = `<p><b>Una forma:</b> ${J.pedido.solucion.map(d => fr(1, d)).join(" + ")}</p>`;
    };
    anunciar(`${r.falta ? "Te falta" : "Te sobra"} ${dif.n}/${dif.d}.`);
    pintar();
  }
}

function siguiente() {
  if (!J || !J.resuelto) return;
  J.n++;
  if (J.n >= J.menu.clientes) return finMenu();
  nuevoCliente();
  window.scrollTo({ top: 0, behavior: movimiento() ? "smooth" : "auto" });
}

function finMenu() {
  const m = J.menu, primera = J.resultados.filter(Boolean).length, est = M.estrellas(primera, m.clientes);
  const antes = D.estrellas[m.id] || 0;
  D.estrellas[m.id] = Math.max(antes, est);
  for (const id of M.premios(m.id, est)) if (!D.album.includes(id)) { D.album.push(id); J.nuevos.push(id); }
  guardar();
  const sig = M.MENUS[m.id];
  sonidoBien();
  capa(`<h2 id="capaTitulo">¡Menú ${m.id} terminado!</h2>
    <div class="estrellas" aria-label="${est} de 3 estrellas">${"★".repeat(est)}${"☆".repeat(3 - est)}</div>
    <p>Clientes servidos a la primera: <b>${primera} de ${m.clientes}</b></p>
    <p>${est === 3 ? "¡Perfecto! Eres un maestro pizzero." : est === 2 ? "¡Muy bien! Para 3 estrellas, sirve a todos a la primera." : "Para más estrellas, intenta acertar a la primera."}</p>
    ${J.nuevos.length ? `<p><b>${J.nuevos.length > 1 ? "Nuevos clientes" : "Nuevo cliente"} en tu álbum:</b></p><div class="nuevos">${J.nuevos.map(id => `<img src="${IMG[id]}" alt="${esc(M.CLIENTES.find(c => c.id === id).nombre)}">`).join("")}</div>` : ""}
    <div class="botones">
      ${sig ? `<button class="btn verde" type="button" id="cSig">Menú ${sig.id} ▶</button>` : ""}
      <button class="btn claro" type="button" id="cRep">↻ Repetir</button>
      <button class="btn claro" type="button" id="cMenu">Menús</button>
    </div>`);
  if (sig) $("#cSig").onclick = () => { cerrarCapa(); empezar(sig.id); };
  $("#cRep").onclick = () => { cerrarCapa(); empezar(m.id); };
  $("#cMenu").onclick = () => { cerrarCapa(); inicio(); };
}

function tic() {
  if (!J || !J.contrarreloj) return clearInterval(temporizador);
  const quedan = Math.max(0, J.fin - performance.now()), s = Math.ceil(quedan / 1000);
  $("#tubo").style.width = (quedan / (M.CONTRARRELOJ * 10)) + "%";
  $("#segundos").textContent = s + " s";
  if (quedan <= 0) {
    clearInterval(temporizador);
    const m = J.menu, antes = D.records[m.id] || 0, n = J.servidos;
    if (n > antes) { D.records[m.id] = n; guardar(); }
    J.resuelto = true;
    sonidoBien();
    capa(`<h2 id="capaTitulo">⏱ ¡Tiempo!</h2>
      <p style="font-size:1.3rem">Has servido <b>${n}</b> ${n === 1 ? "cliente" : "clientes"} en ${M.CONTRARRELOJ} segundos.</p>
      <p>${n > antes ? "🏆 ¡Nuevo récord!" : `Tu récord: ${antes}`}</p>
      <div class="botones"><button class="btn verde" type="button" id="cRep">↻ Otra vez</button><button class="btn claro" type="button" id="cMenu">Menús</button></div>`);
    $("#cRep").onclick = () => { cerrarCapa(); empezar(m.id, true); };
    $("#cMenu").onclick = () => { cerrarCapa(); inicio(); };
  }
}

// ---------------- Pantalla de inicio ----------------
function inicio() {
  clearInterval(temporizador); J = null; salirArmado = 0;
  $("#juego").classList.add("oculto"); $("#inicio").classList.remove("oculto");
  $("#imgPichu").src = IMG.pichu;
  $("#saludo").textContent = `¡Hola${alias ? ", " + alias : ""}! Soy Pichu, el cocinero. Cada cliente pide un trozo de pizza: ¿me ayudas a servir la cantidad justa?`;
  $("#menus").innerHTML = M.MENUS.map(m => {
    const est = D.estrellas[m.id] || 0, abierto = m.id === 1 || (D.estrellas[m.id - 1] || 0) > 0, rec = D.records[m.id];
    return `<section class="menu-card ${abierto ? "" : "bloq"}" aria-labelledby="m${m.id}">
      <span class="num" aria-hidden="true">${abierto ? m.id : "🔒"}</span>
      <h2 id="m${m.id}">Menú ${m.id} · ${esc(m.titulo)}</h2>
      <p>${frac(m.sub.replace(/(\d+)\/(\d+)/g, "{$1/$2}"))}</p>
      <div class="est" aria-label="${est} de 3 estrellas">${"★".repeat(est)}${"☆".repeat(3 - est)}${rec ? `<small>⏱ récord: ${rec}</small>` : ""}</div>
      ${abierto ? `<div class="acc"><button class="btn verde" type="button" data-jugar="${m.id}">▶ Jugar</button>
        ${est ? `<button class="btn claro" type="button" data-reloj="${m.id}">⏱ Contrarreloj</button>` : ""}</div>`
        : `<p class="candado">Consigue una estrella en el menú ${m.id - 1} para abrirlo.</p>`}
    </section>`;
  }).join("");
  $("#album").innerHTML = M.CLIENTES.map(c => {
    const si = D.album.includes(c.id);
    return `<li class="${si ? "" : "no"}"><img src="${IMG[c.id]}" alt=""><span>${si ? esc(c.nombre) : `Menú ${c.menu} · ${"★".repeat(c.est)}`}</span><span class="solo-lector">${si ? "" : " (todavía no)"}</span></li>`;
  }).join("");
  pintarAjustes();
  if (!D.ayudaVista) { D.ayudaVista = true; guardar(); ayuda(); }
}
function pintarAjustes() {
  $("#btnSonido").setAttribute("aria-pressed", D.ajustes.sonido); $("#btnSonido").textContent = D.ajustes.sonido ? "🔊 Sonido: sí" : "🔇 Sonido: no";
  $("#btnMov").setAttribute("aria-pressed", D.ajustes.movimiento); $("#btnMov").textContent = D.ajustes.movimiento ? "✨ Animaciones: sí" : "Animaciones: no";
  document.body.classList.toggle("sin-mov", !D.ajustes.movimiento);
}
function ayuda() {
  capa(`<h2 id="capaTitulo">🍕 Cómo se juega</h2>
    <ol>
      <li>Un cliente te pide un trozo de pizza: <b>${fr(3, 4)}</b>, «la mitad de…», «somos 3…».</li>
      <li>Toca las <b>porciones</b> de abajo (${fr(1, 2)}, ${fr(1, 4)}…) para ponerlas en la pizza.</li>
      <li>Pulsa <b>¡Servir!</b> Tiene que ser <b>exacto</b>: ni más ni menos.</li>
    </ol>
    <p>Al principio verás una <b>raya roja</b> que marca hasta dónde llenar. Después, ¡a calcular!</p>
    <p>Sirve a todos a la primera para ganar <b>3 estrellas</b>.</p>
    <p style="font-size:.9rem">Teclado: <kbd>1</kbd>–<kbd>5</kbd> porciones · <kbd>Retroceso</kbd> quitar · <kbd>Intro</kbd> servir</p>
    <div class="botones"><button class="btn verde" type="button" id="cOk">¡A cocinar!</button></div>`);
  $("#cOk").onclick = cerrarCapa;
}

// ---------------- Utilidades ----------------
let focoPrevio = null;
function capa(html) {
  if ($("#capa").classList.contains("oculto")) focoPrevio = document.activeElement;
  $("#capaCaja").innerHTML = html; $("#capa").classList.remove("oculto");
  const b = $("#capaCaja button"); if (b) b.focus();
}
function cerrarCapa() { $("#capa").classList.add("oculto"); if (focoPrevio && document.contains(focoPrevio) && focoPrevio.offsetParent) focoPrevio.focus({ preventScroll: true }); }
function animar(el, clase) { if (!movimiento()) return; el.classList.remove(clase); void el.offsetWidth; el.classList.add(clase); setTimeout(() => el.classList.remove(clase), 700); }
function anunciar(t) { const a = $("#anuncio"); a.textContent = ""; setTimeout(() => { a.textContent = t; }, 30); }

// ---------------- Eventos ----------------
$("#menus").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.jugar) empezar(+b.dataset.jugar);
  if (b.dataset.reloj) empezar(+b.dataset.reloj, true);
});
$("#porciones").addEventListener("click", e => { const b = e.target.closest(".porcion"); if (b && !b.disabled) poner(+b.dataset.d); });
$("#btnDeshacer").onclick = deshacer;
$("#btnVaciar").onclick = vaciar;
$("#btnServir").onclick = servir;
$("#btnAyuda").onclick = ayuda;
$("#btnSonido").onclick = () => { D.ajustes.sonido = !D.ajustes.sonido; guardar(); pintarAjustes(); tono(660, .1); };
$("#btnMov").onclick = () => { D.ajustes.movimiento = !D.ajustes.movimiento; guardar(); pintarAjustes(); };
// Salir con doble pulsación (si la partida está empezada)
$("#btnSalir").onclick = () => {
  const empezada = J && (J.contrarreloj || J.n > 0 || J.porciones.length);
  if (!empezada || Date.now() - salirArmado < 3000) return inicio();
  salirArmado = Date.now();
  const b = $("#btnSalir"); b.textContent = "¿Salir? Pulsa otra vez";
  setTimeout(() => { if (Date.now() - salirArmado >= 3000) b.textContent = "← Menús"; }, 3100);
};
document.addEventListener("keydown", e => {
  if (!$("#capa").classList.contains("oculto")) { if (e.key === "Escape" && $("#cOk")) cerrarCapa(); return; }
  if (!J || $("#juego").classList.contains("oculto") || e.ctrlKey || e.metaKey || e.altKey) return;
  const enBoton = e.target.closest && e.target.closest("button");
  if (/^[1-9]$/.test(e.key)) { const d = J.menu.botones[+e.key - 1]; if (d) { e.preventDefault(); poner(d); } }
  else if (e.key === "Backspace") { e.preventDefault(); deshacer(); }
  else if (e.key === "Enter" && !enBoton) { e.preventDefault(); J.resuelto ? (!J.contrarreloj && siguiente()) : servir(); }
  else if (e.key === "Escape") $("#btnSalir").click();
});

// Para las pruebas automáticas
window.__pizzeria = { M, D, get J() { return J; }, empezar, poner, servir, siguiente, inicio };
inicio();
})();
