<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Duel πCHU · Fracciones</title>
<meta name="description" content="Pizza Duel: duelos de cocina contra chefs rivales. Sirve fracciones exactas para ganar.">
<meta name="theme-color" content="#332B2A">
<!-- πCHU: botón para volver a la portada -->
<script src="../../compartido/volver.js" defer></script>
<style>
@font-face{font-family:"Lato";font-weight:400;font-display:swap;src:url("../../compartido/fuentes/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-display:swap;src:url("../../compartido/fuentes/lato-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-display:swap;src:url("../../compartido/fuentes/lato-latin-900-normal.woff2") format("woff2")}
:root{
  --espresso:#332B2A; --salvia:#5A8A78; --coral:#E46D4D; --crema:#F4EDD7;
  --coral-oscuro:#A8402A; --salvia-oscuro:#3F6E5C; --papel:#FFFCF3; --linea:#D9CFB4; --oro:#E8B04B;
  --masa:#D9A55B; --queso:#F6D58E; --peperoni:#A8402A; --madera:#6B4A3A; --noche:#1d1716;
  --fuente:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fuente);color:var(--espresso);line-height:1.4;min-height:100vh;background:var(--espresso);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.oculto{display:none!important}
.solo-lector{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em;font-weight:900}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .1em .06em}
.fr>span:last-child{padding:.06em .1em 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:46px;padding:.45em 1.2em;border-radius:14px;border:3px solid var(--espresso);
  background:var(--coral-oscuro);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--espresso);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--espresso)}
.btn.verde{background:var(--salvia-oscuro)}
.btn.claro{background:var(--papel);color:var(--espresso)}
.btn.oro{background:var(--oro);color:var(--espresso)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--espresso)}
.btn.peq{min-height:44px;padding:.25em .8em;font-size:.95rem;border-radius:11px}

/* ================= MAPA DE RIVALES ================= */
#mapa{min-height:100vh;background:
  radial-gradient(circle at 15% 10%,rgba(232,176,75,.22),transparent 40%),
  radial-gradient(circle at 85% 95%,rgba(228,109,77,.25),transparent 45%), var(--espresso);color:var(--crema);padding:1.2rem 1rem 5rem}
.ini{max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.4rem 0 1rem;text-align:center;flex-wrap:wrap}
.logo img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.logo h1{margin:0;font-size:clamp(2.6rem,9vw,5rem);font-weight:900;line-height:.95;letter-spacing:-.02em;color:var(--oro);text-shadow:0 4px 0 var(--coral-oscuro),0 8px 0 var(--noche)}
.logo h1 span{color:var(--crema)}
.lema{text-align:center;margin:0 auto 1.2rem;max-width:640px;font-size:1.1rem}
.rivales{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
.rival-card{position:relative;width:100%;height:100%;display:grid;grid-template-columns:76px 1fr;gap:.2rem .7rem;align-items:center;text-align:left;padding:.7rem;border-radius:18px;
  border:3px solid var(--espresso);background:var(--papel);color:var(--espresso);cursor:pointer;box-shadow:0 5px 0 var(--noche);transition:transform .12s}
.rival-card:hover:not([disabled]){transform:translateY(-3px)}
.rival-card>span,.rival-card>b,.rival-card>small{min-width:0;overflow-wrap:anywhere}
.rival-card img{grid-row:span 4;width:76px;height:96px;object-fit:contain}
.rival-card .n{font-size:.75rem;font-weight:900;color:var(--coral-oscuro);text-transform:uppercase;letter-spacing:.05em}
.rival-card b{font-size:1.1rem;line-height:1.1}
.rival-card small{font-size:.85rem;line-height:1.2}
.rival-card .est{font-size:1.05rem;letter-spacing:.08em;color:#8A5A0E;font-weight:900}
.rival-card.jefe{background:linear-gradient(135deg,#FFF3D6,#F4D58E)}
.rival-card[disabled]{cursor:not-allowed;background:#CFC6B0}
.rival-card[disabled] img{filter:brightness(0);opacity:.45}
.rival-card .pronto{font-size:.85rem;font-weight:900}
.acciones{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.3rem}

/* ================= DUELO ================= */
#duelo{min-height:100vh;display:flex;flex-direction:column;background:
  repeating-linear-gradient(45deg,rgba(51,43,42,.035) 0 12px,transparent 12px 24px),linear-gradient(var(--crema),#EFE4C8)}
.cabecera{position:sticky;top:0;z-index:20}
.hud{display:flex;align-items:center;gap:.5rem .8rem;flex-wrap:wrap;padding:.45rem .8rem;background:var(--espresso);color:var(--crema)}
.hud .marca{font-weight:900;font-size:1.05rem;margin-right:auto;white-space:nowrap}
.hud .marca span{color:var(--oro)}
.hud .btn{box-shadow:none;border-color:var(--crema);background:transparent;color:var(--crema)}

/* Arena: πCHU contra el rival */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:.6rem;padding:.6rem 1rem .4rem;color:var(--crema);
  background:radial-gradient(ellipse at 50% 120%,rgba(232,176,75,.35),transparent 60%),linear-gradient(#3d3230,var(--espresso));border-bottom:4px solid var(--noche)}
.luchador{display:flex;align-items:flex-end;gap:.7rem;min-width:0}
.luchador.rival{flex-direction:row-reverse;text-align:right}
.luchador .foto{position:relative;flex:none;width:120px;height:130px;display:grid;place-items:end center}
.luchador .foto img{max-height:130px;width:auto;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:respira 2.4s ease-in-out infinite}
.luchador.rival .foto img{animation-delay:-1.2s}
@keyframes respira{50%{transform:translateY(-4px) scale(1.02)}}
.ficha{min-width:0;flex:1;padding-bottom:.4rem}
.ficha .nombre{font-weight:900;font-size:1.15rem;line-height:1.1}
.corazones{font-size:1.5rem;letter-spacing:.06em;line-height:1;color:#FF8A73}
.corazones .vacio{color:#7a6a66}
.vida{position:relative;height:22px;border-radius:999px;background:var(--noche);border:2px solid var(--crema);overflow:hidden;margin-top:.3rem}
.vida span{position:absolute;inset:0 auto 0 0;background:linear-gradient(#F08A6C,var(--coral));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.vida.baja span{background:linear-gradient(#FFD36B,var(--oro))}
.vida b{position:relative;display:block;text-align:center;font-size:.8rem;line-height:18px;color:#fff;text-shadow:0 1px 2px #000}
.carga{display:flex;gap:4px;margin-top:.35rem;align-items:center}
.carga i{width:22px;height:12px;border-radius:4px;border:2px solid var(--crema);background:transparent}
.carga i.on{background:var(--oro);border-color:var(--oro)}
.carga small{font-size:.75rem;margin-left:.3rem}
.centro{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding-bottom:.5rem}
.vs{font-weight:900;font-size:2rem;color:var(--oro);text-shadow:0 3px 0 var(--coral-oscuro)}
.reloj{font-weight:900;font-size:1.05rem;min-width:70px;text-align:center;padding:.15rem .5rem;border-radius:10px;background:var(--noche)}
.reloj.baja{color:#FFB199;animation:pulso .8s infinite}
.reloj.hielo{color:#BFE6FF}
@keyframes pulso{50%{transform:scale(1.15)}}
.bocadillo{position:absolute;right:calc(100% - 20px);top:-8px;width:max-content;max-width:min(260px,40vw);background:var(--papel);color:var(--espresso);border:3px solid var(--espresso);
  border-radius:16px 16px 4px 16px;padding:.35rem .6rem;font-weight:700;font-size:.92rem;line-height:1.2;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:bocadillo .3s cubic-bezier(.2,1.5,.4,1);z-index:3;text-align:left;pointer-events:none}
@keyframes bocadillo{from{transform:scale(.3);opacity:0}}
.foto.golpeado img{animation:golpeado .5s}
@keyframes golpeado{0%{filter:brightness(3) drop-shadow(0 0 0 #fff)}20%{transform:translateX(14px) rotate(6deg)}45%{transform:translateX(-8px) rotate(-3deg)}70%{transform:translateX(4px)}}
.luchador.yo .foto.golpeado img{animation:golpeadoYo .5s}
@keyframes golpeadoYo{0%{filter:brightness(3)}20%{transform:translateX(-14px) rotate(-6deg)}45%{transform:translateX(8px) rotate(3deg)}}
.foto.embiste img{animation:embiste .4s}
@keyframes embiste{40%{transform:translateX(40px) scale(1.1) rotate(4deg)}}
.luchador.rival .foto.embiste img{animation:embisteR .4s}
@keyframes embisteR{40%{transform:translateX(-40px) scale(1.1) rotate(-4deg)}}

/* Tablero: comanda + cocina */
.tablero{display:grid;grid-template-columns:minmax(290px,380px) 1fr;gap:.9rem;padding:.8rem;align-items:start;flex:1}
.comanda{position:relative;background:#fff;border:3px solid var(--espresso);border-radius:8px 8px 0 0;padding:.7rem .8rem 1.3rem;box-shadow:0 6px 0 rgba(51,43,42,.25);animation:entra .45s cubic-bezier(.2,1.4,.4,1)}
.comanda::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-12px;height:12px;
  background:linear-gradient(-45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x,linear-gradient(45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x}
@keyframes entra{from{transform:translateY(-40px) rotate(-4deg);opacity:0}}
.comanda.tiembla{animation:temblor .35s}
@keyframes temblor{25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
.c-cab{display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.etq{padding:.15em .55em;border-radius:999px;background:var(--crema)}
.etq.mult{background:#DCE8E1;color:var(--salvia-oscuro)} .etq.div{background:#E5E0F2;color:#4B3F7A} .etq.jefe{background:var(--oro)}
.regla{margin:.45rem 0 0;padding:.35rem .55rem;border-radius:10px;background:#FBEDE7;border:2px solid var(--coral-oscuro);color:#7A2E1E;font-size:.88rem;font-weight:700}
.c-pedido{font-size:1.25rem;font-weight:700;margin:.5rem 0;min-height:2.8em}
.c-pedido .fr{font-size:1.35em}
.tiempo{height:10px;border-radius:999px;background:#EEE4CC;overflow:hidden;margin:.2rem 0 .55rem}
.tiempo span{display:block;height:100%;border-radius:999px;background:var(--salvia);transition:width .2s linear}
.tiempo.media span{background:var(--oro)} .tiempo.baja span{background:var(--coral)} .tiempo.hielo span{background:#7FC4EA}
.plato{min-height:96px;border:2px dashed var(--linea);border-radius:12px;padding:.4rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;justify-content:center;background:var(--papel)}
.plato .vacio{font-size:.88rem;opacity:.75;text-align:center}
.plato svg{width:86px;height:86px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:.1em .55em;border-radius:9px;border:2px solid var(--espresso);background:var(--queso);cursor:pointer;font-size:1rem}
.c-botones{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:.5rem;margin-top:.6rem}
.c-botones .btn{padding-left:.4em;padding-right:.4em}
.btn.servir{font-size:1.15rem}
.c-resp{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.5rem}
.c-resp .btn{padding:.2em;font-size:1.25rem}
.c-dibujo{display:flex;justify-content:center;gap:.3rem}
.c-dibujo svg{width:80px;height:80px}
.c-intento{font-size:.85rem;color:var(--coral-oscuro);font-weight:900;min-height:1.2em;margin-top:.3rem}
.btn.super{width:100%;background:linear-gradient(90deg,var(--oro),#FFD36B);color:var(--espresso)}
.btn.super:not([disabled]){animation:brilla 1.2s infinite}
@keyframes brilla{50%{box-shadow:0 4px 0 var(--espresso),0 0 18px 4px rgba(232,176,75,.9)}}
.btn.super.activo{background:#BFE6FF}

.cocina{display:grid;grid-template-columns:130px 1fr;gap:.7rem;align-items:end}
.horno{position:relative;height:160px;border-radius:70px 70px 14px 14px;background:linear-gradient(#B4574A,#8C3F35);border:4px solid var(--espresso);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.boca{position:relative;width:84px;height:52px;border-radius:44px 44px 6px 6px;background:var(--noche);border:3px solid var(--espresso);overflow:hidden}
.fuego{position:absolute;inset:auto 0 0;height:70%;background:radial-gradient(ellipse at 50% 100%,#FFD36B,#FF7A3D 45%,transparent 70%);animation:fuego 1s infinite alternate}
@keyframes fuego{to{transform:scaleY(1.2) translateY(-3px);opacity:.85}}
.horno .barra{position:absolute;left:12px;right:12px;top:14px;height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.horno .barra span{display:block;height:100%;background:var(--oro)}
.horno .rotulo{position:absolute;top:32px;color:#FFE9BF;font-weight:900;font-size:.8rem;letter-spacing:.08em}
.mostrador{position:relative;border-radius:16px;border:4px solid var(--espresso);background:var(--madera);padding:.9rem .6rem 1.2rem;min-height:190px;box-shadow:inset 0 -12px 0 rgba(0,0,0,.2)}
.cinta{position:absolute;left:0;right:0;bottom:10px;height:14px;background:repeating-linear-gradient(90deg,#2a2221 0 20px,#3d3230 20px 40px);animation:cinta 1.2s linear infinite;opacity:.8}
@keyframes cinta{to{background-position:40px 0}}
.huecos{position:relative;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;z-index:1}
.pizza{position:relative;width:140px;display:flex;flex-direction:column;align-items:center;animation:llega .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes llega{from{transform:translateX(-160px) rotate(-90deg);opacity:0}}
.pizza svg{width:140px;height:140px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.pizza .corte{font-size:.82rem;font-weight:900;color:var(--crema);background:rgba(0,0,0,.4);padding:.05em .55em;border-radius:999px}
.pizza .pie{display:flex;align-items:center;gap:.35rem;margin-top:.15rem}
.pizza .tirar{width:44px;height:44px;border-radius:50%;border:2px solid var(--espresso);background:var(--papel);cursor:pointer;font-size:1rem;line-height:1;padding:0}
.hueco-pizza{margin-bottom:50px;width:140px;height:140px;border-radius:50%;border:3px dashed rgba(244,237,215,.25)}
.porcion{cursor:pointer}
.porcion:hover{filter:brightness(1.1)}
.porcion:focus{outline:none}
.porcion:focus-visible path.borde{stroke:var(--oro);stroke-width:6}
.agujero path{fill:rgba(0,0,0,.18);stroke:rgba(244,237,215,.35);stroke-dasharray:4 4}

/* Avisos y efectos */
#aviso{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;width:min(560px,94vw);border:3px solid var(--espresso);border-radius:16px;padding:.7rem 1rem;
  background:var(--papel);box-shadow:0 8px 0 rgba(51,43,42,.25);font-size:1rem;cursor:pointer;animation:aviso .3s}
#aviso.bien{background:#EEF5F1;border-color:var(--salvia-oscuro)} #aviso.mal{background:#FBEDE7;border-color:var(--coral-oscuro)}
#aviso h3{margin:0 0 .25rem;font-size:1.1rem}
#aviso p{margin:.2rem 0}
#aviso .op{font-weight:700}
@keyframes aviso{from{transform:translate(-50%,20px);opacity:0}}
.flota{position:fixed;z-index:45;font-weight:900;font-size:2.2rem;color:#fff;text-shadow:0 3px 0 var(--coral-oscuro),0 0 10px rgba(0,0,0,.5);pointer-events:none;animation:flota 1.1s ease-out forwards}
@keyframes flota{to{transform:translateY(-80px) scale(1.25);opacity:0}}
.grito{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:46;font-weight:900;font-size:clamp(2rem,7vw,4rem);color:var(--oro);
  text-shadow:0 4px 0 var(--coral-oscuro),0 8px 0 var(--espresso);pointer-events:none;animation:grito 1.1s ease-out forwards;white-space:nowrap}
@keyframes grito{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.destello{position:fixed;inset:0;z-index:44;pointer-events:none;animation:destello .45s ease-out forwards}
@keyframes destello{from{opacity:.55}to{opacity:0}}
.confeti{position:fixed;width:10px;height:14px;z-index:44;pointer-events:none;animation:confeti 1.2s ease-in forwards}
@keyframes confeti{to{transform:translate(var(--dx),220px) rotate(540deg);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* Capas */
.capa{position:fixed;inset:0;background:rgba(29,23,22,.8);display:grid;place-items:center;padding:1rem;z-index:60}
.caja-capa{background:var(--papel);border:4px solid var(--espresso);border-radius:22px;padding:1.3rem;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 10px 0 var(--noche)}
.caja-capa h2{margin:.1rem 0 .6rem;font-size:1.7rem;font-weight:900}
.caja-capa .estrellas{font-size:3rem;letter-spacing:.15em;color:#B9811F}
.caja-capa ul{text-align:left}
.caja-capa label{display:flex;gap:.6rem;align-items:flex-start;text-align:left;margin:.7rem 0}
.caja-capa input[type=checkbox]{width:24px;height:24px;flex:none;margin-top:1px}
.cara-a-cara{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.3rem 0 .6rem}
.cara-a-cara img{height:150px;width:auto;object-fit:contain}
.cara-a-cara .vs{font-size:2.6rem}
.cita{font-style:italic;font-size:1.1rem;margin:.4rem 0}
.botones{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}
.datos-duelo{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:center;font-size:1.05rem}

/* Móvil (al final para que mande sobre lo anterior) */
@media (max-width:860px){.tablero{grid-template-columns:1fr}}
@media (max-width:700px){
  .hud{padding:.3rem .6rem}
  .hud .marca{font-size:.95rem}
  .arena{padding:.35rem .5rem .3rem;gap:.3rem;align-items:center}
  .luchador{gap:.35rem}
  .luchador .foto{width:52px;height:62px}
  .luchador .foto img{max-height:62px}
  .ficha{padding-bottom:0}
  .ficha .nombre{font-size:.9rem}
  .corazones{font-size:1.15rem}
  .vida{height:20px;margin-top:.15rem}
  .carga{margin-top:.15rem}.carga i{width:16px;height:10px}
  .centro{padding-bottom:0}
  .vs{font-size:1.2rem}
  .reloj{min-width:56px;font-size:.9rem}
  .comanda{padding:.5rem .6rem 1.1rem}
  .c-pedido{font-size:1.1rem;margin:.3rem 0;min-height:0}
  .plato{min-height:64px}.plato svg{width:60px;height:60px}
  .huecos{gap:.4rem}
  .bocadillo{top:2px;right:calc(100% + 6px);max-width:58vw;font-size:.85rem;border-radius:14px 4px 14px 14px}
  .cocina{grid-template-columns:1fr}
  .horno{height:56px;border-radius:28px;flex-direction:row;justify-content:center;gap:1rem;padding:0 1rem}
  .horno .boca{width:56px;height:32px}
  .horno .rotulo{position:static}
  .horno .barra{top:auto;bottom:6px}
  .pizza,.pizza svg{width:104px}.pizza svg{height:104px}.hueco-pizza{width:104px;height:104px}
  .pizza .tirar{width:44px;height:44px}.pizza .corte{font-size:.75rem}
  .cara-a-cara img{height:110px}
  .tablero{padding:.6rem .6rem 4.5rem}
  #aviso{bottom:auto;top:8px;font-size:.95rem}
  @keyframes aviso{from{transform:translate(-50%,-20px);opacity:0}}}
.sin-mov *,.sin-mov *::before,.sin-mov *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= MAPA DE RIVALES ================= -->
<main id="mapa">
  <div class="ini">
    <header class="logo">
      <img id="logoPichu" alt="">

<script>
/*MOTOR*/
</script>
<script>
(function () {
"use strict";
const M = window.Motor, U = M.U;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fx = s => esc(s).replace(/(\d+)\/(\d+)/g, '<span class="fr" aria-label="$1 entre $2"><span>$1</span><span>$2</span></span>');
const azar = a => a[Math.floor(Math.random() * a.length)];
const IMG = { pichu: "{{IMG:pichu}}", salsita: "{{IMG:salsita}}", compas: "{{IMG:compas}}", malabares: "{{IMG:malabares}}", escudo: "{{IMG:escudo}}",
  pizarra: "{{IMG:pizarra}}", pirata: "{{IMG:pirata}}", reina: "{{IMG:reina}}", critico: "{{IMG:critico}}" };
// Rivales que ya se pueden jugar (el resto sale como «Próximamente» en el mapa)
const LISTOS = new Set([1, 2]);
const HUECOS = 4, INTERVALO_HORNO = 5, CONGELA = 8;

/* ================= Guardado =================
   pichu.pizzeria.v3 (Pizza Duel). La primera vez copia las estrellas y los ajustes de
   pichu.pizzeria.v2 (Pizza Rush) sin borrarla: cada turno pasa al rival del mismo número. */
const CLAVE = "pichu.pizzeria.v3";
const leerClave = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
let D = leerClave(CLAVE);
if (!D || typeof D !== "object") {
  const v2 = leerClave("pichu.pizzeria.v2");
  D = { estrellas: M.estrellasDesdeV2(v2), tutorial: !!(v2 && v2.tutorial), ajustes: (v2 && v2.ajustes) || {}, desdeV2: !!v2 };
}
D = Object.assign({ estrellas: {}, tutorial: false, ajustes: {}, mejorVida: {} }, D);
D.ajustes = Object.assign({ tranquilo: false, sonido: true, musica: true, movimiento: true }, D.ajustes);
const AJ = D.ajustes;
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(D)); } catch (e) {} };
guardar();
const alias = (() => { try { const p = JSON.parse(localStorage.getItem("pichu.perfil.v1")); return p && p.alias; } catch (e) { return null; } })();
const aplicarMov = () => document.body.classList.toggle("sin-mov", !AJ.movimiento);

/* ================= Sonido y música (todo generado aquí) ================= */
let ac = null;
const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; };
function tono(f, dur = .12, tipo = "sine", vol = .1, t0 = 0, destino) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g); g.connect(destino || a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  coger: () => AJ.sonido && tono(700, .05, "triangle", .08),
  soltar: () => AJ.sonido && tono(420, .05, "triangle", .08),
  golpe: () => AJ.sonido && (tono(110, .15, "square", .12), tono(660, .08, "square", .05, .03), tono(880, .12, "square", .05, .08)),
  critico: () => AJ.sonido && [523, 784, 1046, 1568].forEach((f, i) => tono(f, .16, "square", .06, i * .06)),
  mal: () => AJ.sonido && (tono(196, .22, "sawtooth", .06), tono(147, .3, "sawtooth", .06, .12)),
  ataque: () => AJ.sonido && (tono(90, .3, "sawtooth", .12), tono(60, .4, "square", .1, .1)),
  ding: () => AJ.sonido && (tono(1568, .25, "sine", .06), tono(2093, .3, "sine", .04, .08)),
  super: () => AJ.sonido && [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tono(f, .12, "triangle", .07, i * .05)),
  victoria: () => AJ.sonido && [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tono(f, .2, "square", .06, i * .13)),
  derrota: () => AJ.sonido && [392, 349, 311, 262].forEach((f, i) => tono(f, .3, "triangle", .08, i * .2))
};
// Música de duelo: bucle original en menor (bajo + arpegio), algo más rápido que la de Pizza Rush
const Musica = (() => {
  let timer = null, paso = 0, gan = null;
  const BAJO = [110, 110, 87, 87, 98, 98, 82, 82], ARP = [[220, 262, 330], [220, 262, 330], [175, 220, 262], [175, 220, 262], [196, 247, 294], [196, 247, 294], [165, 208, 247], [165, 208, 247]];
  function tic() {
    const a = audio(); if (!a) return;
    const compas = Math.floor(paso / 8) % 8, t = paso % 8;
    if (t % 2 === 0) tono(BAJO[compas], .2, "triangle", .1, 0, gan);
    tono(ARP[compas][t % 3] * 2, .09, "square", .02, 0, gan);
    if (t === 0 || t === 4) tono(65, .09, "sine", .14, 0, gan);
    if (t === 2 || t === 6) tono(2400, .03, "square", .012, 0, gan);
    paso++;
  }
  return {
    on() { if (timer || !AJ.musica) return; const a = audio(); if (!a) return; gan = a.createGain(); gan.gain.value = .8; gan.connect(a.destination); timer = setInterval(tic, 115); },
    off() { clearInterval(timer); timer = null; if (gan) { try { gan.disconnect(); } catch (e) {} gan = null; } }
  };
})();

/* ================= Dibujo de pizzas ================= */
const R = 66, C = 75;
const punto = (ang, r) => { const a = (ang - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
function sector(a0, a1, r = R) {
  if (a1 - a0 >= 359.99) return `M ${C} ${C - r} A ${r} ${r} 0 1 1 ${C - .01} ${C - r} Z`;
  const [x0, y0] = punto(a0, r), [x1, y1] = punto(a1, r);
  return `M ${C} ${C} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function rodaja(a0, a1, d, semilla, etiqueta) {
  let s = `<path class="borde" d="${sector(a0, a1)}" fill="var(--masa)" stroke="var(--espresso)" stroke-width="2.5"/>`;
  s += `<path d="${sector(a0 + .8, a1 - .8, R - 7)}" fill="var(--queso)"/>`;
  const n = d <= 4 ? 2 : 1;
  for (let k = 0; k < n; k++) {
    const t = (k + 1) / (n + 1), r = R * (d <= 4 ? (k % 2 ? .62 : .4) : .64);
    const [x, y] = punto(a0 + (a1 - a0) * t + ((semilla * 7 + k * 13) % 7 - 3), r);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d <= 6 ? 6.5 : 4.5}" fill="var(--peperoni)"/>`;
    if (d <= 6) s += `<circle cx="${(x - 1.5).toFixed(1)}" cy="${(y - 1.5).toFixed(1)}" r="1.6" fill="#D96B55"/>`;
  }
  const [lx, ly] = punto((a0 + a1) / 2, R * (d >= 8 ? .8 : .52));
  const fs = d >= 12 ? 10 : d >= 8 ? 11.5 : 15;
  s += `<text x="${lx.toFixed(1)}" y="${(ly + fs / 3).toFixed(1)}" font-size="${fs}" font-weight="900" text-anchor="middle" fill="var(--espresso)" paint-order="stroke" stroke="#FFF7E3" stroke-width="3.5">${etiqueta || "1/" + d}</text>`;
  return s;
}
function pizzaSVG(p) {
  const paso = 360 / p.d;
  let s = `<svg viewBox="0 0 150 150" role="group" aria-label="Pizza cortada en ${M.NOMBRE_CORTE[p.d]}"><circle cx="${C}" cy="${C}" r="${R + 5}" fill="#3a2b26" opacity=".35"/>`;
  p.por.forEach((st, i) => {
    const a0 = i * paso, a1 = (i + 1) * paso;
    s += st === "m"
      ? `<g class="porcion" role="button" tabindex="0" data-p="${p.id}" data-i="${i}" aria-label="Porción de 1/${p.d}. Ponerla en el plato">${rodaja(a0, a1, p.d, p.id + i)}</g>`
      : `<g class="agujero"><path d="${sector(a0, a1)}"/></g>`;
  });
  return s + "</svg>";
}
function platoSVG(caja) {
  const total = caja.reduce((a, x) => a + U / x.d, 0), n = Math.max(1, Math.ceil(total / U));
  let out = "";
  for (let k = 0; k < n; k++) {
    let s = `<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="${C}" cy="${C}" r="${R + 7}" fill="#fff" stroke="var(--espresso)" stroke-width="3"/>`, acum = 0;
    caja.forEach((x, j) => {
      const v = U / x.d, ini = acum, fin = acum + v, desde = Math.max(ini, k * U), hasta = Math.min(fin, (k + 1) * U);
      if (hasta > desde) s += rodaja((desde - k * U) * 15, (hasta - k * U) * 15, x.d, j);
      acum = fin;
    });
    out += s + "</svg>";
  }
  return out;
}
function cantidadSVG(base) {
  const total = M.aU(base.n, base.d), tam = U / base.d, n = Math.ceil(total / U);
  let out = "";
  for (let k = 0; k < n; k++) {
    let s = `<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="${C}" cy="${C}" r="${R + 5}" fill="#EFE4C8"/>`;
    for (let t = k * U; t < (k + 1) * U; t += tam) {
      const a0 = (t - k * U) * 15, a1 = Math.min(t + tam - k * U, U) * 15;
      s += t < total ? rodaja(a0, a1, base.d, t, base.d === 1 ? "1" : null) : `<g class="agujero"><path d="${sector(a0, a1)}" style="fill:rgba(0,0,0,.06);stroke:#B9A98A"/></g>`;
    }
    out += s + "</svg>";
  }
  return out;
}

/* ================= Estado del duelo ================= */
let G = null, raf = null, ultimo = 0, sig = 1;
const tiposEtq = { suma: ["Comanda", ""], mult_entero: ["Grupo ×", "mult"], fraccion_de: ["Parte de ×", "mult"], div_entero: ["Reparto ÷", "div"], div_cuantas: ["¿Cuántas? ÷", "div"], condicion: ["👑 Condición", "jefe"] };
// En los primeros duelos el plato muestra la pizza que llevas; después hay que calcularlo
const verPlato = () => G.rival.id <= 2;

function empezarDuelo(id) {
  const rival = M.RIVALES.find(r => r.id === id);
  if (!rival || !LISTOS.has(id)) return;
  cerrarCapa(true);
  G = { rival, vida: rival.vida, corazones: M.CORAZONES, t: null, pizzas: [], horno: 0, carga: 0, superActivo: false, congelado: 0,
        servidos: 0, perfectos: 0, racha: 0, mejorRacha: 0, pausa: true, fin: false, ocupado: false, tutorial: id === 1 && !D.tutorial, fase: M.faseDe(rival, rival.vida) };
  $("#mapa").classList.add("oculto"); $("#duelo").classList.remove("oculto"); $("#aviso").classList.add("oculto");
  $("#imgRival").src = IMG[rival.img]; $("#imgRival").alt = rival.nombre; $("#nombreRival").textContent = rival.nombre;
  $("#hDuelo").textContent = `Duelo ${rival.id}/8`;
  $("#bocadillo").classList.add("oculto");
  for (let i = 0; i < HUECOS - 1; i++) hornear(true);
  nuevaComanda(); renderTodo(); window.scrollTo(0, 0);
  ultimo = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(bucle);
  presentacion();
}

function presentacion() {
  const r = G.rival;
  capa(`<div class="cara-a-cara"><img src="${IMG.pichu}" alt="πCHU"><span class="vs" aria-hidden="true">VS</span><img src="${IMG[r.img]}" alt="${esc(r.nombre)}"></div>
    <h2 id="capaTitulo">Duelo ${r.id}${r.jefe ? " · Jefe" : ""}: ${esc(r.nombre)}</h2>
    <p class="cita">«${esc(r.frases.entrada)}»</p>
    <p><b>Contenido:</b> ${esc(r.tema)}<br><b>Su regla:</b> ${esc(r.regla)}</p>
    <p class="datos-duelo"><span>Vida del rival: <b>${r.vida}</b></span><span>Tus corazones: <b style="color:var(--coral-oscuro)">${"♥".repeat(M.CORAZONES)}</b></span></p>
    ${G.tutorial ? `<ol style="text-align:left;background:#EEF5F1;border-radius:12px;padding:.6rem .8rem .6rem 2rem;margin:.6rem 0">
      <li>Lee la <b>comanda</b> del rival.</li><li>Toca porciones de las pizzas del mostrador para ponerlas en el <b>plato</b>.</li>
      <li>Pulsa <b>Servir</b>: si es exacto, ¡golpeas al rival! Con el menor número de porciones, ¡golpe crítico!</li></ol>` : ""}
    <div class="botones"><button class="btn" type="button" id="iEmpezar" style="font-size:1.2rem">⚔ ¡A cocinar!</button><button class="btn claro" type="button" id="iVolver">Volver al mapa</button></div>`);
  $("#iEmpezar").onclick = () => {
    cerrarCapa(true); window.scrollTo(0, 0); G.pausa = false; ultimo = performance.now(); Musica.on(); bocadillo(r.frases.entrada);
    const p = document.querySelector(".porcion"); if (p) p.focus({ preventScroll: true });
  };
  $("#iVolver").onclick = () => mapa();
  $("#iEmpezar").focus();
}

function nuevaComanda() {
  let ped;
  if (G.tutorial && !G.t) ped = { tipo: "suma", objetivo: 18, escrito: "3/4", texto: "Quiero 3/4 de pizza, por favor.", minimo: 2 };
  else ped = M.generarComanda(G.rival, G.vida);
  const factor = ({ div_cuantas: .8, condicion: 1.1, mult_entero: 1.1, fraccion_de: 1.1, div_entero: 1.1, suma: 1 })[ped.tipo] * (ped.objetivo > U ? 1.15 : 1);
  const max = G.rival.tiempo * factor;
  G.t = { id: sig++, ped, caja: [], max, resto: max, intentos: 0, sinPrisa: G.tutorial && G.servidos === 0, nueva: true };
  anunciar(`Comanda de ${G.rival.nombre}: ${ped.texto}`);
}

function hornear(inicial) {
  if (G.pizzas.length >= HUECOS) return false;
  const ped = G.t ? G.t.ped : null;
  const d = M.elegirHorneado(ped ? [ped, ped] : [], G.rival.cfg.dens);
  G.pizzas.push({ id: sig++, d, por: Array(d).fill("m"), nueva: !inicial });
  if (!inicial) sfx.ding();
  return true;
}

/* ================= Bucle ================= */
function bucle(ahora) {
  const dt = Math.min(.1, (ahora - ultimo) / 1000); ultimo = ahora;
  if (G && !G.pausa && !G.fin) paso(dt);
  raf = requestAnimationFrame(bucle);
}
function paso(dt) {
  const lleno = G.pizzas.length >= HUECOS;
  G.horno = lleno ? Math.min(1, G.horno + dt / INTERVALO_HORNO) : G.horno + dt / INTERVALO_HORNO;
  if (!lleno && G.horno >= 1) { G.horno = 0; hornear(false); renderMostrador(); }
  $("#barraHorno").style.width = (G.horno * 100) + "%";
  $("#rotuloHorno").textContent = lleno ? "¡LLENO!" : "HORNO";
  if (G.congelado > 0) G.congelado = Math.max(0, G.congelado - dt);
  else if (!AJ.tranquilo && G.t && !G.t.sinPrisa && !G.ocupado) {
    G.t.resto -= dt;
    if (G.t.resto <= 0) { G.t.resto = 0; ataque("¡Se te ha acabado el tiempo!"); }
  }
  actualizarReloj();
}

/* ================= Pintar ================= */
function renderTodo() { renderArena(); renderComanda(); renderMostrador(); }
function renderArena() {
  $("#imgYo").src = IMG.pichu;
  const cz = $("#corazones");
  cz.innerHTML = `${"♥".repeat(G.corazones)}<span class="vacio">${"♡".repeat(M.CORAZONES - G.corazones)}</span>`;
  cz.setAttribute("aria-label", `${G.corazones} de ${M.CORAZONES} corazones`); cz.setAttribute("role", "img");
  const v = $("#vida"), f = G.vida / G.rival.vida;
  v.firstElementChild.style.width = (f * 100) + "%"; v.classList.toggle("baja", f <= .34);
  v.lastElementChild.textContent = `${G.vida}/${G.rival.vida}`;
  v.setAttribute("aria-valuenow", G.vida); v.setAttribute("aria-valuemax", G.rival.vida); v.setAttribute("aria-label", `Vida de ${G.rival.nombre}: ${G.vida} de ${G.rival.vida}`);
  $("#carga").innerHTML = `${[0, 1, 2].map(i => `<i class="${i < G.carga ? "on" : ""}"></i>`).join("")}<small>⚡ ${G.superActivo ? "¡activo!" : G.carga + "/3"}</small>`;
  $("#carga").setAttribute("aria-label", `Superpoder: ${G.carga} de 3`);
  $("#btnMusica").setAttribute("aria-pressed", String(AJ.musica)); $("#btnMusica").style.opacity = AJ.musica ? 1 : .5;
  actualizarReloj();
}
function actualizarReloj() {
  if (!G || !G.t) return;
  const t = G.t, r = $("#reloj"), sinReloj = AJ.tranquilo || t.sinPrisa, f = Math.max(0, t.resto / t.max);
  r.classList.toggle("hielo", G.congelado > 0); r.classList.toggle("baja", !sinReloj && !G.congelado && f < .25);
  r.textContent = G.congelado > 0 ? `❄ ${Math.ceil(G.congelado)} s` : sinReloj ? "∞" : `⏱ ${Math.ceil(t.resto)} s`;
  r.setAttribute("aria-label", sinReloj ? "Sin límite de tiempo" : `Quedan ${Math.ceil(t.resto)} segundos`);
  const b = document.querySelector("#barraTiempo"); if (!b) return;
  b.classList.toggle("oculto", sinReloj);
  b.firstElementChild.style.width = (f * 100) + "%";
  b.classList.toggle("media", f < .5 && f >= .25); b.classList.toggle("baja", f < .25); b.classList.toggle("hielo", G.congelado > 0);
}
function textoRegla(p) {
  const c = p.cond, r = G.rival;
  let h = "";
  if (c && c.modo === "iguales") h += `<p class="regla">📐 Solo porciones IGUALES (todas del mismo tamaño).</p>`;
  if (c && c.modo === "exactas") h += `<p class="regla">👑 Exactamente ${c.k} porciones.</p>`;
  if (c && c.modo === "sin") h += `<p class="regla">🚫 Prohibidas las porciones de ${fx("1/" + (U / c.tam))}.</p>`;
  if (c && c.modo === "minimo") h += `<p class="regla">👑 Con el menor número de porciones posible.</p>`;
  if (r.reglas.includes("escudo")) h += `<p class="regla">🛡 Escudo: si no usas el mínimo de porciones, solo le haces medio golpe.</p>`;
  return h;
}
function renderComanda() {
  const t = G.t, p = t.ped, [etq, cls] = tiposEtq[p.tipo];
  const sup = G.superActivo ? `<button class="btn super activo" type="button" disabled>⚡ ×2</button>`
    : `<button class="btn super" type="button" data-super ${G.carga >= 3 && !G.ocupado ? "" : "disabled"} aria-describedby="supInfo">⚡ Súper</button><span class="solo-lector" id="supInfo">Superpoder: se carga con 3 golpes, tecla S. Congela el reloj y tu próximo golpe hace doble daño.</span>`;
  let cuerpo;
  if (p.tipo === "div_cuantas") {

function golpe(perfecto, pasos) {
  const t = G.t, r = G.rival; G.ocupado = true;

  quitarPizzasVacias();
  const rapido = !AJ.tranquilo && !t.sinPrisa && t.resto / t.max > .5;
  const d = M.danio({ perfecto, rapido, superpoder: G.superActivo, rival: r });
  const doble = G.superActivo;
  G.vida = Math.max(0, G.vida - d.valor); G.servidos++; if (perfecto) G.perfectos++;
  G.racha++; G.mejorRacha = Math.max(G.mejorRacha, G.racha);
  const cargaAntes = G.carga; G.carga = Math.min(3, G.carga + 1); G.superActivo = false;

    else { sfx.golpe(); if (doble) grito("¡GOLPE DOBLE!"); else if (d.bloqueado) grito("🛡 ¡MEDIO GOLPE!"); }
  }, AJ.movimiento ? 180 : 0);
  bocadillo(azar(r.frases.golpe));

  const op = t.ped.op && t.ped.tipo !== "div_cuantas" ? `<p class="op">${fx(t.ped.op)}</p>` : "";
  const consejo = !perfecto && t.ped.minimo && t.ped.tipo !== "div_cuantas" ? `<p>Con ${t.ped.minimo} ${t.ped.minimo === 1 ? "porción" : "porciones"} habría sido <b>crítico</b>.</p>` : "";
  avisar("bien", `¡Exacto! Golpe de ${d.valor}${extra ? " (" + extra + ")" : ""}`, `<p class="op">${fx(pasos)}</p>${op}${consejo}`, 3800);
  anunciar(`¡Exacto! Le quitas ${d.valor} de vida a ${r.nombre}. Le quedan ${G.vida}.`);
  if (G.carga === 3 && cargaAntes < 3) setTimeout(() => { if (!G || G.fin || G.carga < 3 || G.superActivo) return; sfx.super(); grito("⚡ ¡SUPERPODER LISTO!"); anunciar("Superpoder listo. Pulsa S para usarlo."); }, AJ.movimiento ? 900 : 0);
  renderTodo();

}

function fallo(res) {

// Forma de servir con el menor número de porciones (respetando la condición de la comanda)
function solucionEjemplo(p) {
  if (p.tipo === "div_cuantas") return "";
  const c = p.cond || {};
  if (c.modo === "iguales") { const [n, d] = c.formas[0].split("/"); return Array(+n).fill("1/" + d).join(" + "); }
  const prohib = c.modo === "sin" ? c.tam : null, exactas = c.modo === "exactas" ? c.k : null;
  const usar = M.stockVirtual(G.rival.cfg.dens).filter(x => x !== prohib).sort((a, b) => b - a);
  let mejor = null;
  const rec = (k, suma, sel) => {
    if (suma === p.objetivo && (!exactas || sel.length === exactas)) { if (!mejor || sel.length < mejor.length) mejor = [...sel]; return; }
    if (suma > p.objetivo || k >= usar.length || sel.length >= 10 || (mejor && !exactas && sel.length >= mejor.length)) return;
    sel.push(usar[k]); rec(k + 1, suma + usar[k], sel); sel.pop();
    let j = k + 1; while (j < usar.length && usar[j] === usar[k]) j++; rec(j, suma, sel);
  };
  rec(0, 0, []);
  return mejor ? mejor.map(x => "1/" + (U / x)).join(" + ") : "";
}

  capa(`<h2 id="capaTitulo">Ajustes</h2>
    <label><input type="checkbox" id="oTranq" ${AJ.tranquilo ? "checked" : ""}> <span><b>Modo tranquilo</b>: sin reloj. El rival solo ataca si fallas dos veces. Ideal para aprender o para ir a tu ritmo.</span></label>
    <label><input type="checkbox" id="oMusica" ${AJ.musica ? "checked" : ""}> <span><b>Música</b></span></label>
    <label><input type="checkbox" id="oSonido" ${AJ.sonido ? "checked" : ""}> <span><b>Efectos de sonido</b></span></label>
    <label><input type="checkbox" id="oMov" ${AJ.movimiento ? "checked" : ""}> <span><b>Animaciones y efectos</b> (desactívalos si prefieres menos movimiento)</span></label>
    <div class="botones"><button class="btn verde" type="button" id="oOk">Guardar</button></div>`);
  $("#oOk").onclick = () => { AJ.tranquilo = $("#oTranq").checked; AJ.musica = $("#oMusica").checked; AJ.sonido = $("#oSonido").checked; AJ.movimiento = $("#oMov").checked; guardar(); aplicarMov(); cerrarCapa(); };
  $("#oOk").focus();
}

/* ================= Eventos ================= */
document.addEventListener("click", e => {
  const t = e.target;
  const por = t.closest(".porcion"); if (por) return meterPorcion(+por.dataset.p, +por.dataset.i);
  const q = t.closest("[data-quitar]"); if (q) { if (G && !G.ocupado) { devolver(+q.dataset.quitar); sfx.soltar(); renderComanda(); renderMostrador(); } return; }
  if (t.closest("[data-vaciar]")) { if (G && !G.ocupado) { vaciar(); renderComanda(); renderMostrador(); } return; }
  if (t.closest("[data-servir]")) return servir();
  if (t.closest("[data-super]")) return superpoder();
  const r = t.closest("[data-resp]"); if (r) return responder(+r.dataset.resp);
  const ti = t.closest("[data-tirar]"); if (ti) return tirar(+ti.dataset.tirar);
  const rv = t.closest("[data-rival]"); if (rv && !rv.disabled) return empezarDuelo(+rv.dataset.rival);
  const ab = t.closest("[data-abre]"); if (ab) return ab.dataset.abre === "ayuda" ? ayuda() : ajustes();
  if (t.closest("#aviso")) $("#aviso").classList.add("oculto");
});
document.addEventListener("keydown", e => {
  const por = e.target.closest && e.target.closest(".porcion");
  if (por && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return meterPorcion(+por.dataset.p, +por.dataset.i); }
  if (!$("#capa").classList.contains("oculto")) { if (e.key === "Escape" && G && G.pausa && !G.fin && G.t && $("#pSeguir")) reanudar(); return; }
  if ($("#duelo").classList.contains("oculto") || !G || G.fin) return;
  const k = e.key.toLowerCase();
  if (k === "e") servir();
  else if (k === "v") { if (!G.ocupado) { vaciar(); renderComanda(); renderMostrador(); } }
  else if (k === "s") superpoder();
  else if (k === "p" || e.key === "Escape") pausar();
});
$("#btnPausa").onclick = pausar;
$("#btnMusica").onclick = () => { AJ.musica = !AJ.musica; guardar(); if (AJ.musica && G && !G.pausa && !G.fin) Musica.on(); else Musica.off(); renderArena(); };
$("#btnJugar").onclick = () => empezarDuelo(siguienteRival());
document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.fin && !G.pausa) pausar(); });

$("#logoPichu").src = IMG.pichu;
aplicarMov();
mapa();
if (alias) $("#lema").insertAdjacentHTML("beforeend", `<br>¡Suerte, <b>${esc(alias)}</b>!`);

// Ganchos para las pruebas automáticas
window.__pizzeria = { M, get G() { return G; }, D, AJ, LISTOS, empezarDuelo, servir, responder, meterPorcion, superpoder, ataque, tirar, mapa, pausar, reanudar, renderTodo, solucionEjemplo, finDuelo };
})();
</script>
