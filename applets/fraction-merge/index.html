<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraction Merge · Fracciones · πCHU</title>
<meta name="description" content="Videojuego de fusionar fracciones para 1.º de ESO. Sin registro ni datos personales.">
<meta name="theme-color" content="#332B2A">
<link rel="icon" href="../../compartido/img/icono-192.png">
<style>
@font-face{font-family:"Lato";font-weight:400;font-display:swap;src:url("../../compartido/fuentes/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-display:swap;src:url("../../compartido/fuentes/lato-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-display:swap;src:url("../../compartido/fuentes/lato-latin-900-normal.woff2") format("woff2")}
/* Paleta πCHU: espresso, salvia, coral y crema (más variantes oscuras para que el texto se lea bien) */
:root{--espresso:#332B2A;--salvia:#5A8A78;--coral:#E46D4D;--crema:#F4EDD7;--coral-oscuro:#A8402A;--salvia-oscuro:#3F6E5C;--papel:#FFFCF3;--linea:#D9CFB4;--salvia-claro:#DCE8E1;
  --hueco:#463B39}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--espresso);background:var(--crema);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral-oscuro);outline-offset:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.pantalla{position:fixed;inset:0;display:none;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.pantalla.activa{display:flex}
body.jugando #pichu-volver{display:none}
/* Fracción apilada */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .08em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .14em .05em}
.fr>span:last-child{padding:.07em .14em 0}

/* ---------- Botones ---------- */
.btn{min-height:48px;padding:.55em 1.2em;border-radius:999px;border:0;font-weight:900;background:var(--salvia-oscuro);color:#fff;box-shadow:0 4px 0 #27463b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #27463b}
.btn.oro{background:var(--coral);color:var(--espresso);box-shadow:0 4px 0 var(--coral-oscuro)}
.btn.oro:active{box-shadow:0 1px 0 var(--coral-oscuro)}
.btn.gris{background:var(--papel);color:var(--espresso);box-shadow:0 4px 0 var(--linea);border:2px solid var(--espresso)}
.btn.gris:active{box-shadow:0 1px 0 var(--linea)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.grande{font-size:1.5rem;min-height:68px;padding:.5em 2em}
.redondo{width:48px;height:48px;border-radius:50%;border:2px solid var(--espresso);background:var(--papel);font-size:1.2rem;font-weight:900;display:grid;place-items:center;flex:none}

/* ---------- Menú ---------- */
#pMenu{flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;text-align:center}
.logo{font-weight:900;font-size:clamp(2.4rem,12vw,4.6rem);line-height:.92;margin:0;color:var(--espresso)}
.logo b{color:var(--coral)}
.logo small{display:block;font-size:.26em;letter-spacing:.2em;color:var(--salvia-oscuro);margin-top:.6em}
.mascota{width:min(38vw,170px);height:auto;animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px) rotate(-2deg)}}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cartera{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.35em .9em;border-radius:999px;background:var(--papel);border:2px solid var(--linea)}
.pie{font-size:.88rem;margin:0}
.pie a{color:var(--salvia-oscuro);font-weight:700}

/* ---------- Niveles ---------- */
#pMapa{flex-direction:column;gap:8px}
.barra{display:flex;align-items:center;gap:10px}
.barra h2{margin:0;font-size:1.3rem;font-weight:900;flex:1}
#listaNiveles{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 80px;display:grid;gap:10px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.esc{grid-column:1/-1;margin:.6em 0 0;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-oscuro);font-weight:900}
.nivel{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:18px;border:2px solid var(--linea);background:var(--papel);min-height:76px;
  box-shadow:0 3px 0 var(--linea)}
.nivel .n{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;font-weight:900;background:var(--salvia-oscuro);color:#fff}
.nivel.jefe .n{background:var(--coral-oscuro)}
.nivel.inf .n{background:var(--espresso);color:var(--crema)}
.nivel b{display:block;font-size:1.05rem}
.nivel span{font-size:.85rem}
.nivel .est{margin-left:auto;font-size:1.1rem;white-space:nowrap;color:var(--coral-oscuro)}
.nivel[disabled]{opacity:.5}
.misiones{grid-column:1/-1;border-radius:18px;background:var(--salvia-claro);padding:10px 12px}
.misiones h3{margin:0 0 6px;font-size:1rem}
.mision{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.9rem;margin:6px 0}
.prog{grid-column:1/-1;height:8px;border-radius:9px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--salvia-oscuro);border-radius:9px}

/* ---------- Partida ---------- */
#pJuego{display:none;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:6px;touch-action:none}
#pJuego.activa{display:grid}
#hud{display:flex;align-items:center;gap:8px}
#hud .tit{flex:1;min-width:0}
#hud .tit b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
#hud .tit span{font-size:.8rem}
.dato{flex:none;min-width:58px;text-align:center;padding:3px 8px;border-radius:12px;background:var(--papel);border:2px solid var(--linea)}
.dato b{display:block;font-size:1.25rem;line-height:1.1}
.dato span{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
.dato.poco b{color:var(--coral-oscuro)}
#pedidos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pedido{position:relative;min-height:74px;padding:4px 4px 6px;border-radius:14px;border:2px solid var(--coral);background:var(--papel);color:var(--espresso);font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--coral-oscuro)}
.pedido .etq{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-oscuro);font-weight:700}
.pedido .txt{font-size:clamp(1rem,4.8vw,1.45rem);line-height:1.1;white-space:nowrap;display:flex;align-items:center}
.pedido.largo .txt{font-size:clamp(.82rem,3.7vw,1.15rem)}
.pedido svg{width:44px;height:44px;display:block}
.pedido.vacio{background:transparent;border:2px dashed var(--linea);box-shadow:none;color:var(--salvia-oscuro);font-size:1.4rem}
.pedido.entra{animation:entra .35s cubic-bezier(.2,1.5,.5,1)}
.pedido .bombilla{position:absolute;right:4px;top:2px;font-size:.75rem}
@keyframes entra{from{transform:scale(.3);opacity:0}}
#medio{display:flex;align-items:center;gap:8px;min-height:48px}
#progreso{flex:none;display:flex;gap:3px;flex-wrap:wrap;max-width:36%}
#progreso i{width:11px;height:11px;border-radius:50%;background:var(--papel);border:2px solid var(--linea)}
#progreso i.ok{background:var(--salvia-oscuro);border-color:var(--salvia-oscuro)}
#cinta{flex:1;text-align:center;font-weight:900;font-size:clamp(.88rem,3.9vw,1.1rem);line-height:1.25;color:var(--coral-oscuro);min-height:1.2em}
#cinta.info{color:var(--espresso);font-weight:700;font-size:clamp(.8rem,3.5vw,1rem)}
#cinta em{font-style:normal;color:var(--salvia-oscuro)}
#jefe{display:none;align-items:center;gap:8px;flex:none}
#jefe svg{width:46px;height:46px}
#jefe.golpe svg{animation:golpe .4s}
#jefe img{width:50px;height:50px;border-radius:50%;border:2px solid var(--espresso);background:var(--papel);object-fit:contain;display:block}
#jefe.golpe img{animation:golpe .4s}
@keyframes golpe{25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}
#jefe .vida{width:70px;height:10px;border-radius:9px;background:var(--papel);overflow:hidden;border:1px solid var(--espresso)}
#jefe .vida i{display:block;height:100%;background:var(--coral-oscuro);transition:width .3s}
#jefe small{display:block;font-size:.68rem;font-weight:700}
#zona{position:relative;display:grid;place-items:center;min-height:0;min-width:0}
#tablero{position:relative;border-radius:5%;background:var(--espresso);box-shadow:0 8px 0 rgba(51,43,42,.25)}
#tablero.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#tablero.temblor{animation:temblor .45s}
@keyframes temblor{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.hueco{position:absolute;border-radius:18%;background:var(--hueco)}
.ficha{position:absolute;left:0;top:0;border:0;padding:0;border-radius:20%;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;
  transition:transform .12s ease-out;will-change:transform;color:#fff;background:var(--c);box-shadow:inset 0 -.2em 0 rgba(0,0,0,.25),inset 0 .08em 0 rgba(255,255,255,.3)}
.ficha .in{display:flex;flex-direction:column;align-items:center;gap:.12em}
.ficha small{font-size:.42em;font-weight:700;display:flex;align-items:center}
.ficha .tarta{position:absolute;right:7%;top:7%;width:26%;height:26%;border-radius:50%;border:.05em solid currentColor}
/* Un color por denominador (el número también se ve: nunca solo color) */
.d2{--c:#3F6E5C}.d3{--c:#A8402A}.d4{--c:#2F6F8F}.d5{--c:#8A5A12}.d6{--c:#6B4E9B}.d8{--c:#B03A6B}.d10{--c:#5A6B1E}.d12{--c:#4A4A8A}.d1{--c:#332B2A}
.ficha.sinsimp{background:var(--crema);color:var(--espresso);box-shadow:inset 0 -.2em 0 var(--linea),inset 0 0 0 .07em var(--coral)}
.ficha.roca{background:linear-gradient(160deg,#a8a29e,#6b6360);border-radius:28% 22% 30% 20%;box-shadow:inset 0 -.25em 0 rgba(0,0,0,.35),inset .1em .12em 0 rgba(255,255,255,.25)}
.ficha.roca.dura{background:linear-gradient(160deg,#8a8380,#45403e)}
.ficha.roca::after{content:"";position:absolute;inset:22%;border-radius:40%;border:3px dashed rgba(0,0,0,.25)}
.ficha.hielo::after{content:"❄";position:absolute;inset:0;border-radius:inherit;background:rgba(186,230,253,.6);border:3px solid #e0f2fe;display:flex;align-items:flex-end;justify-content:flex-start;
  font-size:.5em;padding:.15em;color:#0c4a6e}
.ficha.nace .in,.ficha.nace.roca{animation:nace .22s ease-out}
@keyframes nace{from{transform:scale(0)}}
.ficha.pop .in{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}}
.ficha.mal .in{animation:no .3s}
.vuela{position:fixed;z-index:55;transition:transform .38s cubic-bezier(.5,-.3,.6,1),opacity .38s;pointer-events:none}
.unidad{position:fixed;z-index:56;pointer-events:none;font-weight:900;color:var(--crema);background:var(--coral-oscuro);border-radius:50%;display:grid;place-items:center;animation:unidad .7s ease-out forwards}
@keyframes unidad{0%{transform:scale(.5);opacity:1}50%{transform:scale(1.25);opacity:1}100%{transform:scale(1.6);opacity:0}}
.skin-pizarra .ficha:not(.roca):not(.sinsimp){background:#2b3a36;box-shadow:inset 0 0 0 .1em var(--c),inset 0 -.2em 0 var(--c)}
.skin-pastel .ficha:not(.roca):not(.sinsimp){background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--c) 30%,#fff));color:var(--espresso);box-shadow:inset 0 -.25em 0 var(--c);border-radius:36%}
.skin-papel .ficha:not(.roca):not(.sinsimp){background:var(--papel);color:var(--c);box-shadow:inset 0 0 0 .12em var(--c);border-radius:10%}

#poderes{display:flex;gap:8px;justify-content:center;align-items:stretch;min-height:62px}
.poder{position:relative;flex:1;max-width:110px;min-height:58px;border-radius:16px;border:2px solid var(--espresso);background:var(--papel);font-weight:900;font-size:1.5rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.poder small{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.poder .c{position:absolute;right:-5px;top:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--coral);color:var(--espresso);font-size:.85rem;display:grid;place-items:center;padding:0 5px}
.poder[aria-pressed="true"]{background:var(--salvia-claro);box-shadow:0 0 0 3px var(--coral-oscuro)}
.poder[disabled]{opacity:.45}
.poder.candado{font-size:1.1rem;border-style:dashed}
#ultimo{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;display:none;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:999px;
  background:var(--coral-oscuro);color:#fff;font-weight:900;font-size:.9rem;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:98%}
#ultimo.ver{display:flex}
#ultimo button{min-height:40px;border-radius:999px;border:0;background:#fff;color:var(--coral-oscuro);font-weight:900;padding:0 14px}
#guia{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;min-height:62px;padding:8px 14px;border-radius:16px;background:var(--espresso);color:var(--crema);
  font-weight:700;font-size:1rem;line-height:1.25;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;pointer-events:none}
#guia.ver{display:flex}
@media (orientation:landscape) and (max-height:560px), (min-aspect-ratio:13/10){
  #pJuego.activa{grid-template-columns:minmax(260px,40%) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:12px}
  #hud{grid-column:1;grid-row:1}#pedidos{grid-column:1;grid-row:2}#medio{grid-column:1;grid-row:3;flex-direction:column;justify-content:center}
  #poderes{grid-column:1;grid-row:4}#zona{grid-column:2;grid-row:1/5}#guia{right:auto;width:calc(40% - 12px);min-width:250px}
  #progreso{max-width:none;justify-content:center}
}

/* ---------- Ventanas ---------- */
#capa{position:fixed;inset:0;z-index:70;background:rgba(51,43,42,.6);display:none;align-items:center;justify-content:center;padding:14px}
#capa.ver{display:flex}
.ventana{width:min(480px,100%);max-height:100%;overflow:auto;border-radius:24px;padding:18px;background:var(--papel);border:3px solid var(--espresso);box-shadow:0 20px 60px rgba(0,0,0,.4);
  text-align:center;animation:entra .3s cubic-bezier(.2,1.4,.5,1)}
.ventana h2{margin:.1em 0 .3em;font-size:1.7rem;font-weight:900}
.ventana p{margin:.4em 0;line-height:1.4}
.ventana .izq{text-align:left}
.ventana .mascota2{width:110px;height:auto;margin:0 auto;display:block}
.ventana .mascota2.triste{filter:grayscale(.7);transform:rotate(-6deg)}
.estrellas{font-size:2.6rem;letter-spacing:.1em;color:var(--linea)}
.estrellas b{color:var(--coral);display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards;text-shadow:0 3px 0 var(--coral-oscuro)}
.premios{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-weight:900}
.nota{font-size:.9rem}
.caja{background:var(--salvia-claro);border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left;line-height:1.5}
.caja.mate{background:var(--crema);border:2px solid var(--coral);font-weight:700;font-size:1.05rem;line-height:2}
.lista{display:grid;gap:8px;text-align:left;margin:10px 0}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--crema)}
.item .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--papel);font-weight:900;border:1px solid var(--linea)}
.item div{flex:1;min-width:0}.item b{display:block}.item span{font-size:.85rem}
.item.apagado{opacity:.5}
.item .btn{min-height:44px;padding:.3em .8em;font-size:.9rem;flex:none}
.interruptor{min-width:64px;min-height:44px;border-radius:999px;border:2px solid var(--espresso);background:var(--papel);font-weight:900;flex:none}
.interruptor[aria-pressed="true"]{background:var(--salvia-oscuro);color:#fff}
#aviso{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:80;padding:10px 16px;border-radius:16px;background:var(--espresso);color:var(--crema);
  font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,1.4,.5,1);max-width:92%;text-align:center}
#aviso.ver{transform:translate(-50%,0)}
.sinmov *,.sinmov *::before,.sinmov *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script src="../../compartido/mathquest.js"></script>
<script src="../../compartido/volver.js" defer></script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="pMenu" class="pantalla activa">
  <h1 class="logo">FRACTION<br><b>MERGE</b><small>SUMA Y FUSIONA FRACCIONES</small></h1>
  <img class="mascota" src="../../compartido/img/mascota.png" alt="" width="600" height="620">
  <div class="cartera" id="cartera"></div>
  <button class="btn oro grande" id="bJugar">▶ JUGAR</button>
  <div class="fila">
    <button class="btn" id="bNiveles">Niveles</button>
    <button class="btn" id="bTienda">Tienda</button>
    <button class="btn" id="bLogros">Logros</button>
  </div>
  <div class="fila">
    <button class="btn gris" id="bComo">Cómo se juega</button>
    <button class="btn gris" id="bAjustes">Ajustes</button>
  </div>
  <p class="pie"><a href="../../index.html">← Volver al mapa de πCHU</a><br>IES Alarifes Ruiz Florindo · Departamento de Matemáticas · 1.º ESO</p>
</main>

<section id="pMapa" class="pantalla" aria-label="Niveles">
  <div class="barra">
    <button class="redondo" id="bMapaAtras" aria-label="Volver al menú">←</button>
    <h2>Niveles</h2>
    <span class="chip" id="chipEst"></span>
  </div>
  <div id="listaNiveles"></div>
</section>

<section id="pJuego" class="pantalla" aria-label="Partida">
  <div id="hud">
    <button class="redondo" id="bPausa" aria-label="Pausa">II</button>
    <div class="tit"><b id="hNombre"></b><span id="hEsc"></span></div>
    <div class="dato" id="dRacha" title="Multiplicador por racha de entregas"><b id="hRacha">×1</b><span>racha</span></div>
    <div class="dato"><b id="hPuntos">0</b><span>puntos</span></div>
    <div class="dato" id="dMovs"><b id="hMovs">0</b><span id="hMovsEtq">movs</span></div>
  </div>
  <div id="pedidos" aria-label="Pedidos"></div>
  <div id="medio">
    <div id="progreso" aria-hidden="true"></div>
    <div id="jefe"><div id="jefeCara"></div><div><div class="vida"><i id="jefeVida"></i></div><small id="jefeTxt"></small></div></div>
    <div id="cinta" role="status" aria-live="polite"></div>
  </div>
  <div id="zona">
    <div id="tablero" aria-label="Tablero"></div>
    <div id="ultimo"><span id="ultimoTxt"></span><button id="bTerminar">Terminar</button></div>
  </div>
  <div id="poderes" aria-label="Poderes"></div>
  <div id="guia" role="status"></div>
</section>

<div id="capa" role="dialog" aria-modal="true"><div class="ventana" id="ventana"></div></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script>/* =========================================================
   FRACTION MERGE · motor.js
   Las MATEMÁTICAS y las reglas del tablero, sin nada de pantalla.

   - Cada ficha es una fracción (1/2, 1/4, 3/8…).
   - Al deslizar, dos fichas que chocan se SUMAN si el resultado no pasa de 1:
         1/2 + 1/4 = 2/4 + 1/4 = 3/4
   - Si la suma da exactamente 1, se completa una UNIDAD y la ficha desaparece.
   - Los pedidos piden una fracción escrita de otra forma (6/8, un dibujo,
     «tres cuartos», 1/2 + 1/4, 1 − 1/4, 0,75…). Se entregan tocando la ficha
     que vale eso.
   Las fracciones se escriben "3/4" en los textos; la pantalla las pinta apiladas.
   Una ficha: { id, tipo:"fr", n, d, m, hielo }  → vale n/d (irreducible) y se ENSEÑA

(function (raiz) {

  function ponerFicha(t, i, n, d, m, hielo) { const f = red(n, d); t.g[i] = { id: t.sig++, tipo: "fr", n: f.n, d: f.d, m: m || 1, hielo: !!hielo }; return t.g[i]; }

  //   movs:     [{ id, de, a, fusion }]

      if (!Ds.length) return null;
      const D = elige(rng, Ds), N = f.n * D / f.d;

        const i = entero(rng, 1, N - 1);

      } else {

        if (y.n <= 0 || y.n > y.d || x.d === y.d || comun % y.d !== 0) continue;

(function (raiz) {

      ${id === 3 && primera ? '<div class="caja">🔓 <b>Partida infinita</b> desbloqueada: juega sin límite de movimientos y bate tu récord.</div>' : ""}`;
    h += `<!--P--><div class="fila" style="margin-top:12px">${sig ? `<button class="btn oro" data-a="jugar" data-niv="${sig.id}" data-foco>Siguiente ▶</button>` : ""}
      <button class="btn gris" data-a="jugar" data-niv="${id}">Repetir</button><button class="btn gris" data-a="mapa" ${sig ? "" : "data-foco"}>Niveles</button></div>`;
    Fx.confeti(); Son.victoria();
  } else {
    S.derrotas[id] = (S.derrotas[id] || 0) + 1; xp = 8; monedas = 2;
    const mas = Math.round(niv.movs * 0.15 * Math.min(3, S.derrotas[id]));
    h = `${foto(true)}<h2>${motivo === "atasco" ? "Tablero bloqueado" : "Sin movimientos"}</h2>
      <p>Has entregado <b>${J.hechos} de ${J.total}</b> pedidos. ¡Estás cerca!</p>
      <div class="caja">💡 <b>Consejo:</b> ${consejo(niv)}</div>
      <p class="nota">En el próximo intento tendrás <b>${mas} movimientos extra</b>.</p>
      <!--P--><div class="fila" style="margin-top:12px"><button class="btn oro" data-a="jugar" data-niv="${id}" data-foco>Reintentar</button><button class="btn gris" data-a="mapa">Niveles</button></div>`;
    Son.derrota();
  }
  const sube = MQ.sumar(xp, monedas);
  const premios = `<div class="premios"><span class="chip">+${xp} XP</span><span class="chip">+${monedas} 🪙</span>${sube.subio ? `<span class="chip" style="border-color:var(--coral)">⭐ ¡Nivel ${sube.nivel}!</span>` : ""}</div>`;
  h = J.inf ? h + premios + `<div class="fila" style="margin-top:12px"><button class="btn oro" data-a="jugar" data-niv="inf" data-foco>Otra vez</button><button class="btn gris" data-a="mapa">Niveles</button></div>`
            : h.replace("<!--P-->", premios);
  revisarMisiones(); guardar();
  setTimeout(() => ventana(h, () => { if (J && J.fin) irMapa(); }), sinMov() ? 0 : 500);
}
function consejo(niv) {
  const f = niv.formas;
  if (f.suma || f.resta) return mate("para sumar o restar con distinto denominador, primero pásalas al mismo: 1/2 + 1/4 = 2/4 + 1/4 = 3/4. Eso es justo lo que hace el tablero al juntar dos fichas.");
  if (f.falta) return mate("piensa el 1 con ese denominador: 1 = 6/6. Si tienes 1/6, te faltan 5/6. Las fichas que suman 1 desaparecen y dejan sitio.");
  if (f.sumaIgual) return mate("con el mismo denominador solo se suman los numeradores: 1/8 + 2/8 = 3/8.");
  if (f.equiv) return mate("2/4, 4/8 y 1/2 valen lo mismo. Simplifica el pedido antes de buscar la ficha.");
  return mate("si una ficha te estorba, complétala hasta 1 para que desaparezca: a 3/4 le falta 1/4.");
}
const QUEBRON = `<img src="../../compartido/img/personajes/pirata.webp" alt="Quebrón" width="240" height="240">`;   // Quebrón tiene la cara de Pirata (personaje de la marca)

/* =================== VENTANAS =================== */
function irMapa() { J = null; pintarMapa(); pantalla("pMapa"); }
function irMenu() { J = null; pintarCartera(); pantalla("pMenu"); }
const interruptor = (clave, titulo, sub) => `<div class="item"><div><b>${titulo}</b><span>${sub}</span></div>
  <button class="interruptor" data-a="ajuste" data-clave="${clave}" aria-pressed="${!!AJ[clave]}" aria-label="${titulo}">${AJ[clave] ? "Sí" : "No"}</button></div>`;
const ajustesHTML = () => `<div class="lista">${interruptor("sonido", "Sonidos", "Efectos al sumar y entregar")}${interruptor("musica", "Música", "Melodía de fondo")}
  ${interruptor("animaciones", "Animaciones", "Desactívalas si te marean o el dispositivo va lento")}
  ${interruptor("tranquilo", "Modo tranquilo", "50 % más de movimientos y el jefe ataca más despacio")}</div>`;
function vPausa() {
  ventana(`<h2>Pausa</h2><p class="nota">${J.inf ? "Partida infinita" : `Nivel ${J.niv.id} · ${esc(J.niv.nombre)}`} · no hay límite de tiempo</p>${ajustesHTML()}
    <div class="fila"><button class="btn oro" data-a="cerrar" data-foco>Seguir</button><button class="btn gris" data-a="jugar" data-niv="${J.niv.id}">Reiniciar</button>
    <button class="btn gris" data-a="como">Ayuda</button><button class="btn gris" data-a="mapa">Salir</button></div>`);
}
function vAjustes() { ventana(`<h2>Ajustes</h2>${ajustesHTML()}<button class="btn oro" data-a="cerrar" data-foco>Listo</button>`); }
function vComo() {
  ventana(`<h2>Cómo se juega</h2><div class="izq">
    <div class="caja"><b>1 · Desliza.</b> Todas las fichas se mueven a la vez. Con teclado: flechas.</div>
    <div class="caja mate">${mate("2 · Suma. Dos fichas que chocan se suman: 1/2 + 1/4 = 2/4 + 1/4 = 3/4.")}</div>
    <div class="caja"><b>3 · Completa la unidad.</b> Si dos fichas suman exactamente 1 (${mate("3/4 + 1/4")}), desaparecen y dan puntos. Si pasarían de 1, no se juntan.</div>
    <div class="caja"><b>4 · Entrega.</b> Toca la ficha que valga lo mismo que un pedido de arriba. ${mate("Si piden 6/8, vale la ficha 3/4.")} Toca un pedido para ver una pista.</div>
    <div class="caja"><b>Fichas claras</b> (${mate("2/4, 3/6")}…): están sin simplificar, pero valen lo mismo que su fracción simplificada.</div>
    <div class="caja"><b>Rocas y hielo:</b> se rompen haciendo una suma justo al lado.</div>
    <div class="caja"><b>Poderes:</b> ${PODERES.map(p => `${p.icono} ${mate(p.desc)}`).join(" ")}</div></div>
    <button class="btn oro" data-a="cerrar" data-foco>¡Vamos!</button>`);
}
function vTienda() {
  const d = MQ.leer();
  const skins = SKINS.map(s => { const tengo = S.skins.includes(s.id), puesto = S.skin === s.id;
    return `<div class="item"><span class="ico"><span class="skin-${s.id}" style="display:block;font-size:13px"><span class="ficha d3" style="position:static;width:34px;height:34px"><span class="in">${mate("1/3")}</span></span></span></span>
      <div><b>${s.nombre}</b><span>Aspecto de las fichas</span></div>
      ${puesto ? '<b style="color:var(--salvia-oscuro)">En uso</b>' : tengo ? `<button class="btn" data-a="poner" data-id="${s.id}">Usar</button>`
        : `<button class="btn oro" data-a="comprar" data-id="${s.id}" ${d.monedas >= s.precio ? "" : "disabled"}>${s.precio} 🪙</button>`}</div>`; }).join("");
  const mej = PODERES.map(p => { const n = S.mejoras[p.id] || 0, precio = 100 * (n + 1), libre = poderLibre(p);
    return `<div class="item ${libre ? "" : "apagado"}"><span class="ico">${p.icono}</span><div><b>${p.nombre} +1</b><span>${libre ? `Empiezas cada nivel con ${p.base + n}${n < 2 ? " → " + (p.base + n + 1) : ""} usos` : "Se desbloquea en el nivel " + p.tras}</span></div>
      ${!libre ? "🔒" : n >= 2 ? '<b style="color:var(--salvia-oscuro)">Máx.</b>' : `<button class="btn oro" data-a="mejora" data-id="${p.id}" ${d.monedas >= precio ? "" : "disabled"}>${precio} 🪙</button>`}</div>`; }).join("");
  ventana(`<h2>Tienda</h2><p><span class="chip">🪙 ${d.monedas} monedas</span></p><p class="nota">Las monedas se ganan jugando. No se compran con dinero.</p>
    <div class="lista">${skins}${mej}</div><button class="btn oro" data-a="cerrar" data-foco>Cerrar</button>`);
}
function vLogros() {
  const d = MQ.leer(), mios = MQ.LOGROS.filter(l => l.juego === "fraction-merge");
  ventana(`<h2>Logros y medallas</h2><p class="nota">${mios.filter(l => d.logros[l.id]).length} de ${mios.length} conseguidos</p><div class="lista">` +
    mios.map(l => `<div class="item ${d.logros[l.id] ? "" : "apagado"}"><span class="ico">${d.logros[l.id] ? l.icono : "?"}</span><div><b>${esc(l.titulo)}</b><span>${esc(l.desc)}</span></div>${d.logros[l.id] ? "✅" : ""}</div>`).join("") +
    `</div><button class="btn oro" data-a="cerrar" data-foco>Cerrar</button>`);
}
const ACCIONES = {
  cerrar: cerrarVentana,
  jugar: b => { alCerrar = null; cerrarVentana(); empezar(b.dataset.niv === "inf" ? "inf" : +b.dataset.niv); },
  mapa: () => { alCerrar = null; cerrarVentana(); irMapa(); },
  como: vComo,
  ajuste: b => { const k = b.dataset.clave; AJ[k] = !AJ[k]; MQ.ajuste(k, AJ[k]); b.setAttribute("aria-pressed", AJ[k]); b.textContent = AJ[k] ? "Sí" : "No";
    document.body.classList.toggle("sinmov", sinMov()); },
  poner: b => { S.skin = b.dataset.id; guardar(); if (J) $("#tablero").className = "skin-" + S.skin; vTienda(); },
  comprar: b => { const s = SKINS.find(x => x.id === b.dataset.id); if (MQ.gastar(s.precio)) { S.skins.push(s.id); S.skin = s.id; guardar(); avisar(`🎨 Nuevo aspecto: ${s.nombre}`); } vTienda(); pintarCartera(); },
  mejora: b => { const n = S.mejoras[b.dataset.id] || 0; if (n < 2 && MQ.gastar(100 * (n + 1))) { S.mejoras[b.dataset.id] = n + 1; guardar(); } vTienda(); pintarCartera(); }
};

/* =================== ENTRADAS: táctil, ratón y teclado =================== */
const zona = $("#zona"); let gesto = null, huboGesto = false;
zona.addEventListener("pointerdown", e => { gesto = { x: e.clientX, y: e.clientY, id: e.pointerId }; huboGesto = false; });
zona.addEventListener("pointermove", e => {
  if (!gesto || e.pointerId !== gesto.id) return;
  const dx = e.clientX - gesto.x, dy = e.clientY - gesto.y, u = Math.max(22, geo.celda * 0.3);
  if (Math.max(Math.abs(dx), Math.abs(dy)) < u) return;
  gesto = null; huboGesto = true;
  deslizar(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "der" : "izq") : (dy > 0 ? "aba" : "arr"));
});
// Sin esto, tras un deslizamiento rápido el navegador se "traga" el siguiente toque.
$("#pJuego").addEventListener("touchmove", e => e.preventDefault(), { passive: false });
const finGesto = () => { gesto = null; };
zona.addEventListener("pointerup", finGesto); zona.addEventListener("pointercancel", finGesto);
$("#tablero").addEventListener("click", e => {
  if (huboGesto) { huboGesto = false; return; }
  const f = e.target.closest(".ficha"); if (f) tocar(+f.dataset.i);
});
document.addEventListener("keydown", e => {
  if (abierta()) { if (e.key === "Escape") cerrarVentana(); return; }
  if (!J || J.fin) return;
  const d = { ArrowLeft: "izq", ArrowRight: "der", ArrowUp: "arr", ArrowDown: "aba", a: "izq", d: "der", w: "arr", s: "aba" }[e.key];
  if (d) { e.preventDefault(); deslizar(d); } else if (e.key === "Escape") vPausa();
});
$("#pedidos").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b || !J || J.fin) return;
  const p = J.abiertos[+b.dataset.k]; if (!p) return;
  Son.clic(); p.pista = Math.min(2, p.pista + 1);
  if (p.pista === 1) cinta("💡 " + mate(PISTA[p.forma]) + " (Toca otra vez para ver la solución)", true);
  else ventana(`<h2>💡 Pista</h2><div class="caja mate">${mate(p.explica)}</div><p class="nota">Con la solución a la vista, este pedido da la mitad de puntos.</p><button class="btn oro" data-a="cerrar" data-foco>Entendido</button>`);
  pintarPedidos();
});
$("#poderes").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) elegirPoder(b); });
$("#bPausa").onclick = () => { Son.clic(); vPausa(); };
$("#bTerminar").onclick = () => { if (J && !J.fin) terminar(false, J.inf || J.movs > 0 ? "atasco" : "movs"); };
$("#bJugar").onclick = () => { Son.clic(); const sig = NIVELES.find(n => !S.estrellas[n.id] && desbloqueado(n.id)); if (sig) empezar(sig.id); else irMapa(); };
$("#bNiveles").onclick = () => { Son.clic(); irMapa(); };
$("#bMapaAtras").onclick = () => { Son.clic(); irMenu(); };
$("#bTienda").onclick = () => { Son.clic(); vTienda(); };
$("#bLogros").onclick = () => { Son.clic(); vLogros(); };
$("#bAjustes").onclick = () => { Son.clic(); vAjustes(); };
$("#bComo").onclick = () => { Son.clic(); vComo(); };
let tMedir = 0;
function remedir() { if (!J) return; medir(); els.forEach(el => { el.style.width = el.style.height = geo.celda + "px"; }); const sm = document.body.classList.contains("sinmov");
  document.body.classList.add("sinmov"); pintarTablero(); void $("#tablero").offsetWidth; document.body.classList.toggle("sinmov", sm); }
addEventListener("resize", () => { clearTimeout(tMedir); tMedir = setTimeout(remedir, 60); });
if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(tMedir); tMedir = setTimeout(remedir, 60); }).observe(zona);
document.addEventListener("contextmenu", e => { if (J) e.preventDefault(); });

repartirMisiones(); guardar(); pintarCartera(); pantalla("pMenu");
window.__FM = { get J() { return J; }, get S() { return S; }, empezar, deslizar, tocar, terminar };   // para las pruebas automáticas
})();
</script>
