<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Rush πCHU · Fracciones</title>
<meta name="theme-color" content="#332B2A">
<!-- πCHU: botón para volver a la portada -->
<script src="../../compartido/volver.js" defer></script>
<style>
@font-face{font-family:"Lato";font-weight:400;font-display:swap;src:url("../../compartido/fuentes/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;font-display:swap;src:url("../../compartido/fuentes/lato-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:900;font-display:swap;src:url("../../compartido/fuentes/lato-latin-900-normal.woff2") format("woff2")}
:root{
  --espresso:#332B2A; --salvia:#5A8A78; --coral:#E46D4D; --crema:#F4EDD7;
  --coral-oscuro:#A8402A; --salvia-oscuro:#3F6E5C; --papel:#FFFCF3; --linea:#D9CFB4; --oro:#E8B04B;
  --masa:#D9A55B; --queso:#F6D58E; --peperoni:#A8402A; --madera:#6B4A3A;
  --fuente:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fuente);color:var(--espresso);line-height:1.4;min-height:100vh;background:var(--espresso);
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.oculto{display:none!important}
.solo-lector{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em;font-weight:900}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .1em .06em}
.fr>span:last-child{padding:.06em .1em 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:46px;padding:.45em 1.2em;border-radius:14px;border:3px solid var(--espresso);
  background:var(--coral);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--espresso);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--espresso)}
.btn.verde{background:var(--salvia-oscuro)}
.btn.claro{background:var(--papel);color:var(--espresso);text-shadow:none}
.btn.oro{background:var(--oro);color:var(--espresso);text-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--espresso)}
.btn.peq{min-height:38px;padding:.25em .8em;font-size:.95rem;border-radius:11px}

/* ================= INICIO / MI PIZZERÍA ================= */
#inicio{min-height:100vh;background:
  radial-gradient(circle at 20% 10%,rgba(232,176,75,.25),transparent 40%),
  radial-gradient(circle at 80% 90%,rgba(228,109,77,.25),transparent 45%), var(--espresso);color:var(--crema);padding:1.2rem 1rem 4rem}
.ini{max-width:1050px;margin:0 auto}
.logo-rush{text-align:center;margin:.6rem 0 1.2rem}
.logo-rush h1{margin:0;font-size:clamp(2.6rem,9vw,5rem);font-weight:900;line-height:.95;letter-spacing:-.02em;
  color:var(--oro);text-shadow:0 4px 0 var(--coral-oscuro),0 8px 0 #1d1716}
.logo-rush h1 span{color:var(--crema)}
.logo-rush p{margin:.6rem 0 0;font-size:1.1rem;opacity:.9}
.mi-pizzeria{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;align-items:stretch}
@media (max-width:820px){.mi-pizzeria{grid-template-columns:1fr}}
.panel{background:rgba(255,252,243,.06);border:2px solid rgba(244,237,215,.18);border-radius:20px;padding:1rem}
.panel h2{margin:0 0 .5rem;font-size:1.15rem;font-weight:900;letter-spacing:.02em}
.escaparate{position:relative;height:220px;border-radius:16px;overflow:hidden;background:var(--crema);border:3px solid var(--espresso)}
.rango{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}
.rango b{font-size:1.25rem;color:var(--oro)}
.monedas-total{font-size:1.4rem;font-weight:900}
.turnos{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.turno-btn{width:100%;text-align:left;padding:.7rem .8rem;border-radius:14px;border:3px solid var(--espresso);background:var(--papel);color:var(--espresso);cursor:pointer;box-shadow:0 4px 0 #1d1716;display:flex;flex-direction:column;gap:.15rem;min-height:110px}
.turno-btn:hover:not([disabled]){background:#fff}
.turno-btn[disabled]{opacity:.5;cursor:not-allowed}
.turno-btn .n{font-size:.75rem;font-weight:900;color:var(--coral-oscuro);text-transform:uppercase;letter-spacing:.05em}
.turno-btn b{font-size:1.02rem;line-height:1.15}
.turno-btn small{font-size:.82rem}
.turno-btn .est{margin-top:auto;font-size:1.05rem;letter-spacing:.08em;color:#B9811F}
.turno-btn.jefe{background:linear-gradient(135deg,#FFF3D6,#F4D58E)}
.acciones-ini{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.2rem}

/* ================= COCINA ================= */
#cocina{min-height:100vh;display:flex;flex-direction:column;background:
  repeating-linear-gradient(45deg,rgba(51,43,42,.035) 0 12px,transparent 12px 24px),
  linear-gradient(var(--crema),#EFE4C8)}
.hud{display:flex;align-items:center;gap:.5rem .9rem;flex-wrap:wrap;padding:.5rem .8rem;background:var(--espresso);color:var(--crema);position:sticky;top:0;z-index:20}
.hud .marca{font-weight:900;font-size:1.05rem;margin-right:auto;white-space:nowrap}
.hud .marca span{color:var(--oro)}
.dato{display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:58px}
.dato small{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.dato b{font-size:1.15rem}
.combo{display:flex;align-items:center;gap:.3rem;font-weight:900;font-size:1.25rem;min-width:84px;justify-content:center;padding:.15rem .6rem;border-radius:12px;background:#1d1716}
.combo.x2{color:var(--oro)} .combo.x3{color:#FFB25E} .combo.x4{color:#FF7A4D;text-shadow:0 0 12px rgba(255,122,77,.8)}
.combo.pulso{animation:pulso .4s}
@keyframes pulso{50%{transform:scale(1.25)}}
.hud .btn{box-shadow:none;border-color:var(--crema);background:transparent;color:var(--crema);text-shadow:none}

.carril{display:flex;gap:.8rem;padding:.9rem .8rem .4rem;overflow-x:auto;min-height:250px;align-items:flex-start}
.ticket{position:relative;flex:0 0 250px;background:#fff;border:3px solid var(--espresso);border-radius:6px 6px 0 0;padding:.6rem .7rem 1.2rem;cursor:pointer;
  box-shadow:0 6px 0 rgba(51,43,42,.25);transform:rotate(var(--rot,0deg));transition:transform .2s,box-shadow .2s;animation:entra .45s cubic-bezier(.2,1.4,.4,1)}
.ticket::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-12px;height:12px;
  background:linear-gradient(-45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x,linear-gradient(45deg,transparent 8px,#fff 0) 0 0/16px 12px repeat-x}
.ticket.activo{transform:rotate(0) translateY(-6px);box-shadow:0 0 0 4px var(--oro),0 10px 0 rgba(51,43,42,.25)}
.ticket.jefe{background:linear-gradient(160deg,#FFF7E0,#FBE3A6)}
.ticket.jefe::after{background:linear-gradient(-45deg,transparent 8px,#FBE3A6 0) 0 0/16px 12px repeat-x,linear-gradient(45deg,transparent 8px,#FBE3A6 0) 0 0/16px 12px repeat-x}
@keyframes entra{from{transform:translateY(-120%) rotate(-8deg);opacity:0}}
.ticket.sale{animation:sale .5s ease forwards}
@keyframes sale{to{transform:translateY(-140%) rotate(10deg);opacity:0}}
.ticket.perdido{animation:perdido .6s ease forwards}
@keyframes perdido{to{transform:translateY(60px) rotate(-14deg);opacity:0}}
.ticket.tiembla{animation:temblor .35s}
@keyframes temblor{25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
.t-cab{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.t-cab .tecla{background:var(--espresso);color:#fff;border-radius:6px;padding:0 .4em}
.etq{padding:.1em .5em;border-radius:999px;background:var(--crema)}
.etq.mult{background:#DCE8E1;color:var(--salvia-oscuro)} .etq.div{background:#E5E0F2;color:#4B3F7A} .etq.jefe{background:var(--oro)}
.t-pedido{font-size:1.15rem;font-weight:700;margin:.4rem 0;min-height:3.2em}
.t-pedido .fr{font-size:1.35em}
.pac{height:9px;border-radius:999px;background:#EEE4CC;overflow:hidden;margin:.2rem 0 .5rem}
.pac span{display:block;height:100%;border-radius:999px;background:var(--salvia)}
.pac.media span{background:var(--oro)} .pac.baja span{background:var(--coral)}
.t-caja{min-height:62px;border:2px dashed var(--linea);border-radius:10px;padding:.35rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;justify-content:center;background:var(--papel)}
.t-caja .vacio{font-size:.82rem;opacity:.7}
.t-caja svg{width:84px;height:84px}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:.1em .5em;border-radius:9px;border:2px solid var(--espresso);background:var(--queso);cursor:pointer;font-size:.95rem}
.t-botones{display:flex;gap:.4rem;margin-top:.5rem}
.t-botones .btn{flex:1}
.t-resp{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-top:.4rem}
.t-resp .btn{padding:.2em;font-size:1.2rem}
.t-dibujo{display:flex;justify-content:center;gap:.3rem}
.t-dibujo svg{width:70px;height:70px}
.t-intento{font-size:.8rem;color:var(--coral-oscuro);font-weight:700;min-height:1.1em;margin-top:.25rem}
.hueco-ticket{flex:0 0 250px;border:3px dashed rgba(51,43,42,.2);border-radius:8px;min-height:200px;display:grid;place-items:center;color:rgba(51,43,42,.45);font-weight:700;text-align:center;padding:1rem}

.cocina-baja{display:grid;grid-template-columns:150px 1fr;gap:.8rem;padding:.6rem .8rem 1.2rem;align-items:end}

.horno{position:relative;height:170px;border-radius:80px 80px 14px 14px;background:linear-gradient(#B4574A,#8C3F35);border:4px solid var(--espresso);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.horno::before{content:"";position:absolute;inset:8px 8px auto;height:60%;border-radius:70px 70px 0 0;
  background:repeating-linear-gradient(0deg,transparent 0 16px,rgba(0,0,0,.15) 16px 18px),repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.12) 30px 32px)}
.boca{position:relative;width:96px;height:58px;border-radius:50px 50px 6px 6px;background:#1d1716;border:3px solid var(--espresso);overflow:hidden}
.fuego{position:absolute;inset:auto 0 0;height:70%;background:radial-gradient(ellipse at 50% 100%,#FFD36B,#FF7A3D 45%,transparent 70%);animation:fuego 1s infinite alternate}
@keyframes fuego{to{transform:scaleY(1.2) translateY(-3px);opacity:.85}}
.horno .barra{position:absolute;left:12px;right:12px;top:12px;height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.horno .barra span{display:block;height:100%;background:var(--oro)}
.horno .rotulo{position:absolute;top:28px;color:#FFE9BF;font-weight:900;font-size:.8rem;letter-spacing:.08em}
.horno.lleno .rotulo{color:#fff;animation:pulso 1s infinite}
.mostrador{position:relative;border-radius:16px;border:4px solid var(--espresso);background:var(--madera);padding:1rem .6rem 1.2rem;min-height:200px;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.2)}
.cinta{position:absolute;left:0;right:0;bottom:10px;height:14px;background:repeating-linear-gradient(90deg,#2a2221 0 20px,#3d3230 20px 40px);animation:cinta 1.2s linear infinite;opacity:.8}
@keyframes cinta{to{background-position:40px 0}}
.huecos{position:relative;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;z-index:1}
.pizza{position:relative;width:140px;display:flex;flex-direction:column;align-items:center;animation:llega .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes llega{from{transform:translateX(-160px) rotate(-90deg);opacity:0}}
.pizza svg{width:140px;height:140px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.pizza .corte{font-size:.82rem;font-weight:900;color:var(--crema);background:rgba(0,0,0,.35);padding:.05em .55em;border-radius:999px;margin-top:.15rem}
.pizza .herr{position:absolute;top:-6px;right:-4px;display:flex;gap:3px}
.pizza .herr button{width:34px;height:34px;border-radius:50%;border:2px solid var(--espresso);background:var(--papel);cursor:pointer;font-size:.95rem;line-height:1;padding:0}
.hueco-pizza{width:140px;height:140px;border-radius:50%;border:3px dashed rgba(244,237,215,.25);align-self:center}
.porcion{cursor:pointer}
.porcion:hover{filter:brightness(1.1)}
.porcion:focus{outline:none}
.porcion:focus-visible path.borde{stroke:var(--oro);stroke-width:6}
.agujero path{fill:rgba(0,0,0,.18);stroke:rgba(244,237,215,.35);stroke-dasharray:4 4}

/* Decoración */
.deco-luces{position:absolute;left:0;right:0;top:0;height:26px;pointer-events:none;
  background:radial-gradient(circle at 10px 14px,#FFD36B 5px,transparent 6px) 0 0/40px 26px,radial-gradient(circle at 30px 14px,#E46D4D 5px,transparent 6px) 0 0/40px 26px,
  radial-gradient(circle at 20px 18px,#5A8A78 5px,transparent 6px) 20px 0/40px 26px;animation:parpadeo 1.6s steps(2) infinite}
@keyframes parpadeo{50%{filter:brightness(1.5)}}
.mostrador.mantel{background:repeating-conic-gradient(#C9483A 0 25%,#F4EDD7 0 50%) 0 0/44px 44px}
.neon{font-weight:900;color:#FF8FB1;text-shadow:0 0 6px #FF4F8B,0 0 16px #FF4F8B;letter-spacing:.06em}
.maceta{position:absolute;bottom:-4px;font-size:2rem;z-index:2;pointer-events:none}

/* Avisos y efectos */
#aviso{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:40;width:min(560px,94vw);border:3px solid var(--espresso);border-radius:16px;padding:.7rem 1rem;
  background:var(--papel);box-shadow:0 8px 0 rgba(51,43,42,.25);font-size:1rem;cursor:pointer;animation:aviso .3s}
#aviso.bien{background:#EEF5F1;border-color:var(--salvia-oscuro)} #aviso.mal{background:#FBEDE7;border-color:var(--coral-oscuro)}
#aviso h3{margin:0 0 .25rem;font-size:1.1rem}
#aviso p{margin:.2rem 0}
#aviso .op{font-weight:700}
@keyframes aviso{from{transform:translate(-50%,-20px);opacity:0}}
.flota{position:fixed;z-index:45;font-weight:900;font-size:1.6rem;color:var(--oro);text-shadow:0 2px 0 var(--espresso),0 0 8px rgba(0,0,0,.4);pointer-events:none;animation:flota 1.1s ease-out forwards}
@keyframes flota{to{transform:translateY(-90px) scale(1.2);opacity:0}}
.grito{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:46;font-weight:900;font-size:clamp(2rem,7vw,4rem);color:var(--oro);
  text-shadow:0 4px 0 var(--coral-oscuro),0 8px 0 var(--espresso);pointer-events:none;animation:grito 1s ease-out forwards;white-space:nowrap}
@keyframes grito{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.confeti{position:fixed;width:10px;height:14px;z-index:44;pointer-events:none;animation:confeti 1.2s ease-in forwards}
@keyframes confeti{to{transform:translate(var(--dx),220px) rotate(540deg);opacity:0}}
.sacude{animation:sacude .3s}
@keyframes sacude{25%{transform:translate(-5px,2px)}75%{transform:translate(5px,-2px)}}

/* Capas */
.capa{position:fixed;inset:0;background:rgba(29,23,22,.75);display:grid;place-items:center;padding:1rem;z-index:60}
.caja-capa{background:var(--papel);border:4px solid var(--espresso);border-radius:22px;padding:1.3rem;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 10px 0 #1d1716}
.caja-capa h2{margin:.1rem 0 .6rem;font-size:1.6rem;font-weight:900}
.caja-capa .estrellas{font-size:3rem;letter-spacing:.15em;color:#C98A1E}
.caja-capa ul{text-align:left}
.caja-capa label{display:flex;gap:.6rem;align-items:flex-start;text-align:left;margin:.7rem 0}
.caja-capa input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px}
.botones{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}
.tienda{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem;text-align:left}
.mejora{display:grid;grid-template-columns:44px 1fr auto;gap:.6rem;align-items:center;padding:.6rem;border:2px solid var(--linea);border-radius:14px;background:#fff}
.mejora .ico{font-size:1.8rem;text-align:center}
.mejora b{display:block}
.mejora small{display:block;font-size:.85rem}
.mejora .niv{font-size:.8rem;color:var(--salvia-oscuro);font-weight:900}
.tienda h3{margin:.8rem 0 .2rem;font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
.cortes{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}

 /* Móvil (al final para que mande sobre lo anterior) */
@media (max-width:700px){.cocina-baja{grid-template-columns:1fr}
  .horno{height:64px;border-radius:32px;flex-direction:row;justify-content:center;gap:1rem;padding:0 1rem}
  .horno::before{display:none}
  .horno .boca{width:60px;height:34px}
  .horno .rotulo{position:static}
  .horno .barra{top:auto;bottom:6px}
  .carril{min-height:0}
  .ticket,.hueco-ticket{flex-basis:230px}
  .pizza,.pizza svg{width:120px}.pizza svg{height:120px}.hueco-pizza{width:120px;height:120px}}
.sin-mov *,.sin-mov *::before,.sin-mov *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= INICIO: MI PIZZERÍA ================= -->
<main id="inicio">
  <div class="ini">
    <header class="logo-rush">
      <h1>PIZZA <span>RUSH</span></h1>
      <p>La cocina de fracciones de <b>πCHU</b> · ¡Sirve los pedidos exactos antes de que se impacienten!</p>
    </header>
    <div class="mi-pizzeria">
      <section class="panel" aria-labelledby="tMiPiz">
        <h2 id="tMiPiz">Mi pizzería</h2>
        <div class="escaparate" id="escaparate" aria-hidden="true"></div>
        <div class="rango">
          <span>Categoría: <b id="rango"></b></span>
          <span class="monedas-total" aria-label="Monedas"><span aria-hidden="true">💰</span> <span id="monedasTotal">0</span></span>
        </div>
        <div class="botones" style="justify-content:flex-start">
          <button class="btn oro" type="button" data-abre="tienda">🛒 Tienda</button>
          <button class="btn claro" type="button" data-abre="ayuda">Cómo se juega</button>
          <button class="btn claro" type="button" data-abre="ajustes">Ajustes</button>
        </div>
      </section>
      <section class="panel" aria-labelledby="tTurnos">
        <h2 id="tTurnos">Turnos</h2>
        <ul class="turnos" id="listaTurnos"></ul>
      </section>
    </div>
    <div class="acciones-ini"><button class="btn" type="button" id="btnJugar" style="font-size:1.3rem;padding:.5em 2em">▶ ¡A la cocina!</button></div>
  </div>
</main>

<!-- ================= COCINA ================= -->
<main id="cocina" class="oculto">
  <div class="hud">
    <span class="marca">🍕 PIZZA <span>RUSH</span> <span id="neonHud" class="neon oculto">· πCHU ·</span></span>
    <span class="dato"><small>Turno</small><b id="hTurno"></b></span>
    <span class="dato"><small>Pedidos</small><b id="hPedidos"></b></span>
    <span class="dato"><small>Monedas</small><b id="hMonedas">0</b></span>
    <span class="combo" id="hCombo" aria-label="Multiplicador">x1</span>
    <button class="btn peq" type="button" id="btnMusica" aria-pressed="true" title="Música">🎵</button>
    <button class="btn peq" type="button" id="btnPausa">⏸ Pausa</button>
  </div>
  <div style="position:relative">
    <div class="deco-luces oculto" id="decoLuces"></div>
    <section class="carril" id="carril" aria-label="Pedidos"></section>
  </div>
  <section class="cocina-baja" aria-label="Cocina">
    <div class="horno" id="horno" aria-label="Horno">
      <div class="barra"><span id="barraHorno"></span></div>
      <div class="rotulo" id="rotuloHorno">HORNO</div>
      <div class="boca"><div class="fuego"></div></div>
    </div>
    <div class="mostrador" id="mostrador">
      <div class="cinta"></div>
      <div class="huecos" id="huecos"></div>
      <span class="maceta oculto" id="maceta1" style="left:-10px">🪴</span>
      <span class="maceta oculto" id="maceta2" style="right:-10px">🪴</span>
    </div>
  </section>
  <p class="solo-lector" id="anuncio" aria-live="assertive"></p>
</main>

<div id="aviso" class="oculto" role="status" aria-live="polite"></div>
<div class="capa oculto" id="capa" role="dialog" aria-modal="true"><div class="caja-capa" id="capaCaja"></div></div>

<script>
/* =====================================================================
   Pizzería πCHU · motor matemático
   Todo se calcula con ENTEROS: una pizza = 24 "veinticuatroavos"
   (24 se puede dividir entre 2, 3, 4, 6, 8 y 12). Así no hay decimales
   ni errores de redondeo.
   Este archivo no toca la pantalla: se puede probar en Node.
   ===================================================================== */
(function (raiz) {
  "use strict";

  const U = 24;                                   // una pizza entera
  const CORTES = [2, 3, 4, 6, 8, 12];             // formas de cortar una pizza
  const NOMBRE_CORTE = { 2: "mitades", 3: "tercios", 4: "cuartos", 6: "sextos", 8: "octavos", 12: "doceavos" };

  // ---------- Fracciones ----------
  const mcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const mcm = (a, b) => a / mcd(a, b) * b;
  const simplificar = (n, d) => { const g = mcd(n, d); return { n: n / g, d: d / g }; };
  const aU = (n, d) => n * U / d;                 // fracción → veinticuatroavos (debe ser entero)
  const deU = t => simplificar(t, U);             // veinticuatroavos → fracción simplificada
  const esEntero24 = (n, d) => (n * U) % d === 0;

  // Texto de una fracción (para mensajes): "3/4", "2", "1 y 1/2"
  function texto(f, mixto = false) {
    const s = simplificar(f.n, f.d);
    if (s.d === 1) return String(s.n);
    if (mixto && s.n > s.d) { const e = Math.floor(s.n / s.d), r = s.n % s.d; return `${e} y ${r}/${s.d}`; }
    return `${s.n}/${s.d}`;
  }

  // ---------- Qué se puede servir con las porciones del mostrador ----------
  // porciones: lista de tamaños en veinticuatroavos (una entrada por porción).
  // Devuelve, para cada total t, el conjunto de números de porciones posibles.
  function cantidadesPosibles(porciones, max) {
    const dp = Array.from({ length: max + 1 }, () => new Set());
    dp[0].add(0);
    for (const p of porciones) {
      for (let t = max; t >= p; t--) {
        for (const k of dp[t - p]) dp[t].add(k + 1);
      }
    }
    return dp;
  }
  const sePuede = (porciones, t) => t > 0 && cantidadesPosibles(porciones, t)[t].size > 0;
  function minPorciones(porciones, t) {
    const s = cantidadesPosibles(porciones, t)[t];
    return s.size ? Math.min(...s) : Infinity;
  }

  // ---------- Generador de pedidos ----------
  const azar = (a) => a[Math.floor(Math.random() * a.length)];
  const entre = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  // Fracciones "de pizza" que se pueden pedir: denominador entre los cortes permitidos
  function fraccionesPedibles(dens, maxU) {
    const lista = [], vistos = new Set();
    for (const d of dens) for (let n = 1; aU(n, d) <= maxU; n++) {
      const s = simplificar(n, d), k = s.n + "/" + s.d;
      if (!vistos.has(k)) { vistos.add(k); lista.push(s); }
    }
    return lista;
  }

  // Escritura del pedido: a veces sin simplificar (6/8) o en forma mixta (1 y 1/2)
  function escribir(f, cfg) {
    let { n, d } = f;
    if (cfg.sinSimplificar && Math.random() < 0.35) {
      const ks = [2, 3, 4].filter(k => cfg.dens.includes(d * k));
      if (ks.length && n < d * 2) { const k = azar(ks); n *= k; d *= k; }
    }
    const mixto = cfg.mixtos && n > d && n % d !== 0 && Math.random() < 0.5;
    return mixto ? texto({ n, d }, true) : (d === 1 ? String(n) : `${n}/${d}`);
  }

  const PARTES = { 2: "la mitad", 3: "la tercera parte", 4: "la cuarta parte" };
  // "3/4 de pizza", "una pizza entera", "2 pizzas"
  const cant = f => { const s = simplificar(f.n, f.d); return s.d === 1 ? (s.n === 1 ? "una pizza entera" : `${s.n} pizzas`) : `${texto(s)} de pizza`; };

  /* Crea un pedido que SE PUEDE servir con las porciones del mostrador.
     cfg: { tipos, dens, maxU, sinSimplificar, mixtos, minU }
     Devuelve null si no hay ninguno posible (entonces hay que hornear más pizza). */
  function generarPedido(porciones, cfg) {
    const disponible = porciones.reduce((a, b) => a + b, 0);
    const maxU = Math.min(cfg.maxU, disponible);
    const dp = cantidadesPosibles(porciones, maxU);
    // El resultado tiene que poder escribirse con los cortes del turno (nada de 5/24 en 1.º ESO)
    const denOk = t => { const d = deU(t).d; return d === 1 || cfg.dens.includes(d); };
    const ok = t => t >= (cfg.minU || 1) && t <= maxU && dp[t].size > 0 && denOk(t);
    const pedibles = fraccionesPedibles(cfg.dens, maxU);

    for (let intento = 0; intento < 60; intento++) {
      const tipo = azar(cfg.tipos);
      let p = null;

      if (tipo === "suma") {
        // Preferimos pedidos que obligan a juntar varias porciones
        const cand = pedibles.filter(f => ok(aU(f.n, f.d)) && (cfg.mixtos ? true : f.n < f.d * 1.01));
        if (!cand.length) continue;
        const buenos = cand.filter(f => Math.min(...dp[aU(f.n, f.d)]) >= 2);
        const f = azar(buenos.length && Math.random() < 0.8 ? buenos : cand);
        p = { tipo, objetivo: aU(f.n, f.d), escrito: escribir(f, cfg), op: null };
        p.texto = /^\d+$/.test(p.escrito)
          ? `Quiero ${p.escrito === "1" ? "una pizza entera" : p.escrito + " pizzas enteras"}, por favor.`
          : `Quiero ${p.escrito} de pizza, por favor.`;
      }

      else if (tipo === "mult_entero") {
        const k = entre(2, 4), base = azar(pedibles.filter(f => f.n < f.d));
        if (!base) continue;
        const t = k * aU(base.n, base.d);
        if (!ok(t)) continue;
        p = { tipo, objetivo: t, k, base, escrito: texto(base),
              texto: `Somos ${k} y queremos ${texto(base)} de pizza cada uno.`,
              op: `${k} × ${texto(base)} = ${texto({ n: k * base.n, d: base.d })}` };
      }

      else if (tipo === "fraccion_de") {
        // "la mitad de 3/4" o "2/3 de 3/4"
        const base = azar(pedibles.filter(f => f.n <= f.d * 2));
        if (!base) continue;
        const usarPartes = Math.random() < 0.6;
        const fr = usarPartes ? { n: 1, d: azar([2, 3, 4]) } : azar([{ n: 2, d: 3 }, { n: 3, d: 4 }, { n: 1, d: 2 }, { n: 1, d: 3 }]);
        const prodN = base.n * fr.n, prodD = base.d * fr.d;
        if (!esEntero24(prodN, prodD)) continue;
        const t = aU(prodN, prodD);
        if (!ok(t)) continue;
        const nombre = fr.n === 1 && PARTES[fr.d] ? PARTES[fr.d] : texto(fr);
        p = { tipo, objetivo: t, base, fr, escrito: texto(base),
              texto: `Quiero ${nombre} de ${cant(base)}.`,
              op: `${texto(fr)} × ${texto(base)} = ${prodN}/${prodD}` + (simplificar(prodN, prodD).d !== prodD ? ` = ${texto({ n: prodN, d: prodD })}` : "") };
      }

      else if (tipo === "div_entero") {
        const k = entre(2, 4), base = azar(pedibles.filter(f => f.n <= f.d * 2));
        if (!base || !esEntero24(base.n, base.d * k)) continue;
        const t = aU(base.n, base.d * k);
        if (!ok(t)) continue;
        p = { tipo, objetivo: t, k, base, escrito: texto(base),
              texto: `Hemos pedido ${cant(base)} para ${k} personas. Sírveme mi parte.`,
              op: `${texto(base)} ÷ ${k} = ${base.n}/${base.d * k}` + (simplificar(base.n, base.d * k).d !== base.d * k ? ` = ${texto({ n: base.n, d: base.d * k })}` : "") };
      }

      else if (tipo === "div_cuantas") {
        // ¿Cuántas porciones de 1/d (o k/d) caben en a/b? (respuesta: un número entero)
        const base = azar(pedibles.filter(f => f.n <= f.d * 2));
        const trozo = azar(fraccionesPedibles(cfg.dens, U).filter(f => f.n < f.d && f.n <= 3));
        if (!base || !trozo) continue;
        const tb = aU(base.n, base.d), tt = aU(trozo.n, trozo.d);
        if (tb % tt || tb / tt < 2 || tb / tt > 12) continue;
        if (simplificar(base.n, base.d).d === trozo.d) continue;   // sería solo contar porciones iguales
        const r = tb / tt;
        p = { tipo, objetivo: tb, respuesta: r, base, trozo, escrito: texto(base),
              texto: `Tengo ${cant(base)}. ¿Cuántas porciones de ${texto(trozo)} salen?`,
              op: `${texto(base)} ÷ ${texto(trozo)} = ${texto(base)} × ${trozo.d}/${trozo.n} = ${r}`,
              opciones: opcionesNumero(r, base, trozo) };
      }

      else if (tipo === "condicion") {
        // El Crítico: pedido con condición
        const cand = pedibles.filter(f => ok(aU(f.n, f.d)));
        if (!cand.length) continue;
        const f = azar(cand), t = aU(f.n, f.d);
        const modo = azar(["exactas", "sin", "minimo"]);
        if (modo === "exactas") {
          const ks = [...dp[t]].filter(k => k >= 2 && k !== Math.min(...dp[t]));
          if (!ks.length) continue;
          const k = azar(ks);
          p = { tipo, objetivo: t, escrito: texto(f), cond: { modo, k },
                texto: `Quiero ${texto(f)} de pizza… ¡con exactamente ${k} porciones!` };
        } else if (modo === "sin") {
          const usados = [...new Set(porciones)].filter(x => x > 0);
          const q = azar(usados), sinQ = porciones.filter(x => x !== q);
          if (!sePuede(sinQ, t) || sinQ.length === porciones.length) continue;
          const dq = U / q;
          p = { tipo, objetivo: t, escrito: texto(f), cond: { modo, tam: q },
                texto: `Quiero ${texto(f)} de pizza, pero ¡sin ninguna porción de 1/${dq}!` };
        } else {
          const m = Math.min(...dp[t]);
          if (m < 2) continue;                 // que no se pueda con una sola porción
          p = { tipo, objetivo: t, escrito: texto(f), cond: { modo, k: m },
                texto: `Quiero ${texto(f)} de pizza con el MENOR número de porciones posible.` };
        }
      }

      if (p) { p.minimo = p.tipo === "div_cuantas" ? null : minPorciones(porciones, p.objetivo); return p; }
    }
    return null;
  }

  function opcionesNumero(r, base, trozo) {
    const s = new Set([r]);
    // Distractores: errores típicos (multiplicar en vez de dividir, o solo dividir numeradores) y vecinos
    const prod = base.n * trozo.n / (base.d * trozo.d);
    if (Number.isInteger(prod) && prod > 0) s.add(prod);
    if (Number.isInteger(base.n / trozo.n) && base.n / trozo.n > 0) s.add(base.n / trozo.n);
    for (const v of [r - 1, r + 1, r + 2, r - 2, r * 2]) { if (s.size >= 4) break; if (v > 0) s.add(v); }
    return [...s].slice(0, 4).sort((a, b) => a - b);
  }

  // ---------- Evaluar lo servido ----------
  /* servidas: lista de porciones servidas [{d}] (cada una vale 1/d). */
  function evaluar(pedido, servidas) {
    const total = servidas.reduce((a, s) => a + U / s.d, 0);
    const res = { total, objetivo: pedido.objetivo, ok: total === pedido.objetivo, perfecto: false, pista: "" };
    res.diferencia = total - pedido.objetivo;
    if (pedido.cond) {
      if (pedido.cond.modo === "exactas" && servidas.length !== pedido.cond.k) res.ok = false, res.pista = `El Crítico quería exactamente ${pedido.cond.k} porciones y has servido ${servidas.length}.`;
      if (pedido.cond.modo === "sin" && servidas.some(s => U / s.d === pedido.cond.tam)) res.ok = false, res.pista = `¡Has usado porciones de 1/${U / pedido.cond.tam}, y estaban prohibidas!`;
      if (pedido.cond.modo === "minimo" && res.ok && servidas.length > pedido.cond.k) res.ok = false, res.pista = `La cantidad es correcta, pero se podía con solo ${pedido.cond.k} porciones.`;
    }
    res.perfecto = res.ok && pedido.minimo != null && servidas.length === pedido.minimo;
    if (!res.ok && !res.pista) res.pista = detectarError(pedido, servidas, total);
    res.pasos = pasos(servidas, pedido);
    return res;
  }

  // Errores típicos que se pueden reconocer en lo servido
  function detectarError(p, servidas, total) {
    const dens = [...new Set(servidas.map(s => s.d))];
    // "Denominador mayor = trozo mayor": pidió 3/4 y sirvió 3 porciones de 1/8
    if (p.tipo === "suma" || p.tipo === "condicion") {
      const m = String(p.escrito).match(/^(\d+)\/(\d+)$/);
      if (m && dens.length === 1 && servidas.length === +m[1] && dens[0] !== +m[2]) {
        const d = dens[0], b = +m[2];
        return `Has servido ${m[1]} porciones de 1/${d}, pero el pedido era de ${m[1]} porciones de 1/${b}. ` +
          (d > b ? `Las porciones de 1/${d} son más PEQUEÑAS: cuanto mayor es el denominador, más trozos y más pequeños.`
                 : `Las porciones de 1/${d} son más GRANDES: cuanto menor es el denominador, menos trozos y más grandes.`);
      }
    }
    const tb = p.base ? aU(p.base.n, p.base.d) : null;
    if (p.tipo === "mult_entero" && total === tb) return `Has servido la parte de una sola persona. Son ${p.k}: hay que multiplicar ${p.k} × ${texto(p.base)}.`;
    if ((p.tipo === "fraccion_de" || p.tipo === "div_entero") && total === tb) return `Has servido los ${texto(p.base)} enteros. Hay que quedarse solo con ${p.tipo === "div_entero" ? "una de las " + p.k + " partes" : "la parte que pide"}.`;
    if (p.tipo === "div_entero" && total === tb * p.k) return `Has multiplicado por ${p.k} en vez de dividir: al repartir entre ${p.k}, a cada uno le toca MENOS.`;
    return "";
  }

  // Pasos de la suma de lo servido con denominador común, sin decimales
  function pasos(servidas, pedido) {
    if (!servidas.length) return "No has servido nada.";
    const L = servidas.reduce((a, s) => mcm(a, s.d), 1);
    const tot = servidas.reduce((a, s) => a + L / s.d, 0);
    const partes = servidas.map(s => `1/${s.d}`).join(" + ");
    const comun = servidas.every(s => s.d === L) ? "" : " = " + servidas.map(s => `${L / s.d}/${L}`).join(" + ");
    const simp = simplificar(tot, L);
    const fin = (simp.n !== tot || simp.d !== L) ? ` = ${texto(simp)}` : "";
    return `${partes}${comun} = ${tot}/${L}${fin}`;
  }

  function comparar(total, objetivo) { return total < objetivo ? "corto" : total > objetivo ? "pasado" : "exacto"; }

  // ---------- Pizza Rush: tickets, horno, turnos y mejoras ----------
  // Los tickets se generan como si hubiera pizzas de todos los cortes del turno:
  // así siempre se pueden servir con lo que va sacando el horno.
  function stockVirtual(dens) { const p = []; for (const d of dens) for (let k = 0; k < d * 2; k++) p.push(U / d); return p; }
  function generarTicket(cfg) {
    for (let i = 0; i < 20; i++) { const t = generarPedido(stockVirtual(cfg.dens), cfg); if (t) return t; }
    return null;
  }
  // ¿Qué pizza hornear? Preferimos cortes que sirvan para los tickets abiertos.
  // Forma de servir con el menor número de porciones (cortes de "dens", sin el prohibido)
  function descomposicionMinima(objetivo, dens, prohibido) {
    const tam = dens.map(d => U / d).filter(x => x !== prohibido);
    const mejor = Array(objetivo + 1).fill(null); mejor[0] = [];
    for (let t = 1; t <= objetivo; t++) for (const x of tam) if (x <= t && mejor[t - x] && (!mejor[t] || mejor[t - x].length + 1 < mejor[t].length)) mejor[t] = [...mejor[t - x], x];
    return mejor[objetivo] ? mejor[objetivo].map(x => U / x) : null;
  }
  function cortesUtiles(ticket, dens) {
    if (!ticket || ticket.tipo === "div_cuantas") return [];
    const prohib = ticket.cond && ticket.cond.modo === "sin" ? ticket.cond.tam : null;
    const permitido = d => U / d !== prohib;
    const exactos = dens.filter(d => permitido(d) && ticket.objetivo % (U / d) === 0);
    const minima = descomposicionMinima(ticket.objetivo, dens, prohib) || [];
    // Los cortes de la solución más corta (p. ej. 1 y 7/8 = 1/2 + 1/2 + 1/2 + 1/4 + 1/8) y los que sirven solos
    const u = [...new Set([...minima, ...exactos])];
    return u.length ? dens.filter(d => u.includes(d)) : dens.filter(d => permitido(d) && U / d <= ticket.objetivo);
  }
  function elegirHorneado(tickets, dens) {
    const peso = d => 1 + 3 * tickets.filter(t => cortesUtiles(t, dens).includes(d)).length;
    const total = dens.reduce((a, d) => a + peso(d), 0);
    let r = Math.random() * total;
    for (const d of dens) { r -= peso(d); if (r <= 0) return d; }
    return dens[dens.length - 1];
  }
  // ¿Se puede servir este ticket con las porciones del mostrador (más las que ya estén en su caja)?
  const servibleCon = (ticket, porciones) => ticket.tipo === "div_cuantas" || sePuede(porciones, ticket.objetivo);

  // Monedas de un ticket bien servido
  const BASE_TIPO = { suma: 10, mult_entero: 15, fraccion_de: 15, div_entero: 15, div_cuantas: 12, condicion: 20 };
  function monedas({ tipo, combo, perfecto, rapido, propinaOro }) {
    const mult = combo >= 10 ? 4 : combo >= 6 ? 3 : combo >= 3 ? 2 : 1;
    return BASE_TIPO[tipo] * mult + (perfecto ? (propinaOro ? 10 : 5) : 0) + (rapido ? 5 : 0);
  }
  const multiplicador = combo => combo >= 10 ? 4 : combo >= 6 ? 3 : combo >= 3 ? 2 : 1;

  const TURNOS = [
    { id: 1, nombre: "Gran apertura", tema: "Mitades y cuartos", dens: [2, 4], tickets: 6, simult: 2, tipos: ["suma"], maxU: 24, vista: "plato", paciencia: 70 },
    { id: 2, nombre: "Hora punta", tema: "Tercios y sextos", dens: [2, 3, 4, 6], tickets: 8, simult: 3, tipos: ["suma"], maxU: 24, vista: "plato", paciencia: 65 },
    { id: 3, nombre: "Cortes finos", tema: "Octavos, doceavos y equivalencias", dens: [2, 3, 4, 6, 8, 12], tickets: 8, simult: 3, tipos: ["suma"], maxU: 24, vista: "caja", sinSimplificar: true, paciencia: 65 },
    { id: 4, nombre: "Mesas grandes", tema: "Más de una pizza", dens: [2, 3, 4, 6, 8], tickets: 8, simult: 3, tipos: ["suma"], maxU: 48, minU: 18, vista: "caja", mixtos: true, paciencia: 75 },
    { id: 5, nombre: "Pedidos en grupo", tema: "Multiplicar fracciones", dens: [2, 3, 4, 6, 8, 12], tickets: 8, simult: 3, tipos: ["mult_entero", "fraccion_de"], maxU: 48, vista: "caja", mixtos: true, paciencia: 80 },
    { id: 6, nombre: "A repartir", tema: "Dividir fracciones", dens: [2, 3, 4, 6, 8, 12], tickets: 8, simult: 3, tipos: ["div_entero", "div_cuantas", "div_cuantas"], maxU: 36, vista: "caja", paciencia: 80 },
    { id: 7, nombre: "Noche de fiesta", tema: "Todo mezclado", dens: [2, 3, 4, 6, 8, 12], tickets: 10, simult: 3, tipos: ["suma", "suma", "mult_entero", "fraccion_de", "div_entero", "div_cuantas"], maxU: 48, vista: "caja", mixtos: true, sinSimplificar: true, paciencia: 70 },
    { id: 8, nombre: "Inspección del Crítico", tema: "Jefe: pedidos con condiciones", dens: [2, 3, 4, 6, 8, 12], tickets: 8, simult: 3, tipos: ["condicion", "condicion", "fraccion_de", "div_entero"], maxU: 36, vista: "caja", jefe: true, paciencia: 75 }
  ];
  const JORNADAS = TURNOS;   // compatibilidad con la v0.1

  // Mejoras de la tienda. nivel: lo que tiene el jugador; precio por nivel.
  const MEJORAS = [
    { id: "horno", nombre: "Horno turbo", icono: "🔥", desc: "El horno saca pizzas más rápido.", precios: [120, 260, 450], tipo: "juego" },
    { id: "mostrador", nombre: "Mostrador XL", icono: "🍽️", desc: "Caben más pizzas en el mostrador.", precios: [150, 350], tipo: "juego" },
    { id: "campana", nombre: "Campanita de paciencia", icono: "🔔", desc: "Los clientes esperan un 25 % más por nivel.", precios: [100, 240], tipo: "juego" },
    { id: "cortador", nombre: "Cortador mágico", icono: "🔪", desc: "Vuelve a cortar una pizza entera en el corte que elijas (¡equivalencias!).", precios: [300], tipo: "juego" },
    { id: "oro", nombre: "Propina de oro", icono: "🪙", desc: "El servicio perfecto da el doble de propina.", precios: [220], tipo: "juego" },
    { id: "luces", nombre: "Luces de verbena", icono: "💡", desc: "Decoración: guirnalda de luces en la cocina.", precios: [80], tipo: "deco" },
    { id: "mantel", nombre: "Mantel de cuadros", icono: "🟥", desc: "Decoración: mostrador con mantel de cuadros.", precios: [80], tipo: "deco" },
    { id: "neon", nombre: "Letrero de neón", icono: "✨", desc: "Decoración: letrero πCHU de neón.", precios: [150], tipo: "deco" },
    { id: "plantas", nombre: "Plantas de albahaca", icono: "🌿", desc: "Decoración: macetas de albahaca.", precios: [60], tipo: "deco" }
  ];
  const intervaloHorno = nivel => [7, 5.5, 4.5, 3.5][nivel || 0];

function retirar(t, clase) {

function solucionEjemplo(p) {
  if (p.tipo === "div_cuantas") return "";
  const prohib = p.cond && p.cond.modo === "sin" ? p.cond.tam : null, exactas = p.cond && p.cond.modo === "exactas" ? p.cond.k : null;
  const usar = M.stockVirtual(G.cfg.dens).filter(x => x !== prohib).sort((a, b) => b - a);
  let mejor = null;
  const rec = (k, suma, sel) => {
    if (suma === p.objetivo && (!exactas || sel.length === exactas)) { if (!mejor || sel.length < mejor.length) mejor = [...sel]; return; }
    if (suma > p.objetivo || k >= usar.length || sel.length >= 10 || (mejor && !exactas && sel.length >= mejor.length)) return;
    sel.push(usar[k]); rec(k + 1, suma + usar[k], sel); sel.pop();
    let j = k + 1; while (j < usar.length && usar[j] === usar[k]) j++; rec(j, suma, sel);
  };
  rec(0, 0, []);
  return mejor ? mejor.map(x => "1/" + (U / x)).join(" + ") : "";
}

  if ($("#cocina").classList.contains("oculto") || !G || G.fin) return;
  if (/^[1-4]$/.test(e.key) && G.tickets[+e.key - 1]) { elegirTicket(G.tickets[+e.key - 1].id); const el = document.querySelector(`[data-ticket="${G.activo}"]`); if (el) el.focus({ preventScroll: true }); }
  else if (e.key === "e" || e.key === "E") { if (G.activo) enviar(G.activo); }
  else if (e.key === "v" || e.key === "V") { const t = ticketActivo(); if (t) { vaciarCaja(t); renderTickets(); renderMostrador(); } }
  else if (e.key === "p" || e.key === "P" || e.key === "Escape") pausar();
});
$("#btnPausa").onclick = pausar;
$("#btnMusica").onclick = () => { AJ.musica = !AJ.musica; guardar(); if (AJ.musica && G && !G.pausa) Musica.on(); else Musica.off(); renderHUD(); };
$("#btnJugar").onclick = () => empezarTurno(siguienteTurno());
document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.fin && !G.pausa && !$("#cocina").classList.contains("oculto")) pausar(); });

aplicarMov();
inicio();
if (alias) document.querySelector(".logo-rush p").insertAdjacentHTML("beforeend", `<br>¡Hola, <b>${esc(alias)}</b>!`);

// Ganchos para las pruebas automáticas
window.__pizzeria = { M, get G() { return G; }, D, AJ, empezarTurno, enviar, responder, meterPorcion, elegirTicket, hornear, tirar, cortar, tienda, finTurno, solucionEjemplo, inicio, pausar, reanudar, renderTodo };
})();
