# Publica πCHU en GitHub Pages cada vez que se sube un cambio a la rama main.
# Antes de publicar ejecuta las comprobaciones: si alguna falla, no se publica.
# Activación (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Comprobar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobaciones de πCHU
        run: node tests/comprobar.mjs
      - name: Motor de la Pizzería
        run: node tests/pizzeria_motor.test.mjs
      - name: Motor de Integer Ninja
        run: node src/integer-ninja/tests/engine.test.js
      - name: Apps Script de Integer Ninja (simulado)
        run: node src/integer-ninja/tests/apps-script.test.js

  publicar:
    needs: comprobar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
